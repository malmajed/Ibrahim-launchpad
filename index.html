   {q:'The total selection effect is:',o:['0.50%','1.00%','0.60%'],a:0,w:'A: 0.5 × 2 = 1.0. B: 0.5 × (−1) = −0.5. Total 0.5%.'},
   {q:'Active return and the interaction effect are:',o:['1.70% and 0.60%','1.70% and 0.50%','1.20% and 0.60%'],a:0,w:'Portfolio 8.2% − benchmark 6.5% = 1.7% = 0.6 + 0.5 + 0.6.'},
   {q:'The benchmark choice is a problem because a valid benchmark must be:',o:['specified in advance','the lowest-return index available','a peer-group median'],a:0,w:'Choosing it after the fact invites cherry-picking.'}]}],
 quiz:[{q:'With the null hypothesis "the manager has no skill", hiring an unskilled manager is a:',o:['Type I error','Type II error','correct decision'],a:0,w:'Rejecting a true null.'},
  {q:'The Sortino ratio uses:',o:['downside deviation','total standard deviation','beta'],a:0,w:'It penalises only harmful volatility.'},
  {q:'Peer-group benchmarks are weak mainly because they are:',o:['not investable and suffer survivorship bias','too easy to calculate','always too high'],a:0,w:'They fail several validity tests.'},
  {q:'Operational due diligence focuses on:',o:['valuation, custody, compliance and conflicts','the manager\'s stock picks','past returns only'],a:0,w:'Many fund failures are operational, not investment, failures.'}],
 cr:[{q:'Interpret the attribution in the vignette: what were the manager\'s skills this year?',model:`The manager added 1.7%: 0.6% from <b>allocation</b> (overweighting sector A, which beat the benchmark), 0.5% from <b>selection</b> (strong picks in A outweighed weak picks in B), and 0.6% from <b>interaction</b> (overweighting the sector where selection was good). Both allocation and selection contributed positively.`,pts:['Allocation explained','Selection explained (A good, B weak)','Interaction explained']},
  {q:'Evaluate the manager\'s benchmark against <b>two</b> properties of a valid benchmark.',model:`It was <b>not specified in advance</b>, so it may be chosen to flatter results. It may not be <b>accountable</b> or reflect the manager's process if it was picked after the fact. A valid benchmark would be agreed at the start and match the style and universe.`,pts:['Specified in advance property applied','Second property applied (accountable, appropriate, etc.)']}],
 srs:[{q:'Allocation effect (Brinson–Fachler)?',a:'(w_p − w_b)(R_b,i − R_B).'},{q:'Selection effect?',a:'w_b(R_p,i − R_b,i).'},{q:'Type I error in manager selection?',a:'Hiring an unskilled manager.'},{q:'Benchmark validity?',a:'Specified in advance, appropriate, measurable, unambiguous, reflective, accountable, investable.'}],
 read:[{t:'Performance attribution',s:'Wikipedia',u:WIKI('Performance_attribution')},{t:'Sortino ratio',s:'Wikipedia',u:WIKI('Sortino_ratio')},{t:'Information ratio',s:'Wikipedia',u:WIKI('Information_ratio')}]},

/* ---------- x09 Ethics and GIPS ---------- */
{id:'x09',track:'cfa3',topic:'eth',title:'Ethics and GIPS',mins:50,blurb:'Ethics in portfolio management, the Asset Manager Code, and the GIPS standards for firms.',
 lab:{key:'gips',name:'GIPS: required or not?',intro:'Eight practices under the 2020 GIPS standards for firms.'},
 cards:[
  {h:'Ethics at Level III',b:`<p>Cases apply the Code and Standards to portfolio management: suitability across the whole portfolio, fair allocation of trades, soft dollars used for the client's benefit, proxy voting in clients' interests, and disclosure of conflicts. Expect to <b>explain</b> violations and recommend corrective action.</p>`},
  {h:'The Asset Manager Code',b:`<p>A voluntary code for firms: loyalty to clients, investment process and actions, trading, risk management, compliance and support, performance and valuation, and disclosures. Firms claim compliance firm-wide and notify CFA Institute; there is no partial claim.</p>`},
  {h:'GIPS fundamentals',b:`<p>Define the <b>firm</b>; include all actual, fee-paying, discretionary portfolios in at least one <b>composite</b>; use required return methods and valuations (at least monthly); present at least five years (building to ten) of compliant history; follow presentation and disclosure rules. Compliance is firm-wide.</p>`},
  {h:'Verification and claims',b:`<p><b>Verification</b> by an independent third party tests firm-wide policies; it is recommended, not required. A <b>performance examination</b> of a specific composite is optional. Firms may not claim "in compliance except for…" or link simulated results to actual ones.</p>`},
  {h:'Pooled funds and advertising',b:`<p>The 2020 edition added provisions for pooled funds (pooled fund reports) and a section for firms that report to asset owners. Advertisements follow specific GIPS advertising guidelines and must not mislead.</p>`}],
 sets:[{t:'Dunes Asset Management',v:`<p>Dunes Asset Management (fictional) prepares to claim GIPS compliance.</p><p><b>1.</b> It defines the firm as its whole asset-management business. Two non-fee-paying staff accounts are excluded from composites.</p><p><b>2.</b> Its marketing shows a composite with five years of actual results, extended back two more years with a model portfolio "to show the full cycle".</p><p><b>3.</b> A portfolio manager, Lina, uses client brokerage commissions to buy research that benefits all her clients' accounts.</p><p><b>4.</b> Dunes votes proxies on client shares through a policy that maximises long-term value for clients, and records each vote.</p>`,
  qs:[{q:'Excluding the non-fee-paying staff accounts from composites (statement 1) is:',o:['allowed: the requirement covers actual, fee-paying, discretionary portfolios','a violation: all accounts must be included','allowed only if verified'],a:0,w:'Non-fee-paying portfolios may be included but are not required to be.'},
   {q:'Extending the composite with model results (statement 2):',o:['is not permitted under GIPS','is permitted if labelled','is required for a full cycle'],a:0,w:'Simulated or model results may never be linked to actual performance.'},
   {q:'Lina\'s use of client commissions (statement 3) is:',o:['consistent with her duties if the research benefits the clients','a violation of loyalty in every case','allowed only for one client at a time'],a:0,w:'Soft dollars must be used for research that benefits the clients whose trades generated them.'},
   {q:'Dunes\' proxy-voting practice (statement 4) is:',o:['consistent with the duty of loyalty','a violation: proxies should never be voted','unnecessary, since voting has no value'],a:0,w:'Proxies are an asset to be voted in clients\' interests, with a documented policy.'}]}],
 quiz:[{q:'GIPS verification is:',o:['recommended, not required','required for all firms','prohibited for small firms'],a:0,w:'It is strongly encouraged.'},
  {q:'A firm may claim GIPS compliance:',o:['only firm-wide','for selected composites','for any five-year period it chooses'],a:0,w:'No partial claims.'},
  {q:'The Asset Manager Code applies to:',o:['firms, voluntarily','individual candidates only','regulators'],a:0,w:'It complements the Code and Standards for individuals.'},
  {q:'When first claiming compliance, a firm must present at least:',o:['five years of compliant performance (or since inception)','one year','twenty years'],a:0,w:'Then it adds years until it reaches ten.'}],
 cr:[{q:'Identify the GIPS problem in statement 2 of the vignette and recommend how Dunes should present its history.',model:`Linking model results to actual composite performance is <b>not permitted</b>. Dunes should present only the five years of actual composite results; if it shows model results at all, they must be clearly labelled as supplemental, separate from, and not linked to, the actual track record.`,pts:['Violation identified (linking model results)','Correct presentation recommended']},
  {q:'A manager allocates a hot IPO only to the firm\'s performance-fee accounts. Explain which Standard is involved and what the firm should do.',model:`Standard III(B) <b>Fair Dealing</b> (and duties of loyalty): allocations should be fair to all clients for whom the IPO is suitable. The firm should allocate pro rata to all eligible accounts according to a written allocation policy and review allocations for favouritism.`,pts:['III(B) Fair Dealing identified','Corrective policy recommended']}],
 srs:[{q:'GIPS: who must be in composites?',a:'All actual, fee-paying, discretionary portfolios.'},{q:'Is verification required?',a:'No, it is recommended.'},{q:'Can model results be linked to actual?',a:'Never.'},{q:'Minimum initial track record?',a:'Five years (or since inception), building to ten.'}],
 read:[{t:'GIPS standards',s:'CFA Institute',u:'https://www.gipsstandards.org/'},{t:'Code of Ethics and Standards',s:'CFA Institute',u:CFAS},{t:'Asset Manager Code',s:'CFA Institute',u:'https://rpc.cfainstitute.org/codes-and-standards/asset-manager-code'}]},

/* ---------- x10 Constructed-response technique ---------- */
{id:'x10',track:'cfa3',topic:'aa',title:'Constructed-response technique',mins:45,blurb:'Command words, answer templates and time management for Level III written answers. Practised on an IPS case.',
 lab:{key:'crtech',name:'Strong or weak answer?',intro:'Eight habits seen in Level III answers. Which earn points?'},
 cards:[
  {h:'The format',b:`<p>The Level III exam combines <b>item sets</b> (multiple choice) and <b>constructed-response</b> (written) questions on case vignettes. Constructed responses are graded by charterholders against a key. Points go to correct, specific, justified answers, not to length.</p>`},
  {h:'Command words',b:`<ul><li><b>Calculate:</b> formula, inputs, answer.</li><li><b>Determine / Identify:</b> a direct choice.</li><li><b>Justify / Explain:</b> reasons tied to the case.</li><li><b>Recommend:</b> a choice plus why.</li><li><b>Discuss / Evaluate:</b> both sides, then a conclusion.</li></ul>`},
  {h:'A reusable template',b:`<p><b>Answer first</b>, then <b>"because"</b> + one or two case-specific facts. For calculations, write the formula with numbers, then the result with units. Use bullet points. If a template table is provided, fill only what is asked.</p>`},
  {h:'The IPS for individuals',b:`<p><b>Return objective</b>: required return from spending needs and growth goals (state it nominal or real). <b>Risk</b>: ability (horizon, wealth vs needs, flexibility) and willingness (attitudes, behaviour); the overall tolerance is the lower of the two when they conflict. <b>Constraints</b>: time horizon (single or multi-stage), liquidity, taxes, legal, unique circumstances.</p>`},
  {h:'Time',b:`<p>Budget time in proportion to points. If stuck, write the formula and a sensible assumption; partial credit is common. Never leave a part blank.</p>`}],
 sets:[{t:'The Al-Mutairi family IPS',v:`<p>Dr Sara Al-Mutairi, 58, plans to retire in two years. Her portfolio is SAR 6 million. After retirement she will need SAR 300,000 a year from the portfolio, rising with inflation of 2.5%. She wants to preserve the real value of the portfolio for her children. She has no other pension. She says: "I lost sleep in 2020; I never want to see a 20% drop again."</p><p>She plans to give SAR 500,000 to her daughter for a home next year.</p>`,
  qs:[{q:'Ignoring the gift, her required nominal return after retirement (multiplicative) is closest to:',o:['7.6%','5.0%','7.5%'],a:0,w:'Real need: 300,000 ÷ 6,000,000 = 5.0%. Nominal: 1.05 × 1.025 − 1 = 7.6%. After the gift the base falls to SAR 5.5m and the need rises to about 8.1%.'},
   {q:'Her willingness to take risk is best described as:',o:['below average','above average','average'],a:0,w:'Her statement shows strong aversion to drawdowns.'},
   {q:'The SAR 500,000 gift is best treated as:',o:['a near-term liquidity requirement','a long-term return objective','a tax constraint'],a:0,w:'It must be held in liquid, low-risk assets.'},
   {q:'Her time horizon is best described as:',o:['multi-stage: two years to retirement, then a long retirement and bequest stage','single-stage of two years','single-stage of five years'],a:0,w:'Pre-retirement and retirement stages differ.'}]}],
 quiz:[{q:'"Justify" in a constructed-response question requires:',o:['reasons tied to the case facts','a calculation only','a restatement of the question'],a:0,w:'A conclusion without reasons earns partial credit at best.'},
  {q:'When ability and willingness to take risk conflict, overall risk tolerance is usually set:',o:['nearer the lower of the two, with education','at the higher of the two','at the average'],a:0,w:'Respect the client\'s limits while educating them.'},
  {q:'The best way to present a calculation is:',o:['formula, inputs, result with units','result only','a paragraph describing the method'],a:0,w:'Graders can award method points.'},
  {q:'A multi-stage time horizon is common for:',o:['individuals approaching retirement','money-market funds','overnight traders'],a:0,w:'Different stages have different needs.'}],
 cr:[{q:'Formulate Dr Al-Mutairi\'s <b>return objective</b> after retirement.',topic:'aa',model:`She needs SAR 300,000 a year from SAR 6 million: <b>5.0% real</b>, about <b>7.6% nominal</b> (1.05 × 1.025 − 1), to fund spending and preserve the real value of the portfolio for her children. After the SAR 500,000 gift, the base is SAR 5.5 million and the requirement rises to about 5.45% real (about 8.1% nominal).`,pts:['Spending rate calculated (5.0% real)','Inflation added correctly (≈7.6% nominal)','Gift effect considered']},
  {q:'Determine whether her <b>overall</b> risk tolerance is below average, average or above average. Justify with reference to ability and willingness.',topic:'pc',model:`<b>Below average.</b> Ability is about average: a long retirement horizon, but no pension, a demanding spending rate and a near-term gift. Willingness is below average: she cannot tolerate a 20% drawdown. When they conflict, use the lower.`,pts:['Below average determined','Ability assessed with case facts','Willingness assessed with case facts','Rule for conflict applied']}],
 srs:[{q:'Answer template?',a:'Answer first, then "because" + case facts; formula and units for calculations.'},{q:'IPS constraints?',a:'Time horizon, liquidity, taxes, legal/regulatory, unique circumstances.'},{q:'Ability vs willingness conflict?',a:'Lean to the lower; educate the client.'},{q:'Real to nominal required return?',a:'(1 + real)(1 + inflation) − 1.'}],
 read:[{t:'CFA Program: Level III exam',s:'CFA Institute',u:CFAI},{t:'Investment policy statement',s:'Wikipedia',u:WIKI('Investment_policy_statement')},{t:'Risk aversion',s:'Wikipedia',u:WIKI('Risk_aversion')}]}
]);

/* ================= CFA Level III: pathway missions x11–x22 ================= */
addMissions([
/* ================= Portfolio Management pathway ================= */
{id:'x11',track:'cfa3',topic:'path',path:'pm',title:'Pathway PM: index and active equity',mins:55,blurb:'Index construction and replication; active equity styles, long–short structures and portfolio construction.',
 lab:{key:'activeshare',name:'Active share',intro:'Compare a four-stock portfolio with its benchmark and measure how active it really is.'},
 cards:[
  {h:'Index construction',b:`<p>Choices: universe, weighting (market-cap, float-adjusted, equal, fundamental), and rebalancing/reconstitution rules. Equal weighting tilts to small caps and needs more trading; fundamental weighting tilts to value. Reconstitution days bring predictable flows and price pressure.</p>`},
  {h:'Passive implementation',b:`<p><b>Full replication</b> (liquid, few constituents), <b>stratified sampling</b> and <b>optimisation</b> (many or illiquid constituents). Vehicles: index funds, ETFs, futures, total return swaps. Tracking error comes from fees, cash drag, sampling, transaction costs, and dividend timing. Securities lending can offset costs.</p>`},
  {h:'Active approaches',b:`<p><b>Fundamental</b> (judgement, concentrated, bottom-up) vs <b>quantitative</b> (rules, breadth, factor-based). Styles: value, growth, GARP, momentum, quality, income. Activism seeks change through engagement. Biases in fundamental work: confirmation, overconfidence, illusion of control.</p>`},
  {h:'Long–short and extensions',b:`<p>Market-neutral long–short isolates selection. <b>130/30</b>: 130% long, 30% short, 100% net, 160% gross; it relaxes the long-only constraint (raising the transfer coefficient). Costs: borrowing fees, short squeezes, unlimited loss on shorts.</p>`},
  {h:'Portfolio construction',b:`<p>Decide the number and size of positions; manage the <b>active risk budget</b>; use active share (holdings difference) and tracking error (return difference) together. A concentrated stock picker has high active share and moderate tracking error; a factor-timer may have low active share and high tracking error.</p>`}],
 sets:[{t:'Two equity managers',v:`<p>Manager X holds four stocks at 40%, 30%, 20% and 10%; the benchmark holds the same stocks at 25% each. Manager X's tracking error is 2%.</p><p>Manager Y runs a 130/30 fund. An index fund the client owns tracked its benchmark with 0.35% tracking error last year, and charges a 0.10% fee.</p>`,
  qs:[{q:'Manager X\'s active share is:',o:['20%','40%','15%'],a:0,w:'½ × (15 + 5 + 5 + 15) = 20%.'},
   {q:'With 20% active share and 2% tracking error, Manager X is closest to a:',o:['closet indexer','concentrated stock picker','factor bettor'],a:0,w:'Low active share and low tracking error.'},
   {q:'Manager Y\'s gross and net exposures are:',o:['160% gross, 100% net','130% gross, 70% net','100% gross, 160% net'],a:0,w:'130 + 30 = 160 gross; 130 − 30 = 100 net.'},
   {q:'Likely sources of the index fund\'s tracking error include:',o:['fees, cash drag and sampling','active stock selection','leverage'],a:0,w:'Passive funds deviate for implementation reasons.'}]}],
 quiz:[{q:'Equal-weighted indices tend to tilt toward:',o:['smaller companies','the largest companies','growth stocks only'],a:0,w:'Small caps get the same weight as large caps.'},
  {q:'Full replication is most suitable when the index has:',o:['few, liquid constituents','thousands of illiquid constituents','no published constituents'],a:0,w:'Otherwise sampling or optimisation is cheaper.'},
  {q:'Relaxing the long-only constraint mainly raises the:',o:['transfer coefficient','information coefficient','breadth'],a:0,w:'Views can be expressed fully, including negative ones.'},
  {q:'A risk unique to short positions is:',o:['potentially unlimited losses and recall of borrowed shares','limited upside','dividend income'],a:0,w:'Prices can rise without limit.'}],
 cr:[{q:'Recommend a replication method for an index fund tracking a 1,800-stock emerging-market small-cap index, and justify.',model:`<b>Stratified sampling or optimisation.</b> Full replication would be costly: many constituents are small and illiquid with high trading costs. Sampling matches the index's key characteristics (country, sector, size, style) with fewer holdings at an acceptable tracking error.`,pts:['Sampling/optimisation recommended','Cost/illiquidity justification','Risk characteristics matched']},
  {q:'Compare active share and tracking error as measures of active management.',model:`<b>Active share</b> measures how different holdings are from the benchmark; <b>tracking error</b> measures the volatility of return differences. They differ because tracking error depends on correlations: many small, diversified bets give high active share but low tracking error, while a few large factor bets give lower active share but higher tracking error.`,pts:['Active share defined','Tracking error defined','Why they can diverge']}],
 srs:[{q:'Active share?',a:'½ Σ |w_p − w_b|.'},{q:'130/30 exposures?',a:'160% gross, 100% net.'},{q:'Sources of index tracking error?',a:'Fees, cash drag, sampling, trading costs.'},{q:'Equal weighting tilt?',a:'Smaller companies.'}],
 read:[{t:'Index fund',s:'Wikipedia',u:WIKI('Index_fund')},{t:'130–30 fund',s:'Wikipedia',u:WIKI('130%E2%80%9330_fund')},{t:'Active management',s:'Wikipedia',u:WIKI('Active_management')}]},

{id:'x12',track:'cfa3',topic:'path',path:'pm',title:'Pathway PM: fixed income strategies',mins:60,blurb:'Yield curve strategies, expected return decomposition, and active credit management.',
 lab:{key:'fiexp',name:'Expected bond return',intro:'Add income, rolldown, the effect of a rate view, and credit losses.'},
 cards:[
  {h:'Static curve strategies',b:`<p>If you expect the curve to stay put: <b>carry</b> (hold higher-yielding, longer bonds), <b>rolldown</b> (ride the curve), and buy-and-hold. Repo financing can lever carry. Risk: the curve does not stay put.</p>`},
  {h:'Dynamic curve strategies',b:`<p>Duration changes express level views. <b>Barbell vs bullet</b>: a barbell has more convexity and gains relative to a duration-matched bullet when rates move a lot or the curve flattens; a bullet gains when the curve steepens or volatility stays low. <b>Butterflies</b> express curvature views. Options add or sell convexity.</p>`},
  {h:'Expected return decomposition',b:`<p>E(R) ≈ yield income + rolldown + E(price change from yield changes: −D·Δy + ½·C·Δy²) − credit losses ± currency. Rolling yield = income + rolldown.</p>`},
  {h:'Credit strategies',b:`<p>Spread measures: G-spread, I-spread, Z-spread, OAS. Excess return ≈ spread − (spread duration × Δspread) − expected loss. <b>Top-down</b>: credit cycle, sectors, quality. <b>Bottom-up</b>: issuer selection with relative value. High yield is more sensitive to defaults and equity-like risk; investment grade more to spread duration.</p>`},
  {h:'Liquidity and derivatives in credit',b:`<p>Corporate bonds trade less than government bonds; liquidity worsens in stress. CDS let managers change credit exposure quickly, express curve views, and run basis trades. Key rate durations and spread duration by sector manage active risk against the benchmark.</p>`}],
 sets:[{t:'A bond fund\'s outlook',v:`<p>A bond portfolio has yield income of 4.5%, expected rolldown of 0.4%, modified duration 6, convexity 50, and expected credit losses of 0.3%. The manager expects yields to rise by 25 bp.</p><p>Separately, a corporate bond has a spread of 150 bp, spread duration of 5, a default probability of 0.5% a year and a recovery rate of 40%. The manager expects its spread to widen by 20 bp over the year.</p>`,
  qs:[{q:'The portfolio\'s expected return is closest to:',o:['3.12%','4.60%','3.42%'],a:0,w:'4.5 + 0.4 − 1.484 − 0.3 = 3.12%. Price effect: −6 × 0.25% + ½ × 50 × 0.0025² = −1.48%.'},
   {q:'Its rolling yield is:',o:['4.9%','4.5%','4.2%'],a:0,w:'Income 4.5% + rolldown 0.4%.'},
   {q:'The corporate bond\'s expected excess return is closest to:',o:['0.20%','1.20%','0.50%'],a:0,w:'Spread 1.5% − expected loss (0.5% × 60% = 0.3%) − 5 × 0.2% = 0.2%.'},
   {q:'If the manager expected the curve to flatten, a duration-neutral move would be to:',o:['shift from a bullet to a barbell','shift from a barbell to a bullet','shorten duration'],a:0,w:'Barbells gain relative to bullets in a flattening.'}]}],
 quiz:[{q:'A barbell has, compared with a duration-matched bullet:',o:['more convexity','less convexity','the same convexity'],a:0,w:'Cash flows are more dispersed.'},
  {q:'The Z-spread is:',o:['the constant spread over the spot curve that prices the bond','the spread over the nearest government bond','the spread after removing option value'],a:0,w:'OAS removes the option value; the G-spread uses a single government bond.'},
  {q:'In a recession, high-yield spreads usually:',o:['widen more than investment-grade spreads','narrow','move one-for-one with IG spreads'],a:0,w:'Default risk rises sharply.'},
  {q:'A butterfly trade expresses a view on:',o:['curvature','level only','credit quality'],a:0,w:'Body versus wings.'}],
 cr:[{q:'A manager expects rate volatility to rise sharply but has no view on direction. Recommend a duration-neutral curve positioning and justify.',model:`Move to a <b>barbell</b> (or buy options to add convexity). A barbell has more convexity than a bullet of the same duration, so it gains relative to the bullet when yields move a lot in either direction.`,pts:['Barbell / long convexity recommended','Convexity explanation']},
  {q:'Calculate the expected excess return of the corporate bond in the vignette and state the main risk to that estimate.',model:`Excess ≈ 1.50% − 0.5% × (1 − 0.40) − 5 × 0.20% = 1.50 − 0.30 − 1.00 = <b>0.20%</b>. Main risk: spreads widen more than expected (for example in a recession), with spread duration amplifying the loss.`,pts:['Formula applied','0.20% result','Main risk identified']}],
 srs:[{q:'Expected bond return components?',a:'Yield income + rolldown − D·Δy + ½C·Δy² − credit losses ± FX.'},{q:'Barbell vs bullet in flattening?',a:'Barbell wins.'},{q:'Excess credit return?',a:'Spread − spread duration × Δspread − expected loss.'},{q:'Rolling yield?',a:'Income + rolldown.'}],
 read:[{t:'Bond convexity',s:'Wikipedia',u:WIKI('Bond_convexity')},{t:'Z-spread',s:'Wikipedia',u:WIKI('Z-spread')},{t:'Credit spread (bond)',s:'Wikipedia',u:WIKI('Credit_spread_(bond)')}]},

{id:'x13',track:'cfa3',topic:'path',path:'pm',title:'Pathway PM: hedge fund and multi-asset strategies',mins:55,blurb:'Hedge fund strategy families, their risks and roles, and allocating to alternatives.',
 lab:{key:'mergerarb',name:'Merger arbitrage',intro:'Price a stock-for-stock deal spread and its probability-weighted return.'},
 cards:[
  {h:'Strategy families',b:`<ul><li><b>Equity:</b> long/short, dedicated short, equity market neutral.</li><li><b>Event-driven:</b> merger arbitrage, distressed securities.</li><li><b>Relative value:</b> fixed income arbitrage, convertible arbitrage.</li><li><b>Opportunistic:</b> global macro, managed futures (CTAs).</li><li><b>Specialist:</b> volatility, reinsurance/life settlements.</li><li><b>Multi-manager:</b> funds of funds, multi-strategy.</li></ul>`},
  {h:'Risk profiles',b:`<p>Merger arbitrage and many relative-value strategies are like <b>selling puts</b>: steady returns with crash risk. Managed futures and global macro often do well in sustained crises (<b>long-volatility</b>, trend following). Convertible arbitrage is long the convertible and short the stock; it suffers when liquidity dries up.</p>`},
  {h:'Evaluating hedge funds',b:`<p>Use <b>conditional factor models</b>: exposures change between normal and crisis periods. Look beyond Sharpe ratios: skew, kurtosis, drawdowns, liquidity terms (lock-ups, gates), leverage and operational risk.</p>`},
  {h:'Allocating to alternatives',b:`<p>Roles: capital growth (PE), income (private credit, real estate), diversification (hedge funds), inflation hedging (real assets, commodities). Use a <b>risk-factor</b> lens: many alternatives are equity beta in disguise. Plan liquidity: capital calls, unfunded commitments, rebalancing limits; model with Monte Carlo.</p>`},
  {h:'Multi-asset and tactical allocation',b:`<p>Tactical deviations from the SAA need a separate risk budget and evaluation. Signals: valuation, momentum, macro regime. Implement with futures and swaps to save costs.</p>`}],
 sets:[{t:'A merger arbitrage position',v:`<p>Acquirer A offers 0.8 of its shares (trading at SAR 50) for each share of Target T, which trades at SAR 36. Completion is expected in six months with an 85% probability. If the deal fails, T is expected to fall to SAR 28.</p>`,
  qs:[{q:'The offer value per T share is:',o:['SAR 40.00','SAR 36.00','SAR 50.00'],a:0,w:'0.8 × 50 = 40.'},
   {q:'The probability-weighted expected return on T is closest to:',o:['6.1%','11.1%','23.5%'],a:0,w:'(0.85 × 40 + 0.15 × 28) ÷ 36 − 1 = 6.1%. 11.1% assumes completion; 23.5% annualises it.'},
   {q:'The payoff profile of merger arbitrage most resembles:',o:['a short put','a long call','a long straddle'],a:0,w:'Small steady gains, large losses when deals break.'},
   {q:'A convertible arbitrageur typically holds:',o:['a long convertible and a short position in the stock','a short convertible and a long stock position','only the convertible'],a:0,w:'Delta-hedged to capture mispricing and volatility.'}]}],
 quiz:[{q:'Which strategy has historically offered the best crisis protection?',o:['Managed futures (trend following)','Merger arbitrage','Distressed securities'],a:0,w:'Trends often persist in crises.'},
  {q:'Conditional factor models are used because hedge fund exposures:',o:['change in stressed markets','are always zero','are fixed by regulation'],a:0,w:'Correlations rise in crises.'},
  {q:'Many alternative assets, viewed through risk factors, are largely:',o:['equity risk','government bond risk','cash'],a:0,w:'Private equity and high-yield credit carry equity beta.'},
  {q:'Tactical asset allocation should be:',o:['given its own risk budget and evaluated separately','used to change the SAA every month','avoided completely'],a:0,w:'It is a distinct active decision.'}],
 cr:[{q:'A client wants a hedge fund allocation that helps most in a prolonged equity bear market. Recommend a strategy and justify.',model:`<b>Managed futures (trend following) or global macro.</b> They can be short equity and long bonds or currencies during sustained declines, so they tend to have low or negative correlation with equities in crises, unlike merger arbitrage or long/short equity, which carry equity beta.`,pts:['Suitable strategy','Crisis behaviour explained','Contrast with equity-beta strategies']},
  {q:'Discuss <b>two</b> liquidity issues when allocating to private alternatives.',model:`(1) <b>Capital calls and unfunded commitments</b> must be met from liquid assets, possibly in a downturn. (2) The <b>denominator effect</b>: when public assets fall, private allocations rise above target and cannot be rebalanced quickly. Plan with cash-flow models and liquidity tiers.`,pts:['Capital calls / unfunded commitments','Denominator effect or rebalancing limits']}],
 srs:[{q:'Merger arbitrage payoff?',a:'Like a short put.'},{q:'Crisis-alpha strategy?',a:'Managed futures / global macro.'},{q:'Convertible arbitrage position?',a:'Long convertible, short stock.'},{q:'Why conditional factor models?',a:'Exposures change in crises.'}],
 read:[{t:'Hedge fund',s:'Wikipedia',u:WIKI('Hedge_fund')},{t:'Merger arbitrage',s:'Wikipedia',u:WIKI('Risk_arbitrage')},{t:'Managed futures account',s:'Wikipedia',u:WIKI('Managed_futures_account')}]},

{id:'x14',track:'cfa3',topic:'path',path:'pm',title:'Pathway PM: trade strategy and case',mins:55,blurb:'A sovereign wealth fund case that ties allocation, fixed income views and trading together.',
 lab:{key:'curveview',name:'Express the view',intro:'Match each rate view to a positioning.'},
 cards:[
  {h:'Sovereign wealth fund types',b:`<ul><li><b>Stabilisation:</b> smooth budgets against commodity swings; liquid, low-risk.</li><li><b>Savings / intergenerational:</b> long horizon; equities and alternatives.</li><li><b>Reserve investment:</b> manage excess reserves.</li><li><b>Development:</b> invest in the domestic economy and strategic sectors.</li><li><b>Pension reserve:</b> pre-fund future pension costs.</li></ul>`},
  {h:'Correlation with the sponsor',b:`<p>A commodity exporter's fund should avoid adding more exposure to the same commodity cycle. Stabilisation funds need assets that hold value when oil prices fall: high-quality bonds and cash.</p>`},
  {h:'Case technique',b:`<p>Read the case for objectives, constraints and the sponsor's balance sheet. Every recommendation must be tied to a fact. Calculations come with formulas; conclusions come first.</p>`},
  {h:'Trading a large rebalance',b:`<p>Large asset moves use <b>transition managers</b>, crossing networks, futures overlays during the transition, and staged execution to limit market impact. Pre-trade cost estimates and post-trade IS analysis close the loop.</p>`},
  {h:'Governance and ESG',b:`<p>Clear mandates, independent boards, transparency (e.g. the Santiago Principles for SWFs), and policies for responsible investment and stewardship strengthen credibility.</p>`}],
 sets:[{t:'The Gulf Reserve Fund',v:`<p>A Gulf government runs two funds. Fund 1 smooths the budget when oil revenue falls; withdrawals are likely in any year with low oil prices. Fund 2 saves for future generations with a horizon of several decades and no planned withdrawals.</p><p>Fund 2 will move USD 5 billion from global equities to a new real-assets programme over six months.</p>`,
  qs:[{q:'Fund 1 is best classified as a:',o:['stabilisation fund','savings fund','development fund'],a:0,w:'It cushions the budget against commodity shocks.'},
   {q:'Fund 1\'s most appropriate core holdings are:',o:['short- to intermediate-duration high-quality bonds and cash','oil and gas equities','private equity'],a:0,w:'It needs liquidity and low correlation with oil revenue.'},
   {q:'Fund 2 can hold a high allocation to equities and private assets mainly because of its:',o:['long horizon and low liquidity needs','legal requirement to hold equities','correlation with oil'],a:0,w:'Ability to bear risk and illiquidity.'},
   {q:'To keep market exposure while the real-assets programme is built, Fund 2 could:',o:['use equity futures as an overlay on the cash being moved','sell all equities at once on day one','hold the cash uninvested'],a:0,w:'Futures maintain exposure and avoid cash drag.'}]}],
 quiz:[{q:'A development fund primarily invests:',o:['in the domestic economy and strategic sectors','in foreign government bonds only','in cash'],a:0,w:'Its objective is economic development.'},
  {q:'A transition manager is used to:',o:['move large portfolios at low cost and risk','select stocks','audit performance'],a:0,w:'Pre-trade analysis, crossing and staged execution.'},
  {q:'The Santiago Principles are a voluntary framework for:',o:['sovereign wealth fund governance and transparency','pension accounting','central bank policy'],a:0,w:'Generally Accepted Principles and Practices for SWFs.'},
  {q:'Expecting rates to fall in a parallel shift, a manager should:',o:['extend duration','shorten duration','buy a barbell of the same duration'],a:0,w:'Level views use duration.'}],
 cr:[{q:'Recommend an asset allocation approach for Fund 1 and justify with <b>two</b> facts from the case.',model:`A conservative, liquid allocation dominated by <b>high-quality, short-to-intermediate bonds and cash</b>. (1) Withdrawals are likely whenever oil prices fall, so liquidity is essential. (2) The fund must not be correlated with oil revenue; risky assets tend to fall when oil does.`,pts:['Conservative liquid allocation','Liquidity justification','Correlation-with-oil justification']},
  {q:'Explain how Fund 2 should implement the USD 5 billion transition.',model:`Appoint a <b>transition manager</b>; estimate costs pre-trade; cross positions where possible; stage trades over time to limit impact; use <b>futures overlays</b> to keep target exposure on cash in transition; measure results with implementation shortfall.`,pts:['Transition manager / staged execution','Overlay to keep exposure','Cost measurement']}],
 srs:[{q:'Stabilisation fund holdings?',a:'Liquid, high-quality bonds and cash.'},{q:'Savings fund horizon?',a:'Decades: equities and private assets.'},{q:'Transition manager role?',a:'Low-cost movement of large portfolios.'},{q:'SWF governance framework?',a:'Santiago Principles.'}],
 read:[{t:'Sovereign wealth fund',s:'Wikipedia',u:WIKI('Sovereign_wealth_fund')},{t:'Santiago Principles',s:'IFSWF',u:'https://www.ifswf.org/santiago-principles-landing/santiago-principles'},{t:'Public Investment Fund',s:'Wikipedia',u:WIKI('Public_Investment_Fund')}]},

/* ================= Private Markets pathway ================= */
{id:'x15',track:'cfa3',topic:'path',path:'pmk',title:'Pathway Private Markets: private equity and private debt',mins:60,blurb:'Fund structures and economics, buyout and venture value creation, and the private credit spectrum.',
 lab:{key:'pefund',name:'PE fund scorecard',intro:'From commitments, calls, distributions and NAV to DPI, RVPI and TVPI.'},
 cards:[
  {h:'Fund structure and terms',b:`<p>Limited partnership: GP manages, LPs commit capital that is <b>called</b> over the investment period. Terms: management fee (on committed, then invested capital), <b>carried interest</b> (typically 20%), <b>hurdle</b> (e.g. 8%), GP catch-up, clawback, key-person clauses.</p>`},
  {h:'Waterfalls',b:`<p><b>European (whole-of-fund):</b> LPs get all contributed capital plus the hurdle before carry; LP-friendly. <b>American (deal-by-deal):</b> carry on each realised deal; GP-friendly, so clawbacks matter.</p>`},
  {h:'Private equity strategies',b:`<p><b>Buyouts</b>: leverage, operational improvement, multiple expansion. <b>Growth equity</b>: minority stakes in expanding companies. <b>Venture</b>: high failure rates, power-law returns. Exit routes: trade sale, IPO, secondary buyout, recapitalisation.</p>`},
  {h:'Private debt',b:`<p><b>Direct lending</b> (senior secured, floating rate, covenants), <b>unitranche</b>, <b>mezzanine</b> (subordinated, often with warrants), <b>venture debt</b>, <b>distressed debt</b>, and specialty finance. Returns come from higher spreads, fees and illiquidity premia; risks from defaults, concentration and leverage.</p>`},
  {h:'Measuring performance',b:`<p>DPI (realised), RVPI (unrealised), TVPI = DPI + RVPI, and IRR. Early years show the J-curve. NAVs are appraisal-based and lag public markets.</p>`}],
 sets:[{t:'A buyout fund in year 6',v:`<p>An LP committed USD 100 million to a buyout fund six years ago. Paid-in capital is USD 80 million; distributions total USD 60 million; residual NAV is USD 70 million.</p><p>The fund uses a European waterfall with an 8% hurdle and 20% carry. The LP is also considering a direct-lending fund.</p>`,
  qs:[{q:'The fund\'s TVPI is:',o:['1.625×','0.750×','0.875×'],a:0,w:'(60 + 70) ÷ 80 = 1.625. DPI is 0.75; RVPI is 0.875.'},
   {q:'The LP\'s unfunded commitment is:',o:['USD 20m','USD 40m','USD 30m'],a:0,w:'100 − 80.'},
   {q:'Under the European waterfall, the GP receives carry:',o:['only after LPs receive all contributed capital plus the hurdle','on each deal as it is sold','from the first distribution'],a:0,w:'Whole-of-fund approach.'},
   {q:'Direct-lending loans are typically:',o:['senior secured and floating-rate','unsecured and fixed-rate','equity-linked'],a:0,w:'Rate rises increase income; covenants protect lenders.'}]}],
 quiz:[{q:'A clawback provision protects:',o:['LPs, if the GP was paid too much carry earlier','the GP from losses','lenders to the fund'],a:0,w:'Common with deal-by-deal waterfalls.'},
  {q:'Mezzanine debt is:',o:['subordinated debt, often with warrants','senior secured bank debt','common equity'],a:0,w:'Higher return for lower ranking.'},
  {q:'The main value-creation levers in a buyout are:',o:['operational improvement, leverage and multiple expansion','dividend yield only','index rebalancing'],a:0,w:'Leverage amplifies results.'},
  {q:'The J-curve arises because:',o:['fees and costs come early while value creation and exits come later','funds lose money every year','distributions come first'],a:0,w:'Typical for closed-end funds.'}],
 cr:[{q:'Explain the difference between a European and an American waterfall and which an LP should prefer.',model:`European (whole-of-fund): carry is paid only after LPs have received all contributed capital and the hurdle across the fund. American (deal-by-deal): carry is paid as each deal is realised, so the GP may be paid early even if later deals lose money. LPs should prefer the <b>European</b> structure, or require an effective clawback under an American one.`,pts:['European described','American described','LP preference with reason']},
  {q:'Evaluate the fund in the vignette using DPI and TVPI.',model:`DPI 0.75×: LPs have not yet received their paid-in capital back in cash. TVPI 1.625×: total value is solid, but 54% of it (70 of 130) is unrealised NAV, which depends on appraisals and future exits.`,pts:['DPI interpreted','TVPI interpreted','Reliance on unrealised NAV noted']}],
 srs:[{q:'TVPI?',a:'DPI + RVPI.'},{q:'European waterfall?',a:'Carry only after all capital + hurdle returned (LP-friendly).'},{q:'Direct lending loans?',a:'Senior secured, floating-rate, covenants.'},{q:'Clawback?',a:'GP returns excess carry.'}],
 read:[{t:'Private equity',s:'Wikipedia',u:WIKI('Private_equity')},{t:'Private credit',s:'Wikipedia',u:WIKI('Private_credit')},{t:'Carried interest',s:'Wikipedia',u:WIKI('Carried_interest')}]},

{id:'x16',track:'cfa3',topic:'path',path:'pmk',title:'Pathway Private Markets: real estate and infrastructure',mins:55,blurb:'Core to opportunistic real estate, DCF valuation, and infrastructure risk and return.',
 lab:{key:'redcf',name:'Property DCF',intro:'Value a property from growing NOI and an exit cap rate.'},
 cards:[
  {h:'Real estate strategies',b:`<p><b>Core</b>: stabilised, high-quality, low leverage, income-driven. <b>Core-plus</b>: some upside. <b>Value-add</b>: refurbishment or re-leasing. <b>Opportunistic</b>: development and distress, high leverage. Return drivers shift from income to appreciation as risk rises.</p>`},
  {h:'Valuation',b:`<p>Direct capitalisation (NOI ÷ cap rate) and DCF with an exit cap rate. Cap rates move with interest rates, risk premia and growth expectations. Leverage raises equity returns and risk. Private real estate indices are smoothed.</p>`},
  {h:'Infrastructure basics',b:`<p>Economic infrastructure (transport, energy, utilities, digital) vs social infrastructure (hospitals, schools). <b>Brownfield</b> (operating) vs <b>greenfield</b> (to be built: construction risk). Revenue models: regulated, contracted (availability payments), or demand-based (tolls).</p>`},
  {h:'Infrastructure risks',b:`<p>Construction, demand, regulatory/political, refinancing, and operational risks. <b>Availability payments</b> transfer demand risk to the government; <b>toll</b> models leave it with investors. Many revenues are inflation-linked, making infrastructure a partial inflation hedge.</p>`},
  {h:'Public vs private access',b:`<p>REITs and listed infrastructure offer liquidity but behave like equities in the short term; private funds offer control and a smoother (appraisal) profile, with illiquidity and fees. Saudi Arabia's Vision 2030 has created large real estate and infrastructure pipelines, including PPPs.</p>`}],
 sets:[{t:'Valuing a Riyadh office building',v:`<p>An office building has expected NOI of SAR 10 million next year, growing 2% a year. The investor plans to hold it for five years and sell at a 7% cap rate on year-6 NOI. The discount rate is 8.5%.</p><p>The investor also compares two road projects: one paid by government availability payments, one financed by tolls.</p>`,
  qs:[{q:'The property\'s value today is closest to:',o:['SAR 145.8m','SAR 157.7m','SAR 142.9m'],a:0,w:'PV of NOI 40.88 + PV of exit 157.73 ÷ 1.085⁵ = 104.90; total 145.78.'},
   {q:'The expected sale price in year 5 is closest to:',o:['SAR 157.7m','SAR 145.8m','SAR 142.9m'],a:0,w:'NOI year 6 = 10 × 1.02⁵ = 11.04; ÷ 0.07 = 157.73.'},
   {q:'The implied going-in cap rate is closest to:',o:['6.86%','7.00%','8.50%'],a:0,w:'10 ÷ 145.78 = 6.86%.'},
   {q:'Compared with the toll road, the availability-payment road has:',o:['lower demand risk','higher demand risk','the same demand risk'],a:0,w:'The government pays if the road is available, whatever the traffic.'}]}],
 quiz:[{q:'Opportunistic real estate returns come mainly from:',o:['appreciation, with high leverage and development risk','stable rental income','government guarantees'],a:0,w:'The highest-risk end of the spectrum.'},
  {q:'A greenfield infrastructure project carries:',o:['construction risk','no operational risk','no regulatory risk'],a:0,w:'The asset has yet to be built.'},
  {q:'Rising interest rates usually push cap rates:',o:['up, lowering property values','down','not at all'],a:0,w:'Higher discount rates reduce value.'},
  {q:'Infrastructure is a partial inflation hedge because:',o:['many revenues are contractually linked to inflation','it has no costs','its prices never change'],a:0,w:'Regulated and contracted tariffs often index to CPI.'}],
 cr:[{q:'Recommend core or opportunistic real estate for an insurer seeking stable income with limited risk. Justify.',model:`<b>Core.</b> Stabilised, high-quality, low-leverage properties produce most of their return from rental income, which matches the insurer's need for stable income and its limited risk tolerance (and capital rules).`,pts:['Core recommended','Income justification','Risk / leverage justification']},
  {q:'Explain two risks a greenfield toll-road investor bears that a brownfield availability-payment investor does not.',model:`(1) <b>Construction risk</b>: delays and cost overruns before revenue starts. (2) <b>Demand (traffic) risk</b>: revenue depends on usage, which may fall short of forecasts.`,pts:['Construction risk','Demand risk']}],
 srs:[{q:'Value by direct capitalisation?',a:'NOI ÷ cap rate.'},{q:'Availability payments?',a:'Government pays for availability; investor avoids demand risk.'},{q:'Greenfield vs brownfield?',a:'To be built vs operating.'},{q:'Core real estate return source?',a:'Mostly income.'}],
 read:[{t:'Capitalization rate',s:'Wikipedia',u:WIKI('Capitalization_rate')},{t:'Public–private partnership',s:'Wikipedia',u:WIKI('Public%E2%80%93private_partnership')},{t:'Saudi Vision 2030',s:'Official site',u:'https://www.vision2030.gov.sa/'}]},

{id:'x17',track:'cfa3',topic:'path',path:'pmk',title:'Pathway Private Markets: fund structures, due diligence and performance',mins:55,blurb:'Vehicles and terms, investment and operational due diligence, IRR, multiples and PME.',
 lab:{key:'fundirr',name:'Fund IRR and the J-curve',intro:'Turn a fund\'s calls and distributions into an IRR and a multiple.'},
 cards:[
  {h:'Vehicles',b:`<p>Closed-end limited partnerships (10–12 years), evergreen/open-ended funds, separately managed accounts, funds of funds, feeder funds, and listed vehicles. Each trades off control, diversification, fees and liquidity.</p>`},
  {h:'Key terms in the LPA',b:`<p>Commitment period, fees and carry, hurdle and catch-up, key-person and no-fault divorce clauses, GP commitment (alignment), LP advisory committee, co-investment rights, and reporting standards.</p>`},
  {h:'Due diligence',b:`<p><b>Investment</b>: strategy, team, track record (attributable to current team), sourcing, value creation. <b>Operational</b>: valuation policy, fund administration, custody, compliance, conflicts (e.g. cross-fund deals, fee offsets), cybersecurity, ESG integration.</p>`},
  {h:'Performance measures',b:`<p><b>IRR</b> is timing-sensitive; subscription credit lines delay capital calls and raise IRR without changing multiples. <b>MOIC/TVPI</b> ignore timing. <b>PME</b> compares with a public index: Kaplan–Schoar PME above 1 means outperformance. Compare within the same <b>vintage year</b> and use quartiles.</p>`},
  {h:'Reporting and valuation',b:`<p>NAVs follow fair-value guidelines (IPEV) but lag markets. Look for consistent policies, auditor review, and transparency on fees and expenses (ILPA templates).</p>`}],
 sets:[{t:'Evaluating a fund\'s track record',v:`<p>A fund called USD 40m in year 0, 30m in year 1 and 20m in year 2, then distributed 10m, 30m, 50m and 60m in years 3 to 6.</p><p>A second GP reports a higher IRR on a similar multiple, having used a subscription credit line to delay capital calls by about a year.</p><p>A third fund has a Kaplan–Schoar PME of 1.15 against the MSCI World index.</p>`,
  qs:[{q:'The first fund\'s IRR is closest to:',o:['12.7%','16.7%','10.0%'],a:0,w:'Solving NPV = 0 gives 12.7%.'},
   {q:'Its multiple of distributions to paid-in capital is closest to:',o:['1.67×','1.50×','2.00×'],a:0,w:'150 ÷ 90 = 1.67×.'},
   {q:'The subscription credit line mainly:',o:['raises IRR without improving the multiple','raises both IRR and the multiple','lowers IRR'],a:0,w:'It shortens the period LP capital is invested.'},
   {q:'A Kaplan–Schoar PME of 1.15 means the fund:',o:['outperformed the public index','underperformed the public index','matched the public index'],a:0,w:'A value above 1 indicates outperformance.'}]}],
 quiz:[{q:'A key-person clause allows LPs to:',o:['suspend investing if named key professionals leave','replace the auditor','receive carry'],a:0,w:'Protects against loss of the team.'},
  {q:'Comparing funds is most meaningful within the same:',o:['vintage year and strategy','currency','fund size'],a:0,w:'Market conditions differ by vintage.'},
  {q:'Operational due diligence would examine:',o:['valuation policy, administration and conflicts','only the GP\'s past IRR','the stock market outlook'],a:0,w:'Non-investment risks.'},
  {q:'Multiples (TVPI) ignore:',o:['the timing of cash flows','distributions','NAV'],a:0,w:'Use IRR or PME to capture timing.'}],
 cr:[{q:'Explain why a high IRR alone may mislead an LP evaluating a GP, giving <b>two</b> reasons.',model:`(1) IRR is sensitive to timing: early small distributions or <b>subscription lines</b> can inflate it without more money returned. (2) It assumes reinvestment at the IRR and does not show <b>scale</b>: a high IRR on a short, small deal may add little wealth. Use multiples and PME alongside IRR.`,pts:['Timing / subscription line effect','Scale or reinvestment issue','Complementary measures suggested']},
  {q:'List <b>three</b> items an LP should review in operational due diligence of a new private-markets manager.',model:`Valuation policy and its governance; fund administration and independent custody/auditor; conflicts-of-interest policies (fee allocation, cross-fund deals, co-investment allocation); also compliance, cybersecurity and key-person risk.`,pts:['Valuation','Administration / audit','Conflicts or compliance']}],
 srs:[{q:'Effect of subscription lines?',a:'Higher IRR, same multiple.'},{q:'PME above 1?',a:'Outperformed the public index.'},{q:'Compare funds by?',a:'Vintage year and strategy, using quartiles.'},{q:'Key-person clause?',a:'Suspends investment if key staff leave.'}],
 read:[{t:'Public market equivalent',s:'Wikipedia',u:WIKI('Public_Market_Equivalent')},{t:'Internal rate of return',s:'Wikipedia',u:WIKI('Internal_rate_of_return')},{t:'ILPA principles and templates',s:'ILPA',u:'https://ilpa.org/'}]},

{id:'x18',track:'cfa3',topic:'path',path:'pmk',title:'Pathway Private Markets: case',mins:55,blurb:'A family office builds a private-markets programme: pacing, vehicles and liquidity.',
 lab:{key:'pmvehicle',name:'Choose the vehicle',intro:'Primaries, secondaries, co-investments or semi-liquid funds?'},
 cards:[
  {h:'Commitment pacing',b:`<p>To reach a target NAV in private markets, investors must <b>overcommit</b>, because capital is called gradually and returned before all is invested. A rough rule: commitments ≈ target NAV ÷ average invested ratio. Commit steadily across vintages for diversification.</p>`},
  {h:'Secondaries',b:`<p>Buying existing LP interests (or GP-led continuation vehicles) at a discount or premium to NAV: shorter J-curve, more visibility on assets, vintage diversification. Sellers use them for liquidity or portfolio management.</p>`},
  {h:'Co-investments',b:`<p>Investing directly alongside a GP in a specific deal, usually with low or no fees and carry. Requires fast decision-making and adds concentration and adverse-selection risk.</p>`},
  {h:'Semi-liquid (evergreen) funds',b:`<p>Fully invested from day one, no capital calls, periodic subscriptions and limited redemptions (with gates). Suited to private wealth; risks include cash drag, valuation lags and redemption queues in stress.</p>`},
  {h:'Liquidity planning',b:`<p>Model calls and distributions under stress; keep a liquidity buffer; consider the denominator effect; and avoid forced selling of secondaries at deep discounts.</p>`}],
 sets:[{t:'The Al-Rashid family office',v:`<p>A family office with USD 1 billion wants a 15% NAV allocation to private markets within five years. Its advisers estimate that, on average, 60% of commitments will be invested at any time. The family has no private assets today and dislikes a long J-curve.</p><p>One family member wants to invest in single deals alongside a trusted GP; another needs the ability to redeem periodically.</p>`,
  qs:[{q:'Total commitments needed to reach the target NAV are approximately:',o:['USD 250m','USD 150m','USD 90m'],a:0,w:'Target NAV 150m ÷ 0.60 = 250m.'},
   {q:'To shorten the J-curve, the office could start with:',o:['secondary purchases','only new primary commitments','venture capital funds'],a:0,w:'Secondaries are already invested and closer to distributions.'},
   {q:'Investing in single deals alongside a GP is a:',o:['co-investment','secondary purchase','fund of funds'],a:0,w:'Lower fees but higher concentration.'},
   {q:'For the member who needs periodic redemptions, the best fit is:',o:['an evergreen semi-liquid fund','a 12-year closed-end buyout fund','a co-investment'],a:0,w:'Periodic liquidity, subject to gates.'}]}],
 quiz:[{q:'Overcommitment is needed because:',o:['capital is called gradually and returned before all is invested','fees are high','NAV always falls'],a:0,w:'Commitments ≠ invested capital.'},
  {q:'A risk specific to co-investments is:',o:['adverse selection and concentration','too much diversification','no fees'],a:0,w:'GPs may offer less attractive deals.'},
  {q:'Semi-liquid funds can impose:',o:['redemption gates in stress','unlimited daily liquidity','capital calls'],a:0,w:'Liquidity is limited by design.'},
  {q:'Vintage-year diversification means:',o:['committing steadily over several years','committing all capital in one year','buying only new funds'],a:0,w:'Avoids timing risk.'}],
 cr:[{q:'Design a programme for the family office in the vignette using primaries, secondaries and co-investments. Justify the role of each.',model:`<b>Secondaries first</b> to build NAV quickly and shorten the J-curve; <b>primary commitments</b> paced evenly across vintages (≈USD 250m total) to build long-term exposure with top GPs; <b>a modest co-investment sleeve</b> with trusted GPs to cut fees, capped to limit concentration. Hold a liquidity buffer for calls.`,pts:['Secondaries role','Primaries and pacing','Co-investment role and limit','Liquidity buffer']},
  {q:'Explain the denominator effect and its consequence for the family office.',model:`When public markets fall, the total portfolio shrinks while private NAVs adjust slowly, so the private allocation rises above target. The office may be unable to rebalance, may have to slow new commitments, and must still meet capital calls, so it needs a liquidity plan.`,pts:['Mechanism explained','Consequence for commitments / liquidity']}],
 srs:[{q:'Commitments for a target NAV?',a:'≈ target NAV ÷ average invested ratio.'},{q:'Secondaries benefit?',a:'Shorter J-curve, visibility, vintage diversification.'},{q:'Co-investment trade-off?',a:'Lower fees vs concentration and adverse selection.'},{q:'Denominator effect?',a:'Public falls push private weights above target.'}],
 read:[{t:'Secondary market (private equity)',s:'Wikipedia',u:WIKI('Private_equity_secondary_market')},{t:'Family office',s:'Wikipedia',u:WIKI('Family_office')},{t:'Co-investment',s:'Wikipedia',u:WIKI('Co-investment')}]},

/* ================= Private Wealth pathway ================= */
{id:'x19',track:'cfa3',topic:'path',path:'pw',title:'Pathway Private Wealth: clients, IPS and taxes',mins:55,blurb:'Discovering a private client, writing the IPS, and managing taxes across accounts and borders.',
 lab:{key:'taxacc',name:'After-tax accumulation',intro:'Compare annual taxation, deferral and exemption over long horizons.'},
 cards:[
  {h:'Knowing the client',b:`<p>Goals (needs, wants, wishes), family and business situation, values and preferences (including Sharia compliance or ESG), attitudes to risk, and the full balance sheet: financial capital, <b>human capital</b>, real estate, business interests and liabilities.</p>`},
  {h:'The private client IPS',b:`<p>Background and goals, return objective, risk tolerance (ability and willingness), constraints (horizon, liquidity, taxes, legal, unique circumstances), asset allocation, rebalancing, reporting and review. Review at least annually and after life events.</p>`},
  {h:'How taxes work on portfolios',b:`<p>Income, capital gains, wealth and transfer taxes; withholding taxes on foreign dividends; tax treaties. Accrual taxes compound against you; deferred taxes allow tax-free compounding until sale. Saudi residents generally pay no personal income tax on investments, but cross-border holdings, foreign withholding and other residencies (e.g. US persons) can create obligations.</p>`},
  {h:'Tax-efficient strategies',b:`<p>Hold assets longer (deferral), <b>tax-loss harvesting</b> (realise losses to offset gains), <b>asset location</b>, choosing tax-efficient vehicles (ETFs, index funds), and timing of realisations. Value depends on rates, horizons and the client's jurisdictions.</p>`},
  {h:'Managing the relationship',b:`<p>Clear communication of risks and fees (Standard V(B)), regular reporting, behavioural coaching in volatile markets, and documenting suitability. Trust drives retention more than returns.</p>`}],
 sets:[{t:'A client with assets in a taxed jurisdiction',v:`<p>A client invests SAR 1,000,000 for 20 years at a 7% pre-tax return in a jurisdiction with a 25% tax rate. She compares three accounts: taxed every year, tax-deferred until sale, and tax-exempt.</p><p>She also has unrealised losses on one fund and gains on another.</p>`,
  qs:[{q:'The tax-deferred account\'s ending value is closest to:',o:['SAR 3,152,263','SAR 2,782,544','SAR 3,869,684'],a:0,w:'1,000,000 × (1.07²⁰ × 0.75 + 0.25) = 3,152,263.'},
   {q:'The account taxed every year ends closest to:',o:['SAR 2,782,544','SAR 3,152,263','SAR 2,902,263'],a:0,w:'1,000,000 × (1 + 0.07 × 0.75)²⁰ = 2,782,544.'},
   {q:'Realising the fund losses to offset gains is called:',o:['tax-loss harvesting','asset location','wash trading'],a:0,w:'It reduces current tax and may defer tax overall.'},
   {q:'Asset location means:',o:['placing tax-inefficient assets in tax-advantaged accounts','choosing which country to live in','diversifying across sectors'],a:0,w:'It raises after-tax returns without changing the overall allocation.'}]}],
 quiz:[{q:'Human capital is:',o:['the present value of future earnings from work','the client\'s education costs','the value of her business'],a:0,w:'It is part of total wealth.'},
  {q:'The value of tax deferral rises with:',o:['longer horizons and higher returns','shorter horizons','lower returns'],a:0,w:'Tax-free compounding has more time to work.'},
  {q:'An IPS for a private client should be reviewed:',o:['at least annually and after major life events','only when markets fall','never once signed'],a:0,w:'Circumstances change.'},
  {q:'Foreign dividends often face:',o:['withholding taxes at source','no tax anywhere','only capital gains tax'],a:0,w:'Treaties may reduce rates.'}],
 cr:[{q:'Recommend how a client with both a tax-deferred and a taxable account should locate high-yield bonds and a broad equity index ETF. Justify.',model:`Put the <b>high-yield bonds in the tax-deferred account</b>: their return is mostly ordinary income taxed each year. Put the <b>equity ETF in the taxable account</b>: much of its return is deferred capital gains, and ETFs are tax-efficient.`,pts:['High yield in tax-deferred','Equity ETF in taxable','Reasoning about income vs deferred gains']},
  {q:'Explain <b>two</b> ways the adviser should account for the client\'s human capital in the asset allocation.',model:`(1) Assess its risk: a stable salary is bond-like, allowing more equity in financial capital; a bonus- or business-linked income is equity-like, calling for less. (2) Check correlation with the portfolio: avoid concentrating financial assets in the same industry as her job (e.g. her employer's shares).`,pts:['Bond-like vs equity-like','Correlation / concentration with employer or sector']}],
 srs:[{q:'Deferred FV formula?',a:'(1 + r)^n (1 − t) + t.'},{q:'Accrual FV formula?',a:'(1 + r(1 − t))^n.'},{q:'Tax-loss harvesting?',a:'Realise losses to offset gains.'},{q:'Asset location?',a:'Tax-inefficient assets in tax-advantaged accounts.'}],
 read:[{t:'Tax-loss harvesting',s:'Wikipedia',u:WIKI('Tax_loss_harvesting')},{t:'Human capital',s:'Wikipedia',u:WIKI('Human_capital')},{t:'ZATCA (Zakat, Tax and Customs Authority)',s:'ZATCA',u:'https://zatca.gov.sa/en/'}]},

{id:'x20',track:'cfa3',topic:'path',path:'pw',title:'Pathway Private Wealth: estate, family and philanthropy',mins:55,blurb:'Estate planning tools, succession and family governance, Islamic inheritance, and giving well.',
 lab:{key:'giftbeq',name:'Gift now or bequest later?',intro:'Compare the after-tax value of a lifetime gift with a bequest.'},
 cards:[
  {h:'Estate planning tools',b:`<p>Wills, trusts (revocable and irrevocable), foundations, life insurance, and holding companies. Goals: transfer wealth efficiently, provide for dependants, maintain control, protect assets and reduce disputes. Probate is public and slow in many jurisdictions.</p>`},
  {h:'Gifts vs bequests',b:`<p>Relative value = FV of the gift in the recipient's hands ÷ FV of the bequest. Gifts can win when the recipient's tax rate is lower, when estate tax exceeds gift tax, and when assets are expected to appreciate. Saudi Arabia has no estate tax, but clients with foreign assets may face foreign transfer taxes.</p>`},
  {h:'Islamic inheritance and forced heirship',b:`<p>Under Islamic inheritance rules, heirs receive fixed shares; a person may generally bequeath up to <b>one-third</b> of the estate by will to non-heirs. Many civil-law countries also have forced heirship. Planning therefore focuses on lifetime gifts, <b>waqf</b> (endowments), family holding structures and governance, with Sharia and legal advice.</p>`},
  {h:'Family governance and succession',b:`<p>A <b>family constitution</b> sets values, decision rights and rules for employment, dividends and share transfers; family councils and boards implement it. Succession plans for the family business cover leadership, ownership and liquidity for non-active members. Prepare the next generation through education.</p>`},
  {h:'Philanthropy',b:`<p>Vehicles: direct gifts, donor-advised funds, private foundations, waqf, and impact investing. Define the mission, the time horizon (perpetual or spend-down) and measurement of outcomes.</p>`}],
 sets:[{t:'Planning for the Al-Fahd family',v:`<p>A client with assets in a foreign jurisdiction is considering giving 1 unit of capital to his son now versus leaving it as a bequest in 15 years. In that jurisdiction, gifts are tax-free; bequests face 40% estate tax. Both would earn 6% pre-tax; the son pays 20% tax on investment returns, the father 30%.</p><p>His Saudi assets will pass under Islamic inheritance rules. The family also owns a large trading business with three active and four non-active family shareholders.</p>`,
  qs:[{q:'The relative value of the gift versus the bequest is closest to:',o:['1.82','1.00','0.55'],a:0,w:'[(1.048)¹⁵ × 1] ÷ [(1.042)¹⁵ × 0.60] = 2.020 ÷ 1.112 = 1.82.'},
   {q:'A relative value above 1 means:',o:['the gift transfers more after-tax wealth than the bequest','the bequest is better','both are equal'],a:0,w:'Gift now.'},
   {q:'Under Islamic inheritance rules, a will can generally direct:',o:['up to one-third of the estate to non-heirs','the whole estate to any person','nothing; wills are not allowed'],a:0,w:'The remainder passes in fixed shares to heirs.'},
   {q:'A family constitution mainly serves to:',o:['set governance rules for ownership, employment and decisions','reduce income tax','replace the company\'s articles of association'],a:0,w:'It reduces conflict between active and non-active members.'}]}],
 quiz:[{q:'A waqf is:',o:['an Islamic endowment dedicating assets to a charitable or family purpose','a type of bond','a bank account'],a:0,w:'Assets are held in perpetuity for a purpose.'},
  {q:'Gifts tend to beat bequests when:',o:['the recipient faces a lower tax rate and estate tax exceeds gift tax','the donor faces a lower tax rate','estate tax is zero and gift tax is high'],a:0,w:'Tax asymmetries drive the result.'},
  {q:'A donor-advised fund lets a donor:',o:['give now and recommend grants over time','avoid all governance','borrow against charitable assets'],a:0,w:'Simpler than a private foundation.'},
  {q:'A succession plan for a family business should address:',o:['leadership, ownership and liquidity for non-active members','only tax rates','only dividend policy'],a:0,w:'All three cause disputes if neglected.'}],
 cr:[{q:'Calculate the relative value of the gift in the vignette and recommend a course of action.',model:`RV = (1 + 0.06 × 0.8)¹⁵ × (1 − 0) ÷ [(1 + 0.06 × 0.7)¹⁵ × (1 − 0.4)] = 2.020 ÷ 1.112 = <b>1.82</b>. Recommend <b>gifting now</b>: it transfers about 82% more after-tax wealth, mainly because the gift avoids the 40% estate tax and the son pays lower tax on returns.`,pts:['Formula with inputs','RV ≈ 1.82','Recommendation with reason']},
  {q:'Recommend <b>two</b> governance measures for the family business with active and non-active shareholders.',model:`(1) A <b>family constitution</b> setting dividend policy, employment rules and share-transfer rules (e.g. buy-back rights) to balance active and non-active members. (2) A <b>family council</b> and an independent board, with clear succession plans and liquidity mechanisms for members who wish to exit.`,pts:['Family constitution with content','Council / independent board / liquidity mechanism']}],
 srs:[{q:'Relative value of gift vs bequest?',a:'[1 + r_g(1 − t_ig)]^n (1 − T_g) ÷ [1 + r_e(1 − t_ie)]^n (1 − T_e).'},{q:'Bequeathable share under Islamic inheritance?',a:'Up to one-third, to non-heirs.'},{q:'Family constitution?',a:'Rules for ownership, employment, decisions.'},{q:'Waqf?',a:'Islamic endowment.'}],
 read:[{t:'Islamic inheritance jurisprudence',s:'Wikipedia',u:WIKI('Islamic_inheritance_jurisprudence')},{t:'Waqf',s:'Wikipedia',u:WIKI('Waqf')},{t:'Family business governance',s:'Wikipedia',u:WIKI('Family_business')}]},

{id:'x21',track:'cfa3',topic:'path',path:'pw',title:'Pathway Private Wealth: risk management and insurance',mins:50,blurb:'Human capital, the risks to an individual\'s balance sheet, and insurance and annuities.',
 lab:{key:'humancap',name:'Human capital',intro:'Value future earnings and see how much of total wealth they represent.'},
 cards:[
  {h:'The individual balance sheet',b:`<p>Assets: financial capital, <b>human capital</b> (PV of future earnings), real estate, business interests, pension rights. Liabilities: debts, and the PV of future consumption and goals. Human capital dominates for young people and declines toward retirement.</p>`},
  {h:'Risks to individuals',b:`<p><b>Earnings</b> (disability, job loss), <b>premature death</b>, <b>longevity</b> (outliving assets), <b>property</b>, <b>liability</b>, and <b>health</b> risk. Manage each by avoiding, reducing, transferring (insurance) or retaining.</p>`},
  {h:'Life insurance',b:`<p>Term (pure protection, cheap) vs permanent (whole/universal life, with savings). Amount: <b>human life value</b> (PV of earnings net of personal consumption) or <b>needs analysis</b> (PV of family needs − existing resources). Takaful offers a Sharia-compliant cooperative alternative.</p>`},
  {h:'Annuities and longevity',b:`<p>Immediate annuities convert capital into lifetime income; deferred annuities start later (e.g. longevity insurance at 80+). They pool longevity risk but reduce liquidity and bequest value. Inflation-linked versions protect purchasing power.</p>`},
  {h:'Linking to asset allocation',b:`<p>Bond-like human capital → more equity in financial capital; equity-like human capital → less. Avoid concentration in the employer's stock. Insurance needs fall as financial capital grows and human capital shrinks.</p>`}],
 sets:[{t:'Planning for Dr Nasser',v:`<p>Dr Nasser, 35, expects to earn SAR 300,000 next year, growing 3% a year for 30 working years. Using a risk-adjusted discount rate of 6%, his adviser values his human capital. He has SAR 1.5 million of financial assets, a non-working spouse and two young children. His income is a stable hospital salary.</p>`,
  qs:[{q:'His human capital is closest to:',o:['SAR 5.77m','SAR 9.00m','SAR 4.13m'],a:0,w:'300,000 ÷ (0.06 − 0.03) × [1 − (1.03 ÷ 1.06)³⁰] = 5.77m.'},
   {q:'Human capital as a share of his total wealth is closest to:',o:['79%','26%','50%'],a:0,w:'5.77 ÷ (5.77 + 1.5) = 79%.'},
   {q:'Given a stable salary, his financial portfolio can hold:',o:['relatively more equities','relatively fewer equities','only cash'],a:0,w:'Bond-like human capital diversifies equity risk.'},
   {q:'His most important insurance need is protection against:',o:['premature death and disability','longevity risk','property risk'],a:0,w:'His family depends on his earnings.'}]}],
 quiz:[{q:'Term life insurance provides:',o:['death benefit only, for a fixed period','savings and protection for life','longevity income'],a:0,w:'Cheapest protection.'},
  {q:'An immediate life annuity mainly protects against:',o:['longevity risk','premature death','liability claims'],a:0,w:'Income for life.'},
  {q:'Human capital as a share of total wealth usually:',o:['falls with age','rises with age','stays constant'],a:0,w:'Fewer working years remain.'},
  {q:'Takaful is:',o:['a Sharia-compliant cooperative insurance model','a type of bond','a tax'],a:0,w:'Participants pool contributions.'}],
 cr:[{q:'Recommend the type of life insurance for Dr Nasser and justify.',model:`<b>Term life insurance</b> for roughly the period until his children are independent. It cheaply covers the main risk (loss of earnings to the family on premature death); he does not need the savings element of permanent insurance, which he can provide through his investment portfolio. (Takaful versions are available if preferred.)`,pts:['Term recommended','Need explained (dependants, earnings)','Why not permanent']},
  {q:'Explain how Dr Nasser\'s insurance needs and asset allocation should change by age 60.',model:`His human capital will have shrunk and financial capital grown, so <b>life insurance needs fall</b>; <b>longevity risk</b> becomes more important (consider annuities). With less bond-like human capital left, his financial portfolio should generally become <b>more conservative</b>.`,pts:['Insurance need falls','Longevity risk / annuities','Allocation becomes more conservative']}],
 srs:[{q:'Human capital?',a:'PV of future earnings.'},{q:'Two ways to size life cover?',a:'Human life value; needs analysis.'},{q:'Annuity protects against?',a:'Longevity risk.'},{q:'Bond-like human capital implies?',a:'More equity in financial capital.'}],
 read:[{t:'Human capital (finance)',s:'Wikipedia',u:WIKI('Human_capital')},{t:'Life annuity',s:'Wikipedia',u:WIKI('Life_annuity')},{t:'Takaful',s:'Wikipedia',u:WIKI('Takaful')}]},

{id:'x22',track:'cfa3',topic:'path',path:'pw',title:'Pathway Private Wealth: case',mins:55,blurb:'A business owner\'s liquidity event: goals, concentration, risks and the family.',
 lab:{key:'pwrisk',name:'Name the risk',intro:'Six fact patterns from private clients. Which risk is each about?'},
 cards:[
  {h:'Liquidity events',b:`<p>Selling a business turns a concentrated, illiquid, familiar asset into cash. Priorities: secure lifestyle needs, address taxes and structuring before the sale, avoid rushed decisions, and plan for identity and purpose after the sale.</p>`},
  {h:'Goals-based structure',b:`<p>A <b>lifestyle (needs)</b> bucket in high-quality bonds and cash covering several years; a <b>growth</b> bucket for long-term goals; an <b>aspirational</b> bucket for higher-risk ideas, philanthropy or new ventures.</p>`},
  {h:'Concentrated positions',b:`<p>Strategies: staged sales, <b>collars</b> or protective puts, prepaid variable forwards, exchange funds (where available), and borrowing against the position. Weigh taxes, control, emotional attachment and restrictions (lock-ups, insider rules).</p>`},
  {h:'Family dimensions',b:`<p>Who decides? Who inherits what? Prepare heirs, agree governance, consider a family office for scale and a waqf or foundation for philanthropy.</p>`},
  {h:'Case technique',b:`<p>Start each answer with the recommendation, then two facts from the case. Show the needs calculation. Address risks in the balance sheet, not only the portfolio.</p>`}],
 sets:[{t:'Khalid sells his business',v:`<p>Khalid, 62, has just sold his logistics company. He received SAR 60 million in cash and SAR 40 million in shares of the listed buyer, with a one-year lock-up. He needs SAR 1.8 million a year for living costs. He wants to fund a SAR 10 million educational waqf and to help his children start businesses. He says he "knows logistics best" and wants to keep the buyer's shares.</p>`,
  qs:[{q:'A reasonable lifestyle (needs) bucket covering five years of spending is about:',o:['SAR 9m','SAR 1.8m','SAR 40m'],a:0,w:'5 × 1.8 = 9 million in high-quality, liquid assets.'},
   {q:'Khalid\'s wish to keep the buyer\'s shares mainly reflects:',o:['familiarity bias and illusion of control','loss aversion','anchoring on the IPO price'],a:0,w:'He overrates his edge in a sector he knows.'},
   {q:'During the lock-up, a way to reduce the downside of the share position without selling is:',o:['a collar, if permitted by the lock-up terms','selling the shares short through a friend','nothing can be done'],a:0,w:'Hedging must comply with the lock-up and insider rules.'},
   {q:'The educational waqf is best placed in the:',o:['aspirational / legacy bucket','lifestyle bucket','emergency reserve'],a:0,w:'It is a long-term legacy goal funded after needs are secure.'}]}],
 quiz:[{q:'The first priority after a liquidity event is usually to:',o:['secure lifestyle needs with safe, liquid assets','invest everything in a new venture','buy more of the same industry'],a:0,w:'Protect the base first.'},
  {q:'A prepaid variable forward on a stock position:',o:['provides cash now and hedges part of the downside, with capped upside','increases exposure','is a type of bond'],a:0,w:'Often used for concentrated positions.'},
  {q:'A family office becomes sensible mainly when:',o:['wealth is large and complex enough to justify the cost','the family has any savings','the family wants lower returns'],a:0,w:'Fixed costs need scale.'},
  {q:'A key non-financial issue after selling a business is:',o:['the founder\'s identity and purpose','the dividend yield of bonds','the bank\'s fees only'],a:0,w:'Wealth advisers address it explicitly.'}],
 cr:[{q:'Recommend a goals-based structure for Khalid\'s SAR 100 million. Justify the size and contents of each bucket.',model:`<b>Lifestyle:</b> about SAR 9–10m (five years of SAR 1.8m) in high-quality bonds and cash. <b>Growth:</b> most of the remaining cash (≈SAR 40m) in a diversified global portfolio for long-term spending and inflation. <b>Aspirational/legacy:</b> the SAR 10m waqf and a capped pool for his children's ventures. The SAR 40m in buyer shares is a concentration to be reduced and hedged after the lock-up.`,pts:['Lifestyle bucket sized from spending','Growth bucket purpose','Aspirational bucket (waqf, ventures)','Concentrated shares addressed']},
  {q:'Recommend how to manage the SAR 40 million position in the buyer\'s shares, considering his bias and the lock-up.',model:`Acknowledge his familiarity bias and show the concentration risk (40% of wealth in one stock). During the lock-up, hedge with a collar if the terms allow; after the lock-up, <b>sell in stages</b> to an agreed target (e.g. under 10% of wealth), possibly keeping a small position to respect his preference.`,pts:['Bias addressed','Hedge during lock-up','Staged sales to a target after']}],
 srs:[{q:'First step after a liquidity event?',a:'Secure lifestyle needs.'},{q:'Tools for a concentrated stock?',a:'Staged sales, collars, prepaid variable forwards, exchange funds, borrowing.'},{q:'Goals-based buckets?',a:'Lifestyle, growth, aspirational.'},{q:'When does a family office make sense?',a:'When wealth and complexity justify the cost.'}],
 read:[{t:'Diversification (finance)',s:'Wikipedia',u:WIKI('Diversification_(finance)')},{t:'Goals-based investing',s:'Wikipedia',u:WIKI('Goal-based_investing')},{t:'Waqf',s:'Wikipedia',u:WIKI('Waqf')}]}
]);

{id:'m01',track:'mba',title:'Reading the three statements',mins:35,blurb:'Income statement, balance sheet and cash flow — and the links that tie them together.',
 lab:{key:'three',name:'Linked three-statement model',intro:'Change any driver and watch profit, cash and the balance sheet move together.'},
 cards:[
  {h:'Three views of one business',b:`<ul><li><b>Income statement:</b> performance over a period (revenue − costs = profit).</li><li><b>Balance sheet:</b> position at a point in time (assets = liabilities + equity).</li><li><b>Cash flow statement:</b> where cash actually came from and went (operating, investing, financing).</li></ul>`},
  {h:'Profit is not cash',b:`<p>Revenue is booked when earned, not when collected. Costs are matched to revenue, not paid when incurred. Depreciation reduces profit but uses no cash. So a profitable company can run out of cash — and a loss-making one can be cash-rich.</p>`},
  {h:'The links',b:`<div class="formula">Net income → retained earnings (balance sheet) and → top of the cash flow statement<br>Operating cash flow = Net income + D&A − Δ working capital<br>Free cash flow = Operating cash flow − Capex<br>Ending cash (cash flow) = Cash on the balance sheet</div>`},
  {h:'Working capital',b:`<p>Receivables + inventory − payables. When it grows, cash is absorbed; when it shrinks, cash is released. Fast-growing companies often burn cash in working capital even with good margins.</p>`},
  {h:'How analysts read accounts fast',b:`<ol><li>Revenue growth and gross margin trend</li><li>Operating margin and where costs grew</li><li>Operating cash flow vs net income (quality of earnings)</li><li>Capex vs depreciation (investing or harvesting?)</li><li>Debt and liquidity</li></ol>`}],
 quiz:[
  {q:'Which statement shows a company\'s position at a point in time?',o:['Income statement','Balance sheet','Cash flow statement','Notes'],a:1,w:'The balance sheet is a snapshot; the other two cover a period.'},
  {q:'Net income 50, depreciation 20, working capital up 15. Operating cash flow?',o:['85','55','35','65'],a:1,w:'50 + 20 − 15 = 55.'},
  {q:'Why is depreciation added back in the cash flow statement?',o:['It is a tax','It reduced profit but used no cash this year','It is a financing item','It is always zero'],a:1,w:'The cash went out when the asset was bought (capex).'},
  {q:'A fast-growing company has rising profits but falling cash. Most likely cause?',o:['Too much depreciation','Working capital absorbing cash','Low taxes','High dividends only'],a:1,w:'Receivables and inventory grow with sales, tying up cash.'},
  {q:'Operating cash flow 60, capex 75. Free cash flow?',o:['135','−15','15','60'],a:1,w:'60 − 75 = −15: the business is investing more than it generates.'},
  {q:'Operating cash flow consistently below net income is a sign to check…',o:['Nothing','Earnings quality: revenue recognition, receivables, inventory','The tax rate','Share count'],a:1,w:'Profits that never turn into cash deserve scrutiny.'}],
 srs:[{q:'Operating cash flow (indirect method)?',a:'Net income + D&A − increase in working capital.'},{q:'Free cash flow?',a:'Operating cash flow − capex.'},{q:'Balance sheet identity?',a:'Assets = Liabilities + Equity.'},{q:'Why can a profitable firm run out of cash?',a:'Profit is accrual-based; growth in receivables/inventory and capex absorb cash.'}],
