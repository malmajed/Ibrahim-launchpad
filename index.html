<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ibrahim">
<meta name="theme-color" content="#0B2545">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>html,body{height:100%}body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Ibrahim's Launchpad</title>
<style>
:root{--navy:#0B2545;--navy2:#13325E;--char:#1A2233;--blue:#1F4FD8;--sky:#5DA9E9;--sun:#F5C518;--amber:#FFB000;--sunink:#8A5A00;--paper:#FFF4CC;--gold:#1F4FD8;--gold2:#F5C518;--goldsoft:#FFF4CC;--c-cfa:#1F4FD8;--c-mba:#0B5BA8;--c-trade:#8A5A00;--c-news:#7A5200;--bg:#F3F6FB;--sur:#FFFFFF;--sur2:#F7F9FD;--ink:#0B2545;--mut:#4A5A75;--line:#D9E1EE;--ok:#1E7A46;--oksoft:#E1F3E8;--bad:#B3261E;--badsoft:#FBE7E5;--shadow:0 1px 2px rgba(11,37,69,.06),0 4px 14px rgba(11,37,69,.07);--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--arab:"IBM Plex Sans Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--on-tc:#FFFFFF;--on-bad:#FFFFFF;color-scheme:light}
@media (prefers---on-tc:#0A1428;--on-bad:#0A1428;color-scheme:dark){:root:not([data-theme="light"]){--gold:#F5C518;--gold2:#F5C518;--goldsoft:#2B2410;--blue:#7DB8F0;--sky:#5DA9E9;--sunink:#F5C518;--paper:#2B2410;--c-cfa:#7DB8F0;--c-mba:#9CC8F2;--c-trade:#FFB000;--c-news:#F5C518;--bg:#0A1428;--sur:#101D36;--sur2:#15264A;--ink:#E8EEF8;--mut:#A3B3CF;--line:#24375C;--ok:#5CC28A;--oksoft:#12301F;--bad:#F07A72;--badsoft:#3A1714;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);--on-tc:#0A1428;--on-bad:#0A1428;color-scheme:dark}}
:root[data-theme="dark"]{--gold:#F5C518;--gold2:#F5C518;--goldsoft:#2B2410;--blue:#7DB8F0;--sky:#5DA9E9;--sunink:#F5C518;--paper:#2B2410;--c-cfa:#7DB8F0;--c-mba:#9CC8F2;--c-trade:#FFB000;--c-news:#F5C518;--bg:#0A1428;--sur:#101D36;--sur2:#15264A;--ink:#E8EEF8;--mut:#A3B3CF;--line:#24375C;--ok:#5CC28A;--oksoft:#12301F;--bad:#F07A72;--badsoft:#3A1714;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25);--on-tc:#0A1428;--on-bad:#0A1428;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
a{color:var(--gold)}
h1,h2,h3{font-family:var(--serif);font-weight:600;letter-spacing:-.01em;line-height:1.2;margin:0 0 .5rem}
h1{font-size:1.65rem}h2{font-size:1.3rem}h3{font-size:1.08rem}h4{margin:0 0 .5rem;font-size:1rem}
p{margin:.35rem 0 .7rem}
small,.note{color:var(--mut);font-size:.88rem}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;border-bottom:2px solid var(--gold2)}
.brand{font-family:var(--serif);font-size:1.12rem;font-weight:600;color:#fff;text-decoration:none;white-space:nowrap}
.brand b{color:var(--gold2);font-weight:600}
.lvl{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;font-size:.78rem;color:#C8D6EE}
.lvl .bar{height:5px;background:rgba(255,255,255,.14);border-radius:3px;overflow:hidden}
.lvl .bar i{display:block;height:100%;background:var(--gold2);border-radius:3px;transition:width .5s}
.iconbtn{background:none;border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:8px;width:34px;height:34px;font-size:1rem;cursor:pointer;flex:none}
.syncDot{width:9px;height:9px;border-radius:50%;background:#6B7280;flex:none}
.syncDot.ok{background:#5CC28A}.syncDot.busy{background:var(--gold2)}.syncDot.err{background:#F07A72}
main{max-width:980px;margin:0 auto;padding:16px 16px 96px}
.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:var(--sur);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs button{flex:1;background:none;border:0;color:var(--mut);font:600 .7rem var(--sans);display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0;cursor:pointer;position:relative}
.tabs button span{font-size:1.25rem;line-height:1}
.tabs button.on{color:var(--gold)}
.tabs .badge{position:absolute;top:0;right:calc(50% - 22px);background:var(--bad);color:var(--on-bad);border-radius:9px;font-size:.62rem;padding:0 5px;min-width:16px}
@media(min-width:900px){.tabs{top:0;bottom:auto;left:auto;right:16px;width:auto;background:none;border:0;padding:0;height:56px;align-items:center;gap:4px}.tabs button{flex-direction:row;color:#C8D6EE;font-size:.82rem;padding:6px 10px;border-radius:8px}.tabs button span{font-size:1rem}.tabs button.on{color:var(--gold2);background:rgba(255,255,255,.07)}.top{padding-right:520px;min-height:56px}main{padding-bottom:40px}.tabs .badge{right:2px;top:-2px}}
.card{background:var(--sur);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card.gold{border-top:3px solid var(--gold2)}
.grid{display:grid;gap:12px}
@media(min-width:640px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}}
.g2m{grid-template-columns:1fr 1fr}
.stat{background:var(--sur);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font:600 1.5rem var(--serif);color:var(--ink)}
.stat small{display:block}
.eyebrow{font:700 .7rem var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{flex:1}
.sbtn{background:var(--navy);color:#fff;border:1px solid var(--navy);border-radius:10px;padding:10px 16px;font:600 .92rem var(--sans);cursor:pointer;min-height:42px}
:root[data-theme="dark"] .sbtn{background:var(--gold2);color:#0B2545;border-color:var(--gold2)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .sbtn{background:var(--gold2);color:#0B2545;border-color:var(--gold2)}}
.sbtn.alt{background:transparent;color:var(--ink);border-color:var(--line)}
.sbtn.gold{background:var(--gold2);border-color:var(--gold2);color:#0B2545}
.sbtn.sm{padding:6px 10px;min-height:32px;font-size:.82rem}
.sbtn:disabled{opacity:.45;cursor:default}
.ctl{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.tin,textarea,select{width:100%;background:var(--sur2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:16px var(--sans)}
textarea{min-height:96px;resize:vertical;line-height:1.5}
.tin:focus,textarea:focus,select:focus{outline:2px solid var(--gold2);outline-offset:1px}
label.f{display:block;font-size:.85rem;color:var(--mut);margin:8px 0 4px}
.readout{background:var(--sur2);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.readout.ok{background:var(--oksoft);border-color:var(--ok)}.readout.bad{background:var(--badsoft);border-color:var(--bad)}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.75rem;font-weight:600;background:var(--sur2);border:1px solid var(--line);color:var(--mut)}
.pill.done{background:var(--oksoft);color:var(--ok);border-color:transparent}
.pill.gold{background:var(--goldsoft);color:var(--gold);border-color:transparent}
.trackhead{border-radius:14px;padding:18px;color:#fff;background:linear-gradient(135deg,var(--navy),var(--navy2));margin-bottom:14px;border:1px solid #1A3A6B}
.trackhead h1{color:#fff}.trackhead p{color:#C8D6EE}
.tcard{display:block;text-decoration:none;color:inherit;cursor:pointer}
.tcard .ico{font-size:1.6rem}
.prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden;margin:8px 0 4px}
.prog i{display:block;height:100%;background:var(--gold2)}
.mlist{display:flex;flex-direction:column;gap:8px}
.mitem{display:flex;gap:12px;align-items:center;background:var(--sur);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:pointer;text-align:left;color:var(--ink);font:inherit;width:100%}
.mitem .n{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:600 .85rem var(--sans);background:var(--sur2);border:1px solid var(--line)}
.mitem.done .n{background:var(--gold2);color:#0B2545;border-color:var(--gold2)}
.mitem.lock{opacity:.55;cursor:default}
.mitem .t{flex:1;min-width:0}.mitem .t b{display:block;font-weight:600}.mitem .t small{display:block}
.steps{display:flex;gap:6px;margin:10px 0 14px;overflow-x:auto}
.steps button{flex:1;min-width:0;white-space:nowrap;background:var(--sur);border:1px solid var(--line);border-radius:10px;padding:8px 6px;font:600 .8rem var(--sans);color:var(--mut);cursor:pointer}
.steps button.on{border-color:var(--gold2);color:var(--ink);box-shadow:inset 0 -3px 0 var(--gold2)}
.steps button.ok::before{content:"✓ ";color:var(--ok)}
.concept{min-height:200px}
.concept h3{font-size:1.2rem}
.concept ul{padding-left:1.2rem;margin:.3rem 0}.concept li{margin:.25rem 0}
.formula{font-family:var(--mono);background:var(--sur2);border-left:3px solid var(--gold2);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:.9rem;overflow-x:auto}
.dots{display:flex;gap:6px;justify-content:center;margin:10px 0}.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--gold2)}
.qopt{display:block;width:100%;text-align:left;background:var(--sur2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0;font:inherit;color:var(--ink);cursor:pointer}
.qopt.right{background:var(--oksoft);border-color:var(--ok)}.qopt.wrong{background:var(--badsoft);border-color:var(--bad)}
.qopt:disabled{cursor:default}
table.t{width:100%;border-collapse:collapse;font-size:.88rem;margin:8px 0}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:right}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-weight:600;color:var(--mut);background:var(--sur2)}
.tablewrap{overflow-x:auto}
.exhibit{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sur2);margin:10px 0}
.exhibit .eyebrow{margin-bottom:4px}
.casebody p{font-family:var(--serif);font-size:1.03rem;line-height:1.65}
.dropcap::first-letter{font-family:var(--serif);float:left;font-size:3rem;line-height:.9;padding:4px 8px 0 0;color:var(--gold)}
.rubric label{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px dashed var(--line)}
.rubric input{margin-top:4px;width:18px;height:18px;flex:none}
.model{border-left:3px solid var(--gold2);background:var(--goldsoft);padding:10px 12px;border-radius:6px;margin:8px 0}
.model ul{margin:.3rem 0;padding-left:1.2rem}
.timer{font:600 1rem var(--mono);padding:4px 10px;border-radius:8px;background:var(--sur2);border:1px solid var(--line)}
.timer.over{color:var(--bad);border-color:var(--bad)}
.tree ul{list-style:none;padding-left:18px;margin:4px 0;border-left:1px dashed var(--line)}
.tree>ul{padding-left:0;border:0}
.tree li{margin:4px 0}
.tree .node{display:flex;gap:6px;align-items:center}
.tree .node input{flex:1;padding:7px 9px;font-size:.92rem}
.tree .node button{flex:none}
.slide{aspect-ratio:16/9;background:#fff;color:#1A1F2B;border:1px solid #cfd5df;border-radius:6px;padding:4.5% 5%;font-size:clamp(9px,2.1vw,14px);display:flex;flex-direction:column;gap:3%;box-shadow:var(--shadow);overflow:hidden}
.slide .st{font:600 1.25em/1.25 var(--sans);color:#0B2545}
.slide .sb{flex:1;display:flex;gap:4%;min-height:0}
.slide .src{font-size:.7em;color:#6b7280}
.pyr{display:flex;flex-direction:column;align-items:center;gap:8px;margin:10px 0}
.pyr .box{background:var(--sur2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:.88rem;text-align:center}
.pyr .gt{background:var(--navy);color:#fff;border-color:var(--navy);max-width:520px}
.pyr .lvl2{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.pyr .lvl2 .col{display:flex;flex-direction:column;gap:6px}
.pyr .sup{font-size:.78rem;background:var(--sur)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--mut);font:11px var(--sans)}
.badgegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.bdg{text-align:center;padding:10px 6px;border-radius:12px;border:1px solid var(--line);background:var(--sur)}
.bdg .e{font-size:1.7rem;filter:grayscale(1);opacity:.35}
.bdg.on .e{filter:none;opacity:1}
.bdg small{display:block;font-size:.72rem;line-height:1.25;margin-top:4px}
.flash{min-height:180px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.flash .q{font:600 1.15rem var(--serif)}
.flash .a{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.goal{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.goal input[type=checkbox]{width:20px;height:20px;flex:none}
.goal span{flex:1}
.goal.done span{text-decoration:line-through;color:var(--mut)}
.reading a{display:block;padding:8px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.reading a small{display:block}
.reading a b{color:var(--gold);font-weight:600}
#thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}#thumbs img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
#toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;border:1px solid var(--gold2);padding:10px 16px;border-radius:12px;opacity:0;transition:.3s;z-index:50;max-width:90vw;font-size:.92rem;pointer-events:none}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
.duelLobby,.duelBoard{background:var(--sur2);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0}
.duelBoard{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.duelBoard>div{background:var(--sur);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.duelBoard>div.me{border-color:var(--gold2)}
.duelBoard .dsc{display:block;font:600 1.8rem var(--serif)}
.kv{display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-size:.92rem}
.kv span:nth-child(even){text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.big{font:600 1.6rem var(--serif);font-variant-numeric:tabular-nums}
.muted{color:var(--mut)}
.hide{display:none!important}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--sur2);border-radius:999px;padding:6px 12px;font:600 .82rem var(--sans);color:var(--ink);cursor:pointer}
.chip.on{background:var(--gold2);border-color:var(--gold2);color:#0B2545}
.conf{display:flex;gap:6px}.conf button{flex:1;padding:8px 0;border-radius:8px;border:1px solid var(--line);background:var(--sur2);color:var(--ink);font:600 .9rem var(--sans);cursor:pointer}.conf button.on{background:var(--gold2);color:#0B2545;border-color:var(--gold2)}
.followbar{background:var(--goldsoft);color:var(--ink);border:1px solid var(--gold2);border-radius:10px;padding:8px 12px;margin-bottom:12px;font-size:.88rem}
@media(max-width:380px){h1{font-size:1.4rem}.lvl{font-size:.7rem}}

@media(max-width:600px){.nxtlvl{display:none}.steps{gap:4px}.steps button{font-size:.74rem;padding:8px 2px}}

.g2m label.f{font-size:.78rem;min-height:2.4em}

/* ---- colour system: track colours and icon tiles ---- */
.ic{display:block;flex:none}
.tile{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:var(--tc,var(--navy2));color:#fff;flex:none;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.tile.soft{background:color-mix(in srgb,var(--tc) 14%,var(--sur));color:var(--tc);box-shadow:none;border:1px solid color-mix(in srgb,var(--tc) 30%,transparent)}
.tile.glass{background:rgba(255,255,255,.18);color:inherit;box-shadow:none;border:1px solid rgba(255,255,255,.3)}
.trk{padding:0;overflow:hidden;border:0}
.trkband{display:flex;align-items:center;gap:12px;padding:16px;color:#fff}
.trkband h3{color:#fff;margin:0}.trkband small{color:rgba(255,255,255,.85);display:block;line-height:1.35}
.trkpct{font:600 1.3rem var(--serif);color:#fff}
.trkbody{padding:12px 16px 14px}
.trkbody .prog i,.trackhead+.mlist .prog i{background:var(--tc)}
.icorow{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:6px}
.mini{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;color:var(--tc);background:color-mix(in srgb,var(--tc) 10%,var(--sur))}
.mini.on{background:var(--tc);color:var(--on-tc)}
.mitem{border-left:4px solid var(--tc,var(--line))}
.mitem.done{background:color-mix(in srgb,var(--tc) 6%,var(--sur))}
.mitem .mnum{display:block;color:var(--tc);font:700 .68rem var(--sans);letter-spacing:.06em;text-transform:uppercase}
.mitem.lock .tile{filter:grayscale(1);opacity:.6}
.mhead{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:14px;background:color-mix(in srgb,var(--tc) 9%,var(--sur));border:1px solid color-mix(in srgb,var(--tc) 25%,transparent);margin:6px 0 4px}
.mhead .tile{width:54px;height:54px;border-radius:14px}
.steps button{display:flex;align-items:center;justify-content:center;gap:5px}
.steps button.on{border-color:var(--tc,var(--gold2));box-shadow:inset 0 -3px 0 var(--tc,var(--gold2));color:var(--tc,var(--ink))}
.steps button.ok::before{content:none}.steps button.ok{color:var(--ok)}
[style*="--tc"] .sbtn:not(.alt):not(.gold){background:var(--tc);border-color:var(--tc);color:var(--on-tc)}
[style*="--tc"] .eyebrow{color:var(--tc)}
[style*="--tc"] .prog i{background:var(--tc)}
.upnext{border-top:4px solid var(--tc)}
.upnext .tile{margin-top:2px}
.tabs button span{display:grid;place-items:center;height:24px}
@media(max-width:600px){.steps button span{display:none}.steps button{padding:9px 0}}

.trackhead p{color:rgba(255,255,255,.92)}

.kpis .stat{border-top:4px solid var(--k);background:color-mix(in srgb,var(--k) 7%,var(--sur))}
.kpis .stat:nth-child(1){--k:var(--sun);--kt:var(--sunink)}.kpis .stat:nth-child(2){--k:var(--amber);--kt:var(--sunink)}.kpis .stat:nth-child(3){--k:var(--sky);--kt:var(--blue)}.kpis .stat:nth-child(4){--k:var(--blue);--kt:var(--blue)}
.kpis .stat small:first-child{color:var(--kt,var(--k));font-weight:700;letter-spacing:.04em;text-transform:uppercase;font-size:.7rem}

.sbtn,.qopt{scroll-margin-bottom:96px}

/* mission-icon tooltips */
.trk{overflow:visible}.trkband{border-radius:14px 14px 0 0}
.mini{position:relative;cursor:pointer;transition:transform .12s}
.mini:hover{transform:translateY(-1px);background:var(--tc);color:var(--on-tc)}
.mini.off{cursor:default}
.mini[data-tip]:hover::after,.mini[data-tip]:focus-visible::after{content:attr(data-tip);position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border:1px solid var(--tc);padding:6px 10px;border-radius:8px;font:600 .78rem/1.3 var(--sans);white-space:nowrap;z-index:40;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25)}

   2) Cloud sync (Google Sheet via Apps Script web app)

function logEvent(type,mod,detail){state.log=state.log||[];state.log.push({t:Date.now(),type,mod,detail});if(state.log.length>300)state.log=state.log.slice(-300)}
/* ---------- cloud sync (Google Sheet via Apps Script) ---------- */
const SYNC_DEFAULT={url:'',key:''}; // never commit the URL or secret; enter them in Settings or open the device link
let SYNC=Object.assign({},SYNC_DEFAULT);try{const o=JSON.parse(localStorage.getItem('ilp-sync')||'null');if(o&&o.url)SYNC=o}catch(e){}
let pushT=null,syncStatus='off';
function setSyncStatus(s,msg){syncStatus=s;const el=document.getElementById('syncStat');if(el)el.innerHTML=msg;const dot=document.getElementById('syncDot');if(dot){dot.className='syncDot '+s;dot.title=msg.replace(/<[^>]+>/g,'')}}
function schedulePush(){if(!SYNC.url)return;clearTimeout(pushT);pushT=setTimeout(pushState,1500)}
async function pushState(){if(!SYNC.url)return;try{setSyncStatus('busy',t('Saving to Drive…'));const r=await fetch(SYNC.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:SYNC.key,state,device:navigator.platform})});const j=await r.json();if(j.error)throw new Error(j.error);setSyncStatus('ok',t('Saved to Drive')+' '+new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}))}catch(e){setSyncStatus('err',t('Not saved to Drive')+': '+e.message)}}
async function pullState(){if(!SYNC.url)return false;try{setSyncStatus('busy',t('Loading from Drive…'));const r=await fetch(SYNC.url+'?key='+encodeURIComponent(SYNC.key)+'&t='+Date.now());const j=await r.json();if(j.error)throw new Error(j.error);
  if(j.state&&(j.state.savedAt||0)>(state.savedAt||0)){state=Object.assign({progress:{},custom:{},time:{},log:[]},j.state);try{localStorage.setItem(LSKEY,JSON.stringify(state))}catch(e){}renderTop();renderMap();setSyncStatus('ok',t('Loaded from Drive'));return true}
  setSyncStatus('ok',t('Drive is up to date'));if((state.savedAt||0)>(j.state?j.state.savedAt||0:0))pushState();return false}catch(e){setSyncStatus('err',t('Could not reach Drive')+': '+e.message);return false}}
function saveSyncSettings(){SYNC={url:document.getElementById('syncUrl').value.trim(),key:document.getElementById('syncKey').value.trim()};try{localStorage.setItem('ilp-sync',JSON.stringify(SYNC))}catch(e){}if(SYNC.url)pullState().then(()=>pushState());else setSyncStatus('off',t('Cloud sync is off'))}

/* ---------- notebook photos ---------- */
function setupNotebook(m){const inp=document.getElementById('photoIn'),btn=document.getElementById('photoBtn'),msg=document.getElementById('photoMsg');const draw=()=>{document.getElementById('thumbs').innerHTML=(state.photos||[]).filter(p=>p.mod===m.id).map(p=>`<a href="${p.url}" target="_blank" rel="noopener" title="${new Date(p.t).toLocaleString('en-GB')}"><img src="${p.thumb||''}" alt=""></a>`).join('')};draw();
  btn.onclick=()=>inp.click();inp.onchange=async()=>{const f=inp.files[0];if(!f)return;msg.textContent=t('Uploading…');try{const [big,thumb]=await Promise.all([shrink(f,1000,0.72),shrink(f,160,0.6)]);const r=await fetch(SYNC.url,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({key:SYNC.key,photo:big,mission:m.id,name:m.title})});const j=await r.json();if(j.error)throw new Error(j.error);(state.photos=state.photos||[]).push({t:Date.now(),mod:m.id,url:j.url,thumb});if(state.photos.length>40)state.photos=state.photos.slice(-40);logEvent('photo',m.id,'Notebook photo');save();draw();msg.textContent=t('Saved to Drive')+' ✓'}catch(e){msg.textContent=t('Could not upload')+': '+e.message}inp.value=''}}
function shrink(file,max,q){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};img.onerror=rej;img.src=URL.createObjectURL(file)})}

/* ---------- XP, levels, streak ---------- */
const LEVELS=[[0,'Analyst'],[600,'Senior Analyst'],[1500,'Associate'],[3000,'Vice President'],[5000,'Director'],[7500,'Portfolio Manager']];
function level(x){let i=0;while(i<LEVELS.length-1&&x>=LEVELS[i+1][0])i++;const nx=LEVELS[i+1];return{name:LEVELS[i][1],i,frac:nx?(x-LEVELS[i][0])/(nx[0]-LEVELS[i][0]):1,next:nx}}
function addXP(n,id){if(FOLLOW)return;state.xp=(state.xp||0)+n;if(id){P(id).xp=(P(id).xp||0)+n}state.days[today()]=true;const before=level(state.xp-n).i;save();renderTop();if(level(state.xp).i>before){confetti();toast(`🎖️ ${t('Promoted to')} <b>${t(level(state.xp).name)}</b>`)}checkBadges()}
function streak(){let s=0;const d=new Date();if(!state.days[today()])d.setDate(d.getDate()-1);while(state.days[dkey(d)]){s++;d.setDate(d.getDate()-1)}return s}

/* keep a newly shown button clear of the fixed bottom navigation */
function reveal(e){if(!e)return;(f=>f())(()=>{const r=e.getBoundingClientRect(),nav=$('#tabs'),nb=nav&&getComputedStyle(nav).position==='fixed'&&nav.getBoundingClientRect().top>innerHeight/2?nav.offsetHeight:0;const lim=innerHeight-nb-12;if(r.bottom>lim)scrollBy(0,r.bottom-lim)})}
/* ---------- toast & confetti ---------- */
let toastT;function toast(h){const t=$('#toast');t.innerHTML=h;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2600)}
function confetti(){const c=$('#confetti');if(!c)return;const x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#F5C518','#FFB000','#0B2545','#1F4FD8','#5DA9E9','#ffffff'];const ps=Array.from({length:110},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:(Math.random()-.5)*3,vy:2+Math.random()*3,r:3+Math.random()*4,c:cols[Math.floor(Math.random()*cols.length)],a:Math.random()*6}));let f=0;(function tick(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.a+=.1;x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++f<150)requestAnimationFrame(tick);else x.clearRect(0,0,c.width,c.height)})()}

  <div class="grid g2">

/* ---------- mission ---------- */
const STEPS=[['learn','Learn'],['lab','Lab'],['test','Test'],['reflect','Reflect'],['read','Read']];
function vMission(id,step){const m=M[id];if(!m)return vTracks();current=m;const p=P(id);if(p.status==='new'){p.status='started';p.updated=Date.now();logEvent('start',id,m.title);save()}
  step=step||(p.steps.learn?(p.steps.lab?(p.steps.test?'reflect':'test'):'lab'):'learn');
  const tr=TRACKS.find(x=>x.id===m.track);const idx=tr.titles.findIndex((_,i)=>mid(m.track,i)===id);
  const c=tcol(m.track);view().innerHTML=`<div style="--tc:${c.c}"><div class="row" style="margin-bottom:4px"><a href="#/track/${m.track}" class="note">${t('←')} ${t(tr.name)}</a><span class="spacer"></span>${p.status==='completed'?`<span class="pill done">${t('Completed')}</span>`:''}</div>
  ${EN(`<div class="mhead"><span class="tile">${mico(id,28)}</span><div style="min-width:0"><div class="eyebrow" style="color:var(--tc)">${tr.name} · Mission ${idx+1} of ${tr.titles.length}</div><h1 style="margin:2px 0 4px">${esc(m.title)}</h1><p class="note" style="margin:0">${esc(m.blurb)}</p></div></div>
  <div class="steps">${STEPS.map(([k,n])=>`<button class="${k===step?'on':''} ${p.steps[k]?'ok':''}" data-step="${k}" onclick="go('#/m/${id}/${k}')">${ico(STEPICO[k],16)}<span>${n}</span></button>`).join('')}</div>
  <div id="stepBox"></div>`)}</div>`;
  const box=$('#stepBox');({learn:stepLearn,lab:stepLab,test:stepTest,reflect:stepReflect,read:stepRead}[step]||stepLearn)(box,m)}
function markStep(m,k,xp){const p=P(m.id);if(p.steps[k])return false;p.steps[k]=Date.now();p.updated=Date.now();addXP(xp,m.id);logEvent(k,m.id,m.title);maybeComplete(m);save();const b=$(`.steps button[data-step="${k}"]`);if(b)b.classList.add('ok');return true}
function maybeComplete(m){const p=P(m.id);if(p.status!=='completed'&&p.steps.learn&&p.steps.lab&&p.steps.test){p.status='completed';p.updated=Date.now();logEvent('complete',m.id,m.title+' ('+Math.round((p.best||0)*100)+'%)');save();setTimeout(()=>{confetti();toast(`✅ <b>${t('Mission complete')}:</b> ${esc(m.title)}`)},300)}}
function stepLearn(box,m){let i=0;const n=m.cards.length;
  const draw=()=>{const c=m.cards[i];box.innerHTML=`<div class="card concept"><div class="eyebrow">Concept ${i+1} of ${n}</div><h3 style="margin-top:4px">${c.h}</h3><div>${c.b}</div></div><div class="dots">${m.cards.map((_,j)=>`<i class="${j===i?'on':''}"></i>`).join('')}</div><div class="ctl"><button class="sbtn alt" id="prv" ${i?'':'disabled'}>← Back</button><span class="spacer"></span>${i<n-1?'<button class="sbtn" id="nxt">Next →</button>':'<button class="sbtn gold" id="fin">Add to review deck & go to the lab →</button>'}</div>`;
    $('#prv',box).onclick=()=>{i--;draw()};const nx=$('#nxt',box);if(nx)nx.onclick=()=>{i++;draw();box.scrollIntoView({block:'start'})};const f=$('#fin',box);if(f)f.onclick=()=>{addCards(m);markStep(m,'learn',10);go('#/m/'+m.id+'/lab')}};draw()}
function stepLab(box,m){box.innerHTML=`<div class="card"><div class="eyebrow">Lab</div><h3 style="margin-top:4px">${esc(m.lab.name)}</h3><p class="note">${m.lab.intro||''}</p><div id="labBox"></div></div><div class="ctl"><span class="spacer"></span><button class="sbtn alt" onclick="go('#/m/${m.id}/test')">Go to the test →</button></div>`;
  const fn=LABS[m.lab.key];const lb=$('#labBox',box);if(!fn){lb.innerHTML='<p class="note">Lab not found.</p>';return}
  fn(lb,m,()=>{if(markStep(m,'lab',20))toast('🧪 '+t('Lab complete')+' +20 XP')})}
function stepTest(box,m){const qs=m.quiz;let i=0,ok=0;
  const draw=()=>{if(i>=qs.length){const sc=ok/qs.length;const p=P(m.id);p.attempts=(p.attempts||0)+1;const first=!p.steps.test;const gain=Math.round(40*sc)-(first?0:Math.round(40*(p.best||0)));if(sc>(p.best||0))p.best=sc;
      box.innerHTML=`<div class="card" style="text-align:center"><div class="eyebrow">Result</div><div class="big" style="font-size:2.6rem">${ok}/${qs.length}</div><p>${sc>=.85?'Excellent. You own this.':sc>=.67?'Solid. Review the explanations you missed.':'Worth another pass. Revisit the concept cards, then retry.'}</p><div class="ctl" style="justify-content:center"><button class="sbtn alt" id="again">Retry</button><button class="sbtn" onclick="go('#/m/${m.id}/reflect')">Reflect →</button></div></div>`;
      $('#again',box).onclick=()=>{i=0;ok=0;draw()};

    const q0=qs[i],pm=perm(q0.o.length),q={q:q0.q,w:q0.w,o:pm.map(k=>q0.o[k]),a:pm.indexOf(q0.a)};box.innerHTML=`<div class="card">${q0.stem?`<details ${i===0||qs[i-1].stem!==q0.stem?'open':''} class="exhibit" style="margin-bottom:10px"><summary><b>Item set: ${esc(q0.setT||'Vignette')}</b> <span class="note">(tap to show or hide)</span></summary><div class="casebody" style="margin-top:6px">${q0.stem}</div></details>`:''}<div class="row"><div class="eyebrow">Question ${i+1} of ${qs.length}</div><span class="spacer"></span><small class="muted">${ok} correct</small></div><h3 style="margin-top:6px;font-family:var(--sans);font-size:1.02rem">${q.q}</h3><div id="opts">${q.o.map((o,j)=>`<button class="qopt" data-j="${j}">${o}</button>`).join('')}</div><div id="why"></div></div>`;

const V=(id,r=document)=>{const x=$('#'+id,r);return x?parseFloat(x.value)||0:0};
function bars(data,o={}){/* data:[{l,v,c}] */const W=560,H=o.h||220,pad=34,bw=(W-pad*2)/data.length;const mx=Math.max(...data.map(d=>Math.abs(d.v)),1e-9)*1.15;const mn=Math.min(0,...data.map(d=>d.v))*1.15;const y=v=>H-24-(v-mn)/(mx-mn)*(H-40);
  return`<div class="chart" dir="ltr"><svg viewBox="0 0 ${W} ${H}" role="img"><line x1="${pad}" x2="${W-pad}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line)"/>${data.map((d,i)=>{const x=pad+i*bw+bw*.15,h=Math.abs(y(d.v)-y(0));return`<rect x="${x}" y="${Math.min(y(d.v),y(0))}" width="${bw*.7}" height="${Math.max(1,h)}" rx="3" fill="${d.c||'var(--gold2)'}"/><text x="${x+bw*.35}" y="${Math.min(y(d.v),y(0))-5}" text-anchor="middle" style="fill:var(--ink);font-weight:600">${o.f?o.f(d.v):fmt(d.v)}</text><text x="${x+bw*.35}" y="${H-8}" text-anchor="middle">${esc(d.l)}</text>`}).join('')}</svg></div>`}

 $('#cc',el).onclick=()=>{let n=0;$$('[data-c]',el).forEach(s=>{const it=cfg.items[+s.dataset.c],g=s.value===it[1];if(g)n++;s.style.borderColor=s.value?g?'var(--ok)':'var(--bad)':'';s.title=it[2]||''});const need=cfg.pass||Math.ceil(cfg.items.length*.75);

CASES.push(
{id:'w05',title:'Al-Ahsa Foods: Profitable and Out of Cash',teaser:'Record profits, a growing order book — and the CFO says the company cannot make payroll in eight weeks.',byline:'Teaching case · Accounting and working capital · Fictional company, illustrative data',
 body:`<p class="dropcap">When Saleh Al-Mulhim, CEO of Al-Ahsa Foods, presented the 2025 results to his board, the room applauded. Revenue had grown 38% to SAR 620m on new contracts with two national supermarket chains and a government catering programme. Net income was up 45%. Three weeks later his CFO, Reem Al-Harbi, asked for a private meeting. "On current trends," she said, "we will breach our overdraft limit in eight weeks. We may not be able to pay suppliers — or salaries — in December."</p>
<p>Saleh was stunned. How could a company with record profits run out of cash? Reem walked him through the numbers (Exhibit 1). The government catering contract paid on 120-day terms, and invoices were often delayed further by documentation queries. The supermarkets demanded higher stock levels in their distribution centres. Meanwhile, the company's date and grain suppliers — many of them small farms — had begun asking for faster payment as their own costs rose.</p>
<p>The plant director had a different worry. To serve the new volume, he had approved SAR 45m of capex for a second packing line, funded from cash. "We can't slow that down," he said. "The supermarkets will fine us for missed deliveries."</p>
<p>The bank had offered to raise the overdraft limit, but at a higher rate and with a covenant on net debt to EBITDA. Saleh needed a plan for the board within a week.</p>`,
 exhibits:[{t:'Selected figures (SAR m)',h:`<table class="t"><tr><th></th><th>2024</th><th>2025</th></tr><tr><td>Revenue</td><td>450</td><td>620</td></tr><tr><td>Cost of goods sold</td><td>315</td><td>434</td></tr><tr><td>Net income</td><td>31</td><td>45</td></tr><tr><td>Receivables</td><td>62</td><td>136</td></tr><tr><td>Inventory</td><td>52</td><td>95</td></tr><tr><td>Payables</td><td>43</td><td>36</td></tr><tr><td>Depreciation</td><td>12</td><td>14</td></tr><tr><td>Capex</td><td>15</td><td>45</td></tr></table>`,s:'Year-end balances.'}],
 questions:[
  {q:'Calculate operating cash flow and free cash flow for 2025. Why do they differ so much from net income?',note:'NWC 2024 = 62 + 52 − 43 = 71; 2025 = 136 + 95 − 36 = 195; increase 124. OCF = 45 + 14 − 124 = −65. FCF = −65 − 45 = −110. Growth was funded through working capital: receivables doubled, inventory nearly doubled, payables fell. Profit grew, but cash went into the balance sheet.',pts:['NWC increase ≈ SAR 124m','Operating cash flow ≈ −SAR 65m','Free cash flow ≈ −SAR 110m','Explained: receivables, inventory and payables absorbed the cash']},
  {q:'Compute DSO, DIO and DPO for both years. Which moved most?',note:'2024: DSO 50, DIO 60, DPO 50 → CCC 60 days. 2025: DSO 80, DIO 80, DPO 30 → CCC 130 days. DSO (+30) and DPO (−20) moved most; the cycle more than doubled. The government contract terms and supplier pressure are the root causes.',pts:['2024 CCC ≈ 60 days','2025 CCC ≈ 130 days','Identified DSO and DPO as the biggest shifts','Linked them to contract terms and suppliers']},
  {q:'What actions would release cash fastest, and what are the trade-offs?',note:'Collections: dedicated team for government invoices, fix documentation errors, e-invoicing; supply-chain or receivables financing (factoring) for the government contract. Inventory: agree consignment or VMI with supermarkets, cut slow SKUs. Payables: keep small farmers on fair terms (supply risk), but negotiate with larger suppliers. Capex: phase the line or lease equipment. Trade-offs: financing costs, customer relationships, supply security.',pts:['Receivables actions (process + financing)','Inventory actions with retail customers','Thoughtful approach to supplier terms','Capex phasing or leasing']},
  {q:'What should Saleh tell the board?',note:'Answer first: "We are growing faster than our cash can fund. The cash cycle has doubled to 130 days, absorbing SAR 124m. We will release SAR 60–80m within six months through collections, inventory agreements and receivables financing; phase the packing line; and accept the bank\'s facility as a bridge only." Add KPIs: CCC monthly, and a rule that new contracts must meet payment-term thresholds.',pts:['Answer first, with the cause quantified','A target for cash release and timing','Bridge financing positioned correctly','Governance: KPIs and contract rules going forward']}]},

{id:'w06',title:'Gulf Polymers: The SAR 900m Question',teaser:'A board must decide on a new specialty-polymers plant. The NPV is positive — at one discount rate.',byline:'Teaching case · Corporate finance and valuation · Fictional company, illustrative data',
 body:`<p class="dropcap">Gulf Polymers' strategy director, Dr. Nasser Al-Qahtani, had spent nine months on the business case for a SAR 900m specialty-polymers plant in Jubail. Specialty grades sold at a premium over commodity polyethylene and would reduce the company's exposure to commodity price cycles. His model showed an NPV of SAR 210m and an IRR of 12.4% (Exhibit 1).</p>
<p>At the investment committee, the CFO challenged the discount rate. "You used our group WACC of 9%," she said. "But specialty polymers are a new business for us, with new customers and technology risk. A pure-play specialty chemicals company has a beta closer to 1.3 than our 0.9." The head of commercial raised a second point: the volume ramp-up assumed the plant reached 85% utilisation in year three, while the technology licensor's reference plants had taken five years.</p>
<p>Nasser believed the project was strategically right. The CEO agreed in principle but wanted to know how robust the economics were before taking it to the board.</p>`,
 exhibits:[{t:'Base-case business case',h:`<table class="t"><tr><th>Item</th><th>Value</th></tr><tr><td>Capex (years 0–1)</td><td>SAR 900m</td></tr><tr><td>Steady-state free cash flow (from year 4)</td><td>SAR 135m / yr</td></tr><tr><td>Discount rate used</td><td>9% (group WACC)</td></tr><tr><td>NPV</td><td>SAR 210m</td></tr><tr><td>IRR</td><td>12.4%</td></tr><tr><td>Group: unlevered beta 0.9; specialty peers: 1.3</td><td>Rf 4.5%, ERP 6%, target debt 30%, Kd 6%, tax 20%</td></tr></table>`,s:'Illustrative figures for teaching.'}],
 questions:[
  {q:'Should the project be discounted at the group WACC? Estimate a project-specific WACC.',note:'No: the discount rate should reflect the project\'s risk, not the company\'s. Relever the peer beta 1.3 at 30/70 debt/equity: βL = 1.3 × (1 + 0.8 × 0.43) ≈ 1.75; Ke ≈ 4.5 + 1.75 × 6 ≈ 15%; WACC ≈ 0.7 × 15 + 0.3 × 6 × 0.8 ≈ 12%. At about 12%, the project is close to break-even (IRR 12.4%).',pts:['Project risk, not company risk, sets the rate','Used peer beta and relevered','Project WACC around 11.5–12.5%','Concluded NPV is near zero at that rate']},
  {q:'How does a slower ramp-up affect value, and how would you show it?',note:'Delaying full cash flows by two years at ~12% cuts the PV of those flows significantly (each year of delay costs about 11% of their value). Show a sensitivity or scenario table: ramp-up (3 vs 5 years) × discount rate (9/10.5/12%). Decision-makers need to see where NPV turns negative.',pts:['Delay reduces PV via discounting','Proposed scenarios or a sensitivity table','Combined ramp-up and discount-rate effects','Identified the break-even conditions']},
  {q:'Is there a way to keep the strategic option while reducing risk?',note:'Options: a phased plant (smaller first train, expand on proof), a JV with the technology licensor or a customer (shares risk and brings market access), offtake agreements before final investment decision, toll manufacturing to test the market. These create real options — the right but not obligation to expand.',pts:['Phasing or staged investment','Partner or JV to share risk','Offtake contracts before commitment','Explained the value of flexibility (real options)']},
  {q:'What recommendation would you take to the board?',note:'"The project is strategically attractive but, at a risk-appropriate rate of about 12%, its value is close to zero under the base case and negative with a slower ramp-up. We recommend proceeding with a phased first train of ~SAR 400m, conditional on offtake for 50% of capacity, with expansion triggered by utilisation above 80% for two quarters."',pts:['Clear answer with the key number','Acknowledged the strategic rationale','Conditions or triggers for proceeding','Risk mitigation built into the plan']}]},

{id:'w07',title:'Riyadh WaterTech: The New Manager',teaser:'A 29-year-old engineer is promoted over two veterans. Three months in, the team is quietly failing.',byline:'Teaching case · Organisational behaviour and leadership · Fictional company and people',
 body:`<p class="dropcap">Abeer Al-Shammari was promoted to head of operations at Riyadh WaterTech, a fast-growing water-treatment services company, at 29. She had built the company's predictive-maintenance analytics and impressed the CEO with her results. Her new team of 14 field engineers and supervisors included two veterans, Khalid and Fahad, each with over 15 years' experience, who had both expected the role.</p>
<p>Abeer moved quickly. In her first month she introduced a new digital work-order system, a weekly KPI review, and a rule that all maintenance decisions above SAR 20,000 needed her approval. Response times initially improved. By month three, however, the picture had changed (Exhibit 1). Two engineers had resigned. Khalid had stopped attending the weekly review, citing site emergencies. Fahad was polite in meetings but, Abeer heard, told his crews that "the new system is for head office, not for fixing pumps." A major client complained that a supervisor had waited two days for an approval during a pump failure.</p>
<p>The CEO asked Abeer for a plan. "You were right about the analytics," he said. "But I need the team with you."</p>`,
 exhibits:[{t:'Operations dashboard',h:`<table class="t"><tr><th>Metric</th><th>Before Abeer</th><th>Month 1</th><th>Month 3</th></tr><tr><td>Average response time (hours)</td><td>9.5</td><td>7.2</td><td>10.8</td></tr><tr><td>Work orders closed on time</td><td>78%</td><td>86%</td><td>71%</td></tr><tr><td>Engineer resignations (cumulative)</td><td>—</td><td>0</td><td>2</td></tr><tr><td>Weekly review attendance</td><td>—</td><td>100%</td><td>58%</td></tr></table>`,s:'Illustrative data.'}],
 questions:[
  {q:'What went wrong? Diagnose using ideas from motivation and leadership.',note:'Abeer changed a lot, fast, without building legitimacy or involvement. The approval rule removed autonomy from experienced staff (a key motivator) and slowed urgent decisions. The veterans\' expertise and status were not recognised. Initial gains came from novelty and compliance, not commitment.',pts:['Too much change too fast without involvement','Loss of autonomy for experienced engineers','Veterans\' status and expertise not recognised','Compliance vs commitment distinction']},
  {q:'How should Abeer work with Khalid and Fahad?',note:'Meet each one-on-one, acknowledge their experience and the disappointment of not getting the role, and ask for their view on what is not working. Give them real ownership: e.g. Khalid leads emergency-response standards, Fahad co-designs the work-order system with field crews. Agree expectations clearly — including that open undermining is not acceptable.',pts:['Private one-on-one conversations first','Acknowledge expertise and the promotion context','Give them meaningful ownership','Set clear expectations on behaviour']},
  {q:'What should she change about the systems she introduced?',note:'Keep the analytics and KPIs, but redesign with the team: raise or remove the SAR 20k approval threshold for emergencies (approve after, not before), let crews shape the work-order fields, make the weekly review about removing obstacles, not reporting. Show quick wins that make engineers\' lives easier.',pts:['Keep the valuable parts (data, KPIs)','Fix the approval rule for emergencies','Co-design with users','Make reviews useful to the team']},
  {q:'What is Abeer\'s 60-day plan for the CEO?',note:'Weeks 1–2: one-on-ones, listening tour with all 14, immediate emergency-approval fix. Weeks 3–6: co-design workstreams led by Khalid and Fahad; publish what changed from their input. Weeks 7–8: reset KPIs and review format; measure response time, on-time closure, attendance, and retention. Ask the CEO for coaching support and to publicly back the team-designed changes.',pts:['Listening first, quick fix immediately','Involves veterans visibly','Measurable targets','Asks for the right support']}]},

{id:'w08',title:'Najran Dates: Pricing for the World',teaser:'A family date company wants to export premium dates to Europe. Price like a commodity, or like chocolate?',byline:'Teaching case · Marketing and pricing strategy · Fictional company, illustrative data',
 body:`<p class="dropcap">Najran Dates had grown from a family farm into a processor packing 18,000 tonnes a year, mostly sold in bulk to Saudi wholesalers at thin margins. The founder's daughter, Hessa, now commercial director, had a bigger idea: premium boxed dates for European gift and specialty-food retailers, positioned against fine chocolate rather than other dates.</p>
<p>Her first trade fair in Paris produced strong interest — and confusing price signals. A large supermarket buyer offered to list a 500g box at a retail price of €6.99, implying an ex-factory price of about €3.20. A specialty-food chain suggested a 250g gift box at €14.90 retail (ex-factory about €6.50), but in much smaller volumes. A luxury department store wanted an exclusive 12-piece filled-date collection at €29 retail.</p>
<p>Hessa's father worried about the risk: "We are farmers, not chocolatiers. Bulk is safe." Her operations manager noted that premium packaging would add €0.90 per 250g box, and that filled dates required a new clean room. Exhibit 1 summarises her early estimates.</p>`,
 exhibits:[{t:'Export options (year-3 estimates, illustrative)',h:`<table class="t"><tr><th>Option</th><th>Ex-factory price</th><th>Unit cost</th><th>Volume (units/yr)</th><th>Extra fixed cost / yr</th></tr><tr><td>Supermarket 500g</td><td>€3.20</td><td>€2.30</td><td>900,000</td><td>€0.25m</td></tr><tr><td>Specialty 250g gift box</td><td>€6.50</td><td>€2.60</td><td>180,000</td><td>€0.20m</td></tr><tr><td>Luxury filled collection</td><td>€13.00</td><td>€5.10</td><td>25,000</td><td>€0.45m</td></tr></table>`,s:'Unit cost includes packaging and freight.'}],
 questions:[
  {q:'Calculate the annual profit contribution of each option after extra fixed costs.',note:'Supermarket: (3.20 − 2.30) × 900k = €810k − 250k = €560k. Specialty: 3.90 × 180k = €702k − 200k = €502k. Luxury: 7.90 × 25k = €197.5k − 450k = −€252.5k. Supermarket and specialty are close; luxury loses money at these volumes.',pts:['Supermarket ≈ €560k','Specialty ≈ €500k','Luxury ≈ −€250k','Noted supermarket and specialty are similar in profit']},
  {q:'Beyond year-3 profit, how do the options differ strategically?',note:'Supermarket: high volume, low margin, buyer power, risk of being delisted, builds no brand. Specialty: higher margin per unit, builds brand and price positioning, less dependence on one buyer, platform for growth. Luxury: brand halo but loss-making and operationally demanding. Positioning choices are hard to reverse: starting cheap makes premium later difficult.',pts:['Buyer power and dependency in supermarket channel','Brand-building value of specialty','Luxury as halo vs cost','Positioning is hard to reverse']},
  {q:'What positioning and 4Ps would you recommend?',note:'Position as "premium Arabian dates — the gift alternative to chocolate" for European specialty retail. Product: 250g gift box, provenance story (Najran, family farm), selected varieties. Price: €14.90 retail, holding the premium. Place: specialty chains and online; avoid mass supermarkets initially. Promotion: Ramadan and Christmas gifting, tastings, storytelling.',pts:['Clear positioning statement','Product and packaging tied to the story','Price consistent with the position','Channel and promotion choices that fit']},
  {q:'What should Hessa propose to her father?',note:'A staged plan: launch the specialty gift box with two chains (low extra fixed cost, positive contribution), keep bulk domestic sales as the cash base, defer the luxury line until the brand earns it, and set a review after 18 months with clear KPIs (sell-through, repeat orders, margin). This reframes the risk: the core business continues, the brand option is cheap to test.',pts:['Staged, low-risk plan','Keeps the existing business as the base','Defers loss-making option','KPIs and a decision point']}]}
);
