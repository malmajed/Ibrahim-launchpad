{id:'b01',track:'cfa2',topic:'eth',title:'Ethics vignettes',mins:50,blurb:'Apply the Code and Standards to rich, realistic situations: the Level II item-set style.',
 lab:{key:'eth2',name:'Violation or not?',intro:'Eight original Level II-style situations. Decide, then read the reasoning.'},
 cards:[
  {h:'How Level II ethics differs',b:`<p>Level I asks "which standard?". Level II gives a vignette with several people and actions and asks <b>which action violates</b>, <b>what the member should do</b>, or <b>whether a policy complies</b>. Most actions in a vignette are fine; one or two are not.</p><p>Read for: who knew what, when it became public, who consented, and whether disclosure was made in writing.</p>`},
  {h:'Duties to clients in practice',b:`<ul><li><b>III(A) Loyalty:</b> the client is the beneficiary, not the person who hired you (e.g. a pension plan's members).</li><li><b>III(B) Fair Dealing:</b> disseminate changes to all clients at once; allocate blocks pro rata at the average price; family accounts that are clients are treated like any other.</li><li><b>III(C) Suitability:</b> judge the whole portfolio against the IPS; review at least annually.</li><li><b>III(D) Performance:</b> no cherry-picking or survivorship; GIPS is the recommended route.</li></ul>`},
  {h:'Conflicts and priority',b:`<ul><li><b>VI(A) Avoid or Disclose Conflicts</b> (renamed in 2024): avoid where possible, otherwise make full, fair, prominent disclosure in plain language.</li><li><b>VI(B) Priority of Transactions:</b> clients first, employer second, personal last; blackout periods are common.</li><li><b>VI(C) Referral Fees:</b> disclose to employer, clients and prospects.</li></ul>`},
  {h:'Supervisors and compliance',b:`<p><b>IV(C)</b> requires reasonable efforts to prevent and detect violations by people you supervise. If your firm's compliance system is inadequate, <b>decline in writing to accept supervisory responsibility</b> until it is fixed. When you detect a violation, act promptly: an investigation, and limits on the employee's activities in the meantime.</p>`},
  {h:'Requirements vs recommended procedures',b:`<p>The Standards of Practice Handbook separates what is <b>required</b> from <b>recommended procedures</b>. Not following a recommended procedure (e.g. a written personal-trading policy) is not by itself a violation. Exam distractors often present a recommendation as a requirement. Firms <i>should</i> also consider adopting the Asset Manager Code.</p>`}],
 sets:[
  {t:'Al-Noor Capital',v:`<p>Faisal Rahman, CFA, is a portfolio manager at Al-Noor Capital (fictional), Riyadh.</p><p><b>1.</b> At a family dinner, Faisal's brother-in-law, the CFO of Dune Logistics, says the company will announce a large government contract next week. Faisal does not trade. The day after the public announcement, he buys Dune for suitable client accounts.</p><p><b>2.</b> Al-Noor receives an IPO allocation of Gulf Cement. Faisal allocates it pro rata to every account for which it is suitable, but excludes his father's fee-paying account, which also qualifies, "to avoid any appearance of a conflict".</p><p><b>3.</b> A client offers Faisal tickets to a football final if his portfolio beats its benchmark by 3%. Faisal tells his employer in writing and receives written consent.</p><p><b>4.</b> Faisal is promoted to head of equities, supervising six analysts. The firm has no written compliance procedures for personal trading.</p>`,
   qs:[{q:'Regarding statement 1, Faisal:',o:['did not violate the Standards','violated Standard II(A) by buying after the announcement','violated Standard II(A) by keeping the information to himself'],a:0,w:'He did not act on the information while it was nonpublic. Buying after public dissemination is allowed.'},
    {q:'Excluding his father\'s account from the IPO allocation is:',o:['not required: a fee-paying family account should be treated like any other client account','required by Standard III(B) Fair Dealing','required by Standard VI(B), because family accounts must never receive IPO shares'],a:0,w:'Family accounts that are client accounts should be neither favoured nor disadvantaged.'},
    {q:'The client\'s offer of tickets (statement 3):',o:['complies with Standard IV(B) because written consent was obtained','violates Standard IV(B) because the arrangement comes from a client','violates Standard I(B) regardless of consent'],a:0,w:'IV(B) requires written consent from the employer for compensation that may conflict with the employer\'s interest. He obtained it.'},
    {q:'Given statement 4, Faisal should:',o:['decline in writing to accept supervisory responsibility until adequate compliance procedures are adopted','supervise informally and rely on the analysts\' integrity','report the firm to the regulator immediately'],a:0,w:'IV(C): a supervisor cannot meet the duty without an adequate compliance system.'}]},
  {t:'Meridian Securities research',v:`<p>Hessa Al-Qahtani, a CFA candidate, is an equity analyst at Meridian Securities (fictional).</p><p><b>1.</b> Her "buy" report on Red Sea Hotels uses a five-year tourism forecast from an industry consultant. She reviewed the consultant's method, found it reasonable, and cites the source.</p><p><b>2.</b> She later lowers the rating to "hold" and emails the change first to the ten largest clients. Two hours later it is posted for all clients.</p><p><b>3.</b> Hessa owns 200 shares of Red Sea Hotels bought before joining Meridian. Her report discloses the holding.</p><p><b>4.</b> Meridian's investment bank is advising Red Sea Hotels on a bond issue. The report discloses this relationship prominently.</p>`,
   qs:[{q:'Her use of the consultant\'s forecast (statement 1):',o:['is consistent with Standards V(A) and I(C)','violates V(A): analysts must build every forecast themselves','violates I(C): third-party data cannot appear in a report'],a:0,w:'Reasonable reliance on third-party research after a check of its soundness, with attribution, is allowed.'},
    {q:'The way the rating change was released (statement 2):',o:['violates Standard III(B) Fair Dealing','is acceptable because large clients pay higher commissions','is acceptable if the next report mentions the change'],a:0,w:'Rating changes must be disseminated so that all clients have a fair opportunity to act.'},
    {q:'Regarding her shareholding (statement 3):',o:['disclosure satisfies Standard VI(A)','she must sell before publishing the report','it is a violation of Standard II(A)'],a:0,w:'Ownership is a conflict to be disclosed; it does not have to be eliminated.'},
    {q:'Regarding the investment-banking relationship (statement 4):',o:['prominent disclosure addresses the conflict under Standard VI(A)','the report violates the Standards whatever is disclosed','Hessa must stop covering the stock'],a:0,w:'Disclose the conflict. Firms should also keep firewalls between research and banking.'}]}],
 srs:[{q:'Supervisor and an inadequate compliance system?',a:'Decline supervisory responsibility in writing until it is fixed (IV(C)).'},{q:'Fair allocation of a block trade?',a:'Pro rata, at the average execution price, to all participating accounts.'},{q:'VI(A) title since 2024?',a:'Avoid or Disclose Conflicts.'},{q:'Is a recommended procedure a requirement?',a:'No. Not following it is not by itself a violation.'}],
 read:[{t:'Code of Ethics and Standards of Professional Conduct',s:'CFA Institute',u:CFAS},{t:'Standards of Practice Handbook (12th ed.)',s:'CFA Institute (PDF)',u:'https://www.cfainstitute.org/-/media/documents/code/code-ethics-standards/standards-practice-handbook-12th-edition.pdf'},{t:'Summary of the 2023 revisions to the Code and Standards',s:'CFA Institute (PDF)',u:'https://www.cfainstitute.org/-/media/documents/support/ethics/summary-of-the-2023-revisions-to-the-cfa-institute-code-and-standards.pdf'}]},

/* ---------- b02 Regression and time series ---------- */
{id:'b02',track:'cfa2',topic:'qm',title:'Multiple regression and time series',mins:60,blurb:'Read regression output, test for violations, and model trends and autoregressive series.',
 lab:{key:'regr',name:'Regression output reader',intro:'Change n, k and R² and see adjusted R², the F-test and a coefficient t-test update.'},
 cards:[
  {h:'Reading the output',b:`<p>Each slope is a <b>partial</b> effect: holding other variables constant. Test it with t = b̂ ÷ SE, df = n − k − 1. The <b>F-test</b> asks whether all slopes are jointly zero. Use <b>adjusted R²</b>, AIC (for prediction) or BIC (for goodness of fit) to compare models; lower AIC/BIC is better.</p><p>A <b>joint F-test</b> on a subset of variables compares a restricted with an unrestricted model.</p>`},
  {h:'Three classic violations',b:`<ul><li><b>Conditional heteroskedasticity:</b> error variance linked to X. Breusch–Pagan test (n × R² of residuals² regression, χ² with k df). Fix: robust (White) standard errors.</li><li><b>Serial correlation:</b> errors correlated over time. Breusch–Godfrey test. Fix: Newey–West standard errors. With a lagged dependent variable, coefficients are also inconsistent.</li><li><b>Multicollinearity:</b> X's highly correlated. High R² but insignificant t's; VIF above 5 is a concern, above 10 serious. Fix: drop or combine variables.</li></ul>`},
  {h:'Misspecification and special models',b:`<p>Omitted variables bias the coefficients; wrong functional form calls for logs or squares. <b>Dummy variables</b> shift the intercept or slope (use n − 1 dummies for n categories). <b>Logistic regression</b> models a probability with a log-odds link and is fitted by maximum likelihood. Influential points: leverage (X outliers) and studentised residuals (Y outliers); Cook's distance combines both.</p>`},
  {h:'Time series: AR models and stationarity',b:`<p>An AR(1) model x<sub>t</sub> = b₀ + b₁x<sub>t−1</sub> is valid only if the series is <b>covariance stationary</b> (|b₁| < 1). Its <b>mean-reverting level</b> is b₀ ÷ (1 − b₁). Check residual autocorrelations with t-tests; significant ones mean more lags are needed. Multi-period forecasts use the chain rule.</p>`},
  {h:'Unit roots, cointegration, ARCH',b:`<p>If b₁ = 1, the series has a <b>unit root</b> (random walk): test with Dickey–Fuller, and model first differences. Regressing one unit-root series on another is valid only if they are <b>cointegrated</b> (Engle–Granger test). <b>Seasonality:</b> add a seasonal lag. <b>ARCH:</b> regress squared residuals on their lags; if significant, use GARCH-type models.</p>`}],
 sets:[
  {t:'Factor regression for a Saudi equity fund',v:`<p>Fatima Al-Harbi regresses 60 monthly excess returns of an equity fund on three factors.</p>${tbl([['Variable','Coefficient','Standard error'],['Intercept','0.20','0.10'],['Market','1.05','0.15'],['Size','0.30','0.20'],['Value','−0.25','0.10']])}<p>R² = 0.64. The 5% two-tailed critical t for 56 df is 2.003. A Breusch–Pagan regression of squared residuals on the three factors has R² = 0.18; the 5% χ² critical value with 3 df is 7.815.</p>`,
   qs:[{q:'Which slope coefficients are significant at 5%?',o:['Market and value','Market only','Market, size and value'],a:0,w:'t-statistics: market 7.0, size 1.5, value −2.5. |t| > 2.003 for market and value.'},
    {q:'Adjusted R² is closest to:',o:['0.62','0.64','0.66'],a:0,w:'1 − (1 − 0.64)(59 ÷ 56) = 0.621.'},
    {q:'The Breusch–Pagan test indicates:',o:['conditional heteroskedasticity; use robust (White) standard errors','no heteroskedasticity; but the coefficients are biased','heteroskedasticity; the coefficients are biased and variables must be dropped'],a:0,w:'BP = 60 × 0.18 = 10.8 > 7.815. Coefficients stay unbiased; standard errors are unreliable (usually too small).'},
    {q:'The F-statistic is closest to:',o:['33.2','11.1','8.9'],a:0,w:'F = (0.64 ÷ 3) ÷ (0.36 ÷ 56) = 33.2.'}]},
  {t:'Forecasting with AR models',v:`<p>Omar estimates an AR(1) model for a monthly macro series: x<sub>t</sub> = 1.2 + 0.6x<sub>t−1</sub>. None of the residual autocorrelations is significant. The latest value is 4.0.</p><p>For the level of an oil price index he estimates b₁ = 0.99; a Dickey–Fuller test fails to reject a unit root.</p><p>He then regresses the level of a bank-stock index on the oil index level. Both series have unit roots; an Engle–Granger test rejects the null of no cointegration.</p>`,
   qs:[{q:'The mean-reverting level of the macro series is:',o:['3.0','2.0','1.2'],a:0,w:'b₀ ÷ (1 − b₁) = 1.2 ÷ 0.4 = 3.0.'},
    {q:'The two-month-ahead forecast is:',o:['3.36','3.60','3.00'],a:0,w:'One month: 1.2 + 0.6 × 4.0 = 3.6. Two months: 1.2 + 0.6 × 3.6 = 3.36.'},
    {q:'For the oil index, Omar should:',o:['model the first differences, because the series is not covariance stationary','use the AR(1) model, because 0.99 is below 1','add a second lag to make it stationary'],a:0,w:'A unit root means a random walk; first-differencing usually gives a stationary series.'},
    {q:'The regression of the bank index on the oil index:',o:['is valid for the long-term relationship because the series are cointegrated','is invalid; both series must be differenced','is spurious whatever the cointegration test shows'],a:0,w:'With both series non-stationary, the regression is valid only if they are cointegrated, which they are.'}]}],
 srs:[{q:'Adjusted R² formula?',a:'1 − (1 − R²)(n − 1) ÷ (n − k − 1).'},{q:'Fix for heteroskedasticity vs serial correlation?',a:'Robust (White) SEs vs Newey–West SEs.'},{q:'AR(1) mean-reverting level?',a:'b₀ ÷ (1 − b₁).'},{q:'Two unit-root series: when is a regression valid?',a:'Only if they are cointegrated.'}],
 read:[{t:'Linear regression',s:'Wikipedia',u:WIKI('Linear_regression')},{t:'Autoregressive model',s:'Wikipedia',u:WIKI('Autoregressive_model')},{t:'Engineering Statistics Handbook: time series',s:'NIST',u:'https://www.itl.nist.gov/div898/handbook/pmc/section4/pmc4.htm'}]},

/* ---------- b03 Machine learning and big data ---------- */
{id:'b03',track:'cfa2',topic:'qm',title:'Machine learning and big data',mins:50,blurb:'Choose the right algorithm, avoid overfitting, and evaluate a model built on text data.',
 lab:{key:'mlpick',name:'Match the method',intro:'Eight investment problems. Choose the machine-learning approach that fits.'},
 cards:[
  {h:'The map of machine learning',b:`<ul><li><b>Supervised:</b> labelled target. Regression (continuous) or classification (categorical). Penalised regression (LASSO), SVM, k-nearest neighbours, CART, random forests.</li><li><b>Unsupervised:</b> no target. Dimension reduction (PCA) and clustering (k-means, hierarchical).</li><li><b>Deep learning:</b> neural networks with many hidden layers.</li><li><b>Reinforcement learning:</b> an agent learns by maximising rewards.</li></ul>`},
  {h:'Overfitting and how to control it',b:`<p>An overfit model learns noise: high training accuracy, poor out-of-sample accuracy (high <b>variance error</b>). An underfit model has high <b>bias error</b>. Controls: simpler models, <b>regularisation</b> (LASSO penalises the number of features), <b>k-fold cross-validation</b>, and ensembles. Split data into training, validation (tune hyperparameters) and test (final evaluation) samples.</p>`},
  {h:'Key algorithms in one line each',b:`<ul><li><b>CART:</b> splits on features to make a readable tree; prone to overfitting unless pruned.</li><li><b>Random forest:</b> many trees on random subsets; votes; reduces overfitting.</li><li><b>SVM:</b> finds the widest-margin boundary between classes.</li><li><b>KNN:</b> classifies by the nearest labelled neighbours; k is a hyperparameter.</li><li><b>PCA:</b> turns correlated features into a few uncorrelated components (eigenvectors), ranked by explained variance.</li></ul>`},
  {h:'Big data projects and text',b:`<p>Steps: conceptualise the problem, collect data, <b>prepare and wrangle</b> (cleansing, then preprocessing), explore (feature selection and engineering), then train and evaluate. Text: remove HTML tags, punctuation and stop words; lowercase; <b>tokenise</b>; stem or lemmatise; build a <b>bag of words</b> and a document-term matrix; n-grams keep some word order.</p>`},
  {h:'Evaluating a classifier',b:`<p>From the confusion matrix: <b>precision</b> = TP ÷ (TP + FP); <b>recall</b> = TP ÷ (TP + FN); <b>accuracy</b> = (TP + TN) ÷ all; <b>F1</b> = 2PR ÷ (P + R). Use F1 when classes are unequal. The ROC curve plots true-positive vs false-positive rate; a higher AUC is better. For continuous targets, use RMSE.</p>`}],
 sets:[
  {t:'Default classifier for SME loans',v:`<p>A bank's data team trains a model to flag SME loans that will default within a year. On a test sample of 1,000 loans:</p>${tbl([['','Predicted default','Predicted no default'],['Actual default','80 (TP)','20 (FN)'],['Actual no default','40 (FP)','860 (TN)']])}<p>An earlier version of the model, with 400 features, had 99% accuracy on the training data but 71% on the validation data.</p>`,
   qs:[{q:'Precision is closest to:',o:['66.7%','80.0%','94.0%'],a:0,w:'80 ÷ (80 + 40) = 66.7%. Recall is 80%; accuracy is 94%.'},
    {q:'The F1 score is closest to:',o:['72.7%','73.3%','87.0%'],a:0,w:'2 × 0.667 × 0.80 ÷ (0.667 + 0.80) = 0.727.'},
    {q:'If missing a true default is very costly, the bank should focus on:',o:['recall','precision','accuracy'],a:0,w:'Recall measures the share of actual defaults caught (it penalises false negatives).'},
    {q:'The earlier model most likely suffered from:',o:['overfitting; reduce complexity, regularise and cross-validate','underfitting; add more features','too little training time; train for longer'],a:0,w:'A big gap between training and validation accuracy is the signature of high variance error.'}]},
  {t:'News sentiment model',v:`<p>An analyst builds a sentiment model from 5,000 English news articles about Gulf companies. She strips HTML tags and punctuation, lowercases the text, removes stop words, and splits each sentence into words. She then builds a bag of words and a document-term matrix.</p><p>To reduce noise, she drops words that appear in almost every document and words that appear only once. She splits the data 60/20/20 into training, validation and test sets.</p>`,
   qs:[{q:'Splitting "profit rose sharply" into "profit", "rose" and "sharply" is:',o:['tokenisation','stemming','an n-gram'],a:0,w:'Tokenisation splits text into tokens. Stemming would reduce "rose" or "rising" to a base form.'},
    {q:'A known weakness of the bag of words, and a partial fix, is:',o:['it ignores word order; bigrams such as "not_good" partly fix this','it needs labelled data; clustering fixes this','it handles only 1,000 words; PCA fixes this'],a:0,w:'A bag of words loses sequence; n-grams restore some of it.'},
    {q:'Dropping very frequent and very rare words is an example of:',o:['feature selection','feature engineering','data cleansing'],a:0,w:'Feature selection keeps the tokens that carry information, using measures such as document frequency.'},
    {q:'The validation set is used to:',o:['tune hyperparameters; the test set gives the final out-of-sample evaluation','train the model\'s weights','replace cross-validation entirely'],a:0,w:'Keep the test set untouched until the end to avoid an over-optimistic estimate.'}]}],
 srs:[{q:'Precision vs recall?',a:'Precision: TP ÷ (TP + FP). Recall: TP ÷ (TP + FN).'},{q:'Signs of overfitting?',a:'High training accuracy, much lower validation accuracy.'},{q:'What does PCA do?',a:'Turns correlated features into fewer uncorrelated components.'},{q:'Bag of words weakness?',a:'Ignores word order; n-grams help.'}],
 read:[{t:'Machine learning in finance overview',s:'Wikipedia',u:WIKI('Machine_learning')},{t:'Precision and recall',s:'Wikipedia',u:WIKI('Precision_and_recall')},{t:'Principal component analysis',s:'Wikipedia',u:WIKI('Principal_component_analysis')}]},

/* ---------- b04 Currencies and growth ---------- */
{id:'b04',track:'cfa2',topic:'eco',title:'Currencies and economic growth',mins:50,blurb:'Cross rates, forwards, the parity conditions, carry trades, and what drives long-run growth.',
 lab:{key:'fxmtm',name:'Forward MTM and growth accounting',intro:'Value an outstanding FX forward, then decompose potential GDP growth.'},
 cards:[
  {h:'Quotes, cross rates and arbitrage',b:`<p>A quote P/B is the price of one unit of the base currency in the price currency. Cross bid = bid × bid when the currencies chain (A/B × B/C = A/C). The dealer always buys low (bid) and sells high (offer). If a quoted cross is outside the implied bid–offer range, there is a <b>triangular arbitrage</b>.</p>`},
  {h:'Forwards and mark-to-market',b:`<p><b>Covered interest parity:</b> F = S × (1 + i<sub>price</sub> × t) ÷ (1 + i<sub>base</sub> × t). Forward points = F − S. To value an existing forward, enter an offsetting forward for the remaining term and discount the difference at the price-currency rate.</p>`},
  {h:'Parity conditions',b:`<ul><li><b>Uncovered interest parity:</b> expected depreciation ≈ interest differential (often fails short term).</li><li><b>Relative PPP:</b> currency of the higher-inflation country depreciates by the inflation gap.</li><li><b>International Fisher:</b> nominal rate gap ≈ expected inflation gap.</li><li>If all hold, the forward rate is an unbiased predictor of the future spot rate.</li></ul><p>The <b>carry trade</b> exploits the failure of UIP: borrow low-yield, invest high-yield; profits unless the high-yield currency falls more than the rate gap (crash risk).</p>`},
  {h:'What moves exchange rates',b:`<p>Current account and capital flows, monetary and fiscal policy (Mundell–Fleming: with high capital mobility, tight money and loose fiscal policy strengthen the currency), and portfolio-balance effects. Pegs such as the Saudi riyal's to the US dollar (3.75) import US monetary policy; small spreads over USD rates reflect peg and liquidity premia.</p>`},
  {h:'Long-run growth',b:`<p><b>Growth accounting:</b> g<sub>Y</sub> = g<sub>A</sub> + α g<sub>K</sub> + (1 − α) g<sub>L</sub>. In the <b>neoclassical</b> model, capital has diminishing returns: steady-state per-capita growth comes only from TFP. <b>Endogenous</b> growth: knowledge and R&D have spillovers, so growth can persist. Convergence is conditional on institutions, savings and openness.</p>`}],
 sets:[
  {t:'A dealer\'s quote sheet',v:`<p>A Riyadh treasury desk sees these quotes:</p>${tbl([['Quote','Bid','Offer'],['SAR/USD','3.7498','3.7502'],['USD/EUR','1.0850','1.0852']])}<p>One-year rates: SAR 5.4%, USD 5.0%. Use 3.75 as the SAR/USD mid rate.</p><p>Separately, a fund borrows in JPY at 0.5% and invests in MXN deposits at 9%.</p><p>Expected inflation is 2% in Saudi Arabia and 3% in the United States.</p>`,
   qs:[{q:'The SAR/EUR bid rate is closest to:',o:['4.0685','4.0697','4.0691'],a:0,w:'Bid × bid: 3.7498 × 1.0850 = 4.0685.'},
    {q:'The one-year SAR/USD forward (mid) is closest to:',o:['3.7643','3.7357','3.7500'],a:0,w:'3.75 × 1.054 ÷ 1.05 = 3.7643. The USD trades at a forward premium.'},
    {q:'The JPY-funded MXN carry trade earns a profit over the year if the MXN:',o:['depreciates against the JPY by less than about 8.5%','appreciates against the JPY by at least 8.5%','behaves as uncovered interest parity predicts'],a:0,w:'If UIP held exactly, the profit would be zero. The trade wins when the high-yield currency falls less than the rate gap.'},
    {q:'Under relative PPP, SAR/USD would be expected to:',o:['fall by about 1%','rise by about 1%','stay unchanged'],a:0,w:'Higher US inflation means the USD should depreciate, so fewer riyals per dollar. In practice the peg holds the rate fixed.'}]},
  {t:'Growth accounting for Country X',v:`<p>Country X grew real GDP by 4.2% a year over the last decade. The labour force grew 1.5% a year and the capital stock 5.0% a year. The capital share of income is 0.35.</p><p>The finance ministry asks whether higher investment alone can raise the long-run growth rate.</p>`,
   qs:[{q:'TFP growth is closest to:',o:['1.48%','2.45%','0.98%'],a:0,w:'4.2 − 0.35 × 5.0 − 0.65 × 1.5 = 1.475%.'},
    {q:'Labour productivity growth is closest to:',o:['2.7%','4.2%','1.5%'],a:0,w:'GDP growth minus labour growth: 4.2 − 1.5 = 2.7%.'},
    {q:'In the neoclassical model, sustained growth in per-capita output comes from:',o:['TFP growth','capital deepening','population growth'],a:0,w:'Capital deepening raises the level of output, but diminishing returns stop it from raising the steady-state growth rate.'},
    {q:'Endogenous growth theory differs from the neoclassical model because:',o:['knowledge and R&D have spillovers, so returns to capital need not diminish for the economy','it assumes stronger diminishing returns to capital','it predicts absolute convergence of all countries'],a:0,w:'Spillovers mean investment in knowledge can raise growth permanently.'}]}],
 srs:[{q:'Covered interest parity?',a:'F = S × (1 + i_price × t) ÷ (1 + i_base × t).'},{q:'Value of an outstanding forward?',a:'Notional × (F_t − F_0) discounted at the price-currency rate.'},{q:'Carry trade risk?',a:'Crash risk: the high-yield currency falls sharply.'},{q:'Growth accounting?',a:'g_Y = g_A + α g_K + (1 − α) g_L.'}],
 read:[{t:'Interest rate parity',s:'Wikipedia',u:WIKI('Interest_rate_parity')},{t:'Purchasing power parity',s:'Wikipedia',u:WIKI('Purchasing_power_parity')},{t:'Solow–Swan model',s:'Wikipedia',u:WIKI('Solow%E2%80%93Swan_model')}]},

/* ---------- b05 Intercorporate investments and multinationals ---------- */
{id:'b05',track:'cfa2',topic:'fsa',title:'Intercorporate investments and multinationals',mins:55,blurb:'Equity method, acquisitions and goodwill, and how foreign subsidiaries are translated.',
 lab:{key:'equitym',name:'Equity method tracker',intro:'Follow a 30% stake through its first year, including the excess purchase price.'},
 cards:[
  {h:'Which method?',b:`${tbl([['Influence','Typical stake','Method'],['None','< 20%','Financial asset: FVPL, FVOCI or amortised cost'],['Significant','20–50%','Equity method (associate)'],['Joint control','shared','Equity method (joint venture)'],['Control','> 50%','Acquisition method: consolidate']])}<p>Influence, not the percentage, decides. Board seats, policy participation and material transactions point to significant influence.</p>`},
  {h:'Equity method mechanics',b:`<p>Investment = cost + share of investee NI − share of dividends − amortisation of the excess of fair value over book (e.g. on PP&E). Goodwill inside the investment is not amortised but tested for impairment. Profits on <b>upstream and downstream</b> sales are deferred in proportion to ownership until sold to third parties.</p>`},
  {h:'Business combinations',b:`<p>Consolidate 100% of assets and liabilities at fair value; show the <b>non-controlling interest</b> (NCI). <b>Full goodwill</b> (IFRS option, required under US GAAP) = fair value of the whole entity − fair value of identifiable net assets. <b>Partial goodwill</b> (IFRS option) = price paid − share of identifiable net assets. Consolidation raises assets and revenue, so ratios change even when NI does not.</p>`},
  {h:'Foreign subsidiaries: two methods',b:`<ul><li><b>Current rate method</b> (functional currency = local currency): assets and liabilities at the current rate, income at the average rate; translation adjustment goes to <b>OCI</b>. Exposure = net assets.</li><li><b>Temporal method</b> (functional currency = parent's, or hyperinflation under US GAAP): monetary items at the current rate, non-monetary at historical rates; remeasurement gain or loss goes to <b>net income</b>. Exposure = net monetary assets or liabilities.</li></ul>`},
  {h:'Ratios and red flags',b:`<p>Under the current rate method, pure balance-sheet ratios (e.g. current ratio) are unchanged from local-currency statements; mixed ratios change. Under IFRS, hyperinflationary subsidiaries are restated for inflation (IAS 29) before translation at the current rate. Watch for disclosure of how much of sales growth came from currency movements.</p>`}],
 sets:[
  {t:'Al-Jazeera Holdings buys into Tihama Foods',v:`<p>On 1 January, Al-Jazeera Holdings (fictional, IFRS) buys 30% of Tihama Foods for SAR 400 million and gains significant influence. Tihama's book value of net assets is SAR 1,000 million. The fair value of Tihama's PP&E exceeds its book value by SAR 200 million; the PP&E has a remaining life of 10 years. All other assets and liabilities are at fair value.</p><p>In year 1, Tihama reports net income of SAR 150 million and pays dividends of SAR 60 million.</p><p>An analyst also considers an alternative: buying 80% of Tihama for SAR 1,000 million when the fair value of identifiable net assets is SAR 1,200 million and the fair value of the non-controlling interest is SAR 260 million.</p>`,
   qs:[{q:'Al-Jazeera\'s equity income from Tihama for year 1 is:',o:['SAR 39 million','SAR 45 million','SAR 27 million'],a:0,w:'30% × 150 = 45, less amortisation of 30% × 200 ÷ 10 = 6, gives 39.'},
    {q:'The investment balance at the end of year 1 is:',o:['SAR 421 million','SAR 439 million','SAR 427 million'],a:0,w:'400 + 39 − 30% × 60 = 421.'},
    {q:'The goodwill included in the investment is:',o:['SAR 40 million','SAR 100 million','SAR 60 million'],a:0,w:'Excess purchase price = 400 − 300 = 100; 60 is attributed to PP&E; the remaining 40 is goodwill.'},
    {q:'In the 80% alternative, goodwill under the full goodwill method is:',o:['SAR 60 million','SAR 40 million','SAR 240 million'],a:0,w:'(1,000 + 260) − 1,200 = 60. Partial goodwill would be 1,000 − 0.8 × 1,200 = 40.'}]},
  {t:'A foreign subsidiary',v:`<p>Delta Pumps, a US-listed parent with a USD presentation currency, owns a subsidiary in Country Z. The subsidiary is self-contained, sells locally and finances itself in local currency (LC). It has positive net assets.</p><p>During the year the LC weakened: USD per LC was 0.20 at the start, 0.18 on average and 0.16 at year end.</p><p>An analyst asks what would change if the subsidiary were instead an extension of the parent, invoicing and financing in USD.</p>`,
   qs:[{q:'For the subsidiary as described, the method and the treatment of currency effects are:',o:['current rate method; translation adjustment in OCI','temporal method; remeasurement gain or loss in net income','current rate method; translation adjustment in net income'],a:0,w:'A self-contained subsidiary has the local currency as its functional currency.'},
    {q:'This year\'s translation adjustment is most likely:',o:['negative','positive','zero'],a:0,w:'Positive net assets, translated at a falling rate, lose value in USD.'},
    {q:'If the functional currency were the USD, inventory and PP&E would be translated at:',o:['historical rates','the current rate','the average rate'],a:0,w:'Under the temporal method, non-monetary items carried at historical cost use historical rates.'},
    {q:'Under the current rate method, which ratio is the same in USD as in LC?',o:['Current ratio','Return on assets','Inventory turnover'],a:0,w:'Both current assets and current liabilities use the current rate. ROA and turnover mix average and current rates.'}]}],
 srs:[{q:'Equity method investment roll-forward?',a:'Cost + share of NI − amortisation of excess − share of dividends.'},{q:'Full vs partial goodwill?',a:'Full: FV of whole entity − FV of net assets. Partial: price paid − share of FV of net assets.'},{q:'Current rate method: where do FX effects go?',a:'OCI (cumulative translation adjustment).'},{q:'Temporal method: where do FX effects go?',a:'Net income.'}],
 read:[{t:'IAS 28 Investments in Associates and Joint Ventures',s:'IFRS Foundation',u:'https://www.ifrs.org/issued-standards/list-of-standards/ias-28-investments-in-associates-and-joint-ventures/'},{t:'IFRS 3 Business Combinations',s:'IFRS Foundation',u:'https://www.ifrs.org/issued-standards/list-of-standards/ifrs-3-business-combinations/'},{t:'IAS 21 The Effects of Changes in Foreign Exchange Rates',s:'IFRS Foundation',u:'https://www.ifrs.org/issued-standards/list-of-standards/ias-21-the-effects-of-changes-in-foreign-exchange-rates/'}]},

/* ---------- b06 Employee compensation, financial institutions, earnings quality ---------- */
{id:'b06',track:'cfa2',topic:'fsa',title:'Employee compensation, financial institutions and earnings quality',mins:55,blurb:'Pensions and share-based pay, analysing banks and insurers, and spotting low-quality earnings.',
 lab:{key:'pension',name:'Defined-benefit pension',intro:'Roll forward the obligation and plan assets; see what goes to P&L and OCI.'},
 cards:[
  {h:'Defined-benefit pensions',b:`<p>The <b>defined benefit obligation</b> (DBO, or PBO under US GAAP) grows with service cost and interest cost, falls with benefits paid, and moves with actuarial gains and losses. <b>Funded status</b> = plan assets − DBO; the balance sheet shows this net amount. <b>Total periodic pension cost</b> = service + interest − actual return + actuarial losses (or: contributions − change in funded status).</p>`},
  {h:'IFRS vs US GAAP presentation',b:`<p><b>IFRS:</b> P&L shows service cost and <b>net interest</b> (discount rate × net liability); remeasurements go to OCI and are never recycled. <b>US GAAP:</b> P&L uses the <b>expected</b> return on assets and amortises past service cost and actuarial gains/losses from OCI. Analysts often treat interest cost as financing and adjust CFO for the gap between contributions and TPPC.</p>`},
  {h:'Share-based compensation',b:`<p>Stock grants and options are expensed at <b>grant-date fair value</b> over the vesting period. Option values rely on models (e.g. BSM) and assumptions on volatility, life and dividends, which management can tilt. Watch dilution and the tax effects in disclosures.</p>`},
  {h:'Banks and insurers',b:`<p><b>CAMELS:</b> Capital adequacy (CET1, total capital ratios), Asset quality (NPLs, coverage, concentration), Management, Earnings (quality and sustainability), Liquidity (<b>LCR</b>: HQLA ÷ 30-day stressed outflows; <b>NSFR</b>: available ÷ required stable funding over one year), Sensitivity to market risk. Insurers: combined ratio (loss + expense ratios) below 100% means an underwriting profit; investment mix and reserve adequacy matter.</p>`},
  {h:'Earnings quality red flags',b:`<ul><li>NI growing while CFO falls; rising accruals ratio.</li><li>Receivables or inventory growing faster than sales.</li><li>Frequent "non-recurring" charges; gains on asset sales in operating income.</li><li>Changes in depreciation lives, reserves or revenue recognition.</li></ul><p>The <b>Beneish M-score</b> combines eight variables; a higher score signals a higher probability of manipulation.</p>`}],
 sets:[
  {t:'Najd Industrial\'s pension plan',v:`<p>Najd Industrial (fictional) reports under IFRS. Data for its defined-benefit plan this year:</p>${tbl([['Item','SAR m'],['DBO, start of year','1,000'],['Plan assets, start of year','900'],['Discount rate','5%'],['Current service cost','40'],['Benefits paid','50'],['Actuarial loss','20'],['Actual return on plan assets','70'],['Employer contributions','60']])}`,
   qs:[{q:'The DBO at the end of the year is:',o:['SAR 1,060m','SAR 1,040m','SAR 1,110m'],a:0,w:'1,000 + 40 + 50 (interest) − 50 + 20 = 1,060.'},
    {q:'The pension expense in profit or loss under IFRS is:',o:['SAR 45m','SAR 40m','SAR 90m'],a:0,w:'Service cost 40 + net interest 5% × (1,000 − 900) = 45.'},
    {q:'The total periodic pension cost is:',o:['SAR 40m','SAR 45m','SAR 60m'],a:0,w:'40 + 50 − 70 + 20 = 40. Check: contributions 60 − improvement in funded status 20 = 40.'},
    {q:'Remeasurements recognised in OCI are:',o:['a gain of SAR 5m','a loss of SAR 20m','a loss of SAR 25m'],a:0,w:'Actuarial loss 20, offset by the return above the interest-rate return: 70 − 45 = 25. Net: a gain of 5.'}]},
  {t:'Gulf Commerce Bank',v:`<p>An analyst reviews Gulf Commerce Bank (fictional):</p><ul><li>CET1 ratio 13.5%, against a requirement including buffers of 10.5%.</li><li>LCR 135%; NSFR 112%.</li><li>Non-performing loans rose from 1.8% to 3.6% of loans, while the allowance coverage of NPLs fell from 150% to 90%.</li><li>35% of loans are to real estate.</li><li>ROA of 1.6%, helped by a one-off gain on the sale of a subsidiary.</li><li>70% of deposits are non-interest-bearing retail current accounts.</li></ul>`,
   qs:[{q:'The CAMELS component that most concerns the analyst is:',o:['asset quality','capital adequacy','liquidity'],a:0,w:'NPLs doubled, coverage fell, and lending is concentrated.'},
    {q:'An LCR of 135% means:',o:['high-quality liquid assets exceed expected net cash outflows over a 30-day stress period','available stable funding exceeds required stable funding over one year','capital exceeds risk-weighted assets by 35%'],a:0,w:'The second option describes the NSFR.'},
    {q:'The bank\'s earnings quality is best described as:',o:['lower than the ROA suggests, because a non-recurring gain inflates it','high, because ROA above 1% is strong for a bank','unaffected, because the gain was received in cash'],a:0,w:'Sustainable earnings exclude one-off gains.'},
    {q:'The large share of non-interest-bearing retail current accounts is generally:',o:['a stable, low-cost funding source','a liquidity weakness, because they can be withdrawn at any time','irrelevant to the CAMELS analysis'],a:0,w:'Granular retail deposits are sticky and cheap; they support liquidity, the NSFR and the net interest margin.'}]}],
 srs:[{q:'Total periodic pension cost?',a:'Service + interest − actual return + actuarial loss (= contributions − change in funded status).'},{q:'IFRS pension P&L?',a:'Service cost + net interest on the net liability; remeasurements to OCI.'},{q:'LCR vs NSFR?',a:'LCR: HQLA ÷ 30-day stressed outflows. NSFR: available ÷ required stable funding (1 year).'},{q:'An earnings-quality red flag?',a:'NI rising while CFO falls (high accruals).'}],
 read:[{t:'IAS 19 Employee Benefits',s:'IFRS Foundation',u:'https://www.ifrs.org/issued-standards/list-of-standards/ias-19-employee-benefits/'},{t:'Basel III framework',s:'Bank for International Settlements',u:'https://www.bis.org/bcbs/basel3.htm'},{t:'Beneish M-score',s:'Wikipedia',u:WIKI('Beneish_M-score')}]},

/* ---------- b07 Corporate issuers ---------- */
{id:'b07',track:'cfa2',topic:'ci',title:'Capital structure, payouts, cost of capital and restructuring',mins:55,blurb:'MM and trade-off theory, buybacks vs dividends, the equity risk premium, and M&A value.',
 lab:{key:'mm',name:'Modigliani–Miller with taxes',intro:'Raise leverage and watch the cost of equity, WACC and firm value respond.'},
 cards:[
  {h:'Capital structure theories',b:`<ul><li><b>MM without taxes:</b> value and WACC independent of leverage; cost of equity rises linearly with D/E.</li><li><b>MM with taxes:</b> V<sub>L</sub> = V<sub>U</sub> + tD; WACC falls as debt rises.</li><li><b>Static trade-off:</b> tax shield vs costs of financial distress → an optimal debt level.</li><li><b>Pecking order:</b> internal funds, then debt, then equity (information asymmetry).</li><li><b>Agency:</b> debt disciplines managers (free cash flow hypothesis).</li></ul>`},
  {h:'Payouts: dividends vs buybacks',b:`<p>A debt-financed buyback raises EPS if the <b>earnings yield</b> (E/P) exceeds the <b>after-tax cost of debt</b>. Buying back above book value lowers BVPS. Dividends signal confidence and are sticky; buybacks are flexible and can offset dilution. Assess safety with <b>FCFE coverage</b> of dividends plus buybacks.</p>`},
  {h:'Cost of capital: advanced',b:`<p><b>Equity risk premium:</b> historical (geometric vs arithmetic; survivorship), forward-looking (Gordon growth: D/P + g − r<sub>f</sub>; macro build-up), or surveys. Required return models: CAPM, multifactor (Fama–French, Carhart), and <b>build-up</b> for private firms (r<sub>f</sub> + ERP + size + specific risk). Add a <b>country risk premium</b> for emerging-market exposure.</p>`},
  {h:'Restructuring and M&A',b:`<p>Investment actions (acquisitions, joint ventures), divestment actions (sales, <b>spin-offs</b>), and balance-sheet actions (recapitalisations). Value targets by comparable companies, comparable transactions (includes a takeover premium) and DCF. Gain to target = premium; gain to acquirer = synergies − premium. In a stock deal, target shareholders share the synergy risk.</p>`},
  {h:'ESG in corporate analysis',b:`<p>Material ESG factors (by industry) affect cash flows, the cost of capital and tail risks. Governance: board independence, ownership structure (e.g. family or state control in the Gulf), related-party transactions, and alignment of executive pay. Integrate them into forecasts or the discount rate, not as a separate score alone.</p>`}],
 sets:[
  {t:'Leverage at Jubail Chemicals',v:`<p>Jubail Chemicals (fictional) has perpetual EBIT of SAR 100 million. Its unlevered cost of capital is 10%; it can borrow at 6%; the tax rate is 20%. The board proposes moving to a debt-to-equity ratio of 0.5. Assume MM conditions apart from taxes.</p><p>A director argues that the company should instead keep financing projects from retained earnings, then debt, and issue equity only as a last resort.</p>`,
   qs:[{q:'At D/E of 0.5, the cost of equity is:',o:['11.6%','12.0%','10.0%'],a:0,w:'10 + (10 − 6)(1 − 0.2)(0.5) = 11.6%. 12.0% ignores taxes.'},
    {q:'The WACC is closest to:',o:['9.33%','10.00%','8.67%'],a:0,w:'(2/3) × 11.6% + (1/3) × 6% × 0.8 = 9.33%.'},
    {q:'Under MM without taxes, raising D/E would leave:',o:['WACC unchanged and raise the cost of equity','WACC lower','both WACC and the cost of equity unchanged'],a:0,w:'The cheaper debt is exactly offset by the higher cost of equity.'},
    {q:'The director\'s preference reflects:',o:['pecking order theory','static trade-off theory','MM proposition I with taxes'],a:0,w:'Information asymmetry makes equity the most expensive signal, so it comes last.'}]},
  {t:'Najran Telecom\'s buyback',v:`<p>Najran Telecom (fictional) has net income of SAR 500 million, 250 million shares, a share price of SAR 40 and book equity of SAR 3,750 million. It plans to buy back SAR 800 million of shares at the market price, funded with new debt at 6% pre-tax. The tax rate is 20%.</p><p>For its cost of equity, the analyst uses market data: dividend yield 3.0%, expected long-term earnings growth 5.5%, and a 10-year government bond yield of 4.5%.</p>`,
   qs:[{q:'EPS after the buyback is closest to:',o:['SAR 2.007','SAR 2.174','SAR 1.926'],a:0,w:'20m shares bought; NI = 500 − 800 × 6% × 0.8 = 461.6; ÷ 230m = 2.007.'},
    {q:'The best explanation of the EPS effect is:',o:['the earnings yield (5%) exceeds the after-tax cost of debt (4.8%)','fewer shares always raise EPS','pre-tax debt costs 6%, more than the earnings yield'],a:0,w:'E/P = 2 ÷ 40 = 5% > 4.8%, so the buyback is slightly accretive.'},
    {q:'Book value per share after the buyback is closest to:',o:['SAR 12.83','SAR 15.00','SAR 16.30'],a:0,w:'(3,750 − 800) ÷ 230 = 12.83. Buying above book lowers BVPS.'},
    {q:'The forward-looking equity risk premium (Gordon growth) is:',o:['4.0%','8.5%','3.0%'],a:0,w:'3.0% + 5.5% − 4.5% = 4.0%.'}]}],
 srs:[{q:'MM II with taxes?',a:'r_e = r_0 + (r_0 − r_d)(1 − t)(D/E).'},{q:'When is a debt-funded buyback accretive?',a:'When E/P exceeds the after-tax cost of debt.'},{q:'Gordon-growth ERP?',a:'D/P + g − r_f.'},{q:'Gain to acquirer?',a:'Synergies − premium paid.'}],
 read:[{t:'Modigliani–Miller theorem',s:'Wikipedia',u:WIKI('Modigliani%E2%80%93Miller_theorem')},{t:'Pecking order theory',s:'Wikipedia',u:WIKI('Pecking_order_theory')},{t:'Equity premium puzzle',s:'Wikipedia',u:WIKI('Equity_premium_puzzle')}]},

/* ---------- b08 Equity: DDM and FCF ---------- */
{id:'b08',track:'cfa2',topic:'eq',title:'Equity: DDM and free cash flow models',mins:60,blurb:'Gordon, two-stage and H-models; sustainable growth; FCFF and FCFE from any starting point.',
 lab:{key:'fcf',name:'FCFF and FCFE',intro:'Build both free cash flows from net income and value the shares two ways.'},
 cards:[
  {h:'Dividend discount models',b:`<ul><li><b>Gordon:</b> V₀ = D₁ ÷ (r − g).</li><li><b>Two-stage:</b> PV of high-growth dividends + PV of a Gordon terminal value.</li><li><b>H-model</b> (growth declines linearly): V₀ = D₀(1 + g<sub>L</sub>) ÷ (r − g<sub>L</sub>) + D₀ × H × (g<sub>S</sub> − g<sub>L</sub>) ÷ (r − g<sub>L</sub>), where H is half the decline period.</li><li><b>PVGO:</b> V₀ = E₁ ÷ r + PVGO.</li></ul>`},
  {h:'Where growth comes from',b:`<p><b>Sustainable growth</b> g = b × ROE, where b is the retention ratio. Break ROE into margin × turnover × leverage (DuPont) to judge whether growth can last. Justified leading P/E = (1 − b) ÷ (r − g).</p>`},
  {h:'FCFF and FCFE',b:`<ul><li>FCFF = NI + NCC + Int(1 − t) − FCInv − WCInv</li><li>FCFF = CFO + Int(1 − t) − FCInv</li><li>FCFF = EBIT(1 − t) + Dep − FCInv − WCInv</li><li>FCFE = FCFF − Int(1 − t) + net borrowing = CFO − FCInv + net borrowing</li></ul><p>Dividends and share issues are <b>not</b> deducted: they are uses of FCFE, not inputs.</p>`},
  {h:'Valuing with free cash flow',b:`<p>Firm value = PV of FCFF at WACC; equity = firm − debt. Equity value = PV of FCFE at the cost of equity. Use FCFF when leverage is high or changing; FCFE when it is stable. Use two-stage models when near-term growth is abnormal. Non-operating assets (excess cash, investments) are added separately.</p>`},
  {h:'Model choice',b:`<p>DDM: dividend payers, minority perspective, dividends related to profitability. FCF: non-payers or payouts unrelated to cash generation; control perspective. Residual income: negative FCF, reliable book value (next mission). Always test sensitivity to r and g: small changes swing terminal value.</p>`}],
 sets:[
  {t:'Valuing Hail Foods',v:`<p>Hail Foods (fictional) paid a dividend of SAR 2.00 last year. An analyst expects dividends to grow 12% a year for three years, then 4% forever. The required return is 10%.</p><p>A colleague prefers an H-model in which growth starts at 12% and declines linearly to 4% over six years.</p><p>Hail's ROE is 12.5% and it pays out 40% of earnings. A peer, Asir Snacks, trades at SAR 50 with expected EPS of SAR 4.00 next year and the same 10% required return.</p>`,
   qs:[{q:'The two-stage DDM value is closest to:',o:['SAR 42.81','SAR 34.67','SAR 48.71'],a:0,w:'Dividends 2.24, 2.509, 2.810; terminal value at year 3 = 2.922 ÷ 0.06 = 48.71; PV = 42.81.'},
    {q:'The H-model value is closest to:',o:['SAR 42.67','SAR 42.81','SAR 40.00'],a:0,w:'2 × 1.04 ÷ 0.06 + 2 × 3 × 0.08 ÷ 0.06 = 34.67 + 8.00 = 42.67.'},
    {q:'Hail\'s sustainable growth rate is:',o:['7.5%','5.0%','12.5%'],a:0,w:'g = b × ROE = 0.6 × 12.5% = 7.5%.'},
    {q:'The present value of growth opportunities for Asir Snacks is:',o:['SAR 10.00','SAR 12.50','SAR 40.00'],a:0,w:'No-growth value = 4 ÷ 0.10 = 40; PVGO = 50 − 40 = 10.'}]},
  {t:'Qassim Mining\'s free cash flow',v:`<p>Qassim Mining (fictional) data for the latest year (SAR millions):</p>${tbl([['Item','Value'],['Cash flow from operations','300'],['Interest expense','50'],['Tax rate','25%'],['Fixed capital investment','180'],['Net borrowing','40']])}<p>The analyst assumes free cash flows grow 4% a year forever, a WACC of 9%, a cost of equity of 12%, market value of debt of SAR 900 million and 100 million shares.</p>`,
   qs:[{q:'FCFF is:',o:['SAR 157.5m','SAR 120.0m','SAR 195.0m'],a:0,w:'CFO + Int(1 − t) − FCInv = 300 + 37.5 − 180 = 157.5.'},
    {q:'FCFE is:',o:['SAR 160.0m','SAR 197.5m','SAR 120.0m'],a:0,w:'CFO − FCInv + net borrowing = 300 − 180 + 40 = 160.'},
    {q:'Equity value per share using FCFF is closest to:',o:['SAR 23.76','SAR 32.76','SAR 20.80'],a:0,w:'Firm = 157.5 × 1.04 ÷ 0.05 = 3,276; equity = 3,276 − 900 = 2,376; ÷ 100 = 23.76.'},
    {q:'When computing FCFF from net income, dividends paid are:',o:['ignored, because FCFF is before payments to capital providers','subtracted','added back'],a:0,w:'Dividends are a distribution of FCFE, not a cost in computing it.'}]}],
 srs:[{q:'H-model?',a:'D₀(1 + g_L) ÷ (r − g_L) + D₀ H (g_S − g_L) ÷ (r − g_L).'},{q:'Sustainable growth?',a:'g = retention ratio × ROE.'},{q:'FCFF from CFO?',a:'CFO + Int(1 − t) − FCInv.'},{q:'FCFE from FCFF?',a:'FCFF − Int(1 − t) + net borrowing.'}],
 read:[{t:'Dividend discount model',s:'Wikipedia',u:WIKI('Dividend_discount_model')},{t:'Free cash flow',s:'Wikipedia',u:WIKI('Free_cash_flow')},{t:'Damodaran Online: valuation',s:'NYU Stern',u:'https://pages.stern.nyu.edu/~adamodar/'}]}
]);

/* ================= CFA Level II: missions b09–b16 ================= */
addMissions([
/* ---------- b09 Multiples, residual income, private companies ---------- */
{id:'b09',track:'cfa2',topic:'eq',title:'Multiples, residual income and private companies',mins:55,blurb:'Justified multiples, EV/EBITDA, the residual income model and valuing private businesses.',
 lab:{key:'resinc',name:'Residual income and discounts',intro:'Value a share from book value and excess returns, then apply private-company discounts.'},
 cards:[
  {h:'Justified multiples',b:`<ul><li>Leading P/E = (1 − b) ÷ (r − g); trailing P/E = (1 − b)(1 + g) ÷ (r − g).</li><li>P/B = (ROE − g) ÷ (r − g).</li><li>P/S = profit margin × (1 − b)(1 + g) ÷ (r − g).</li><li><b>PEG</b> = P/E ÷ growth (in %); lower suggests cheaper, but it ignores risk and duration of growth.</li></ul><p>Compare a stock's actual multiple with its justified multiple (fundamentals) or with peers (comparables).</p>`},
  {h:'Enterprise value multiples',b:`<p>EV = market value of equity + debt + preferred + NCI − cash and investments. <b>EV/EBITDA</b> suits capital-intensive firms and comparisons across different leverage. Use <b>harmonic means</b> for averaging P/Es of peers (less sensitive to outliers). Check for differences in accounting, cyclicality and growth.</p>`},
  {h:'Residual income model',b:`<p>RI<sub>t</sub> = E<sub>t</sub> − r × B<sub>t−1</sub> = (ROE − r) × B<sub>t−1</sub>. Value = B₀ + PV of future RI. Single-stage: V₀ = B₀ + (ROE − r)B₀ ÷ (r − g). With a <b>persistence factor</b> ω, terminal RI fades: ω near 1 for strong franchises, near 0 for competitive industries. Requires <b>clean-surplus</b> accounting; adjust for items that bypass income (OCI).</p>`},
  {h:'Private companies',b:`<p>Approaches: <b>income</b> (FCF or capitalised cash flow), <b>market</b> (guideline public companies, precedent transactions), <b>asset</b> (holding companies, early-stage). Normalise earnings: owner compensation, non-recurring items, related-party leases. Required returns use a build-up method with size and specific-company premia.</p>`},
  {h:'Discounts and premiums',b:`<p><b>DLOC</b> (lack of control) = 1 − 1 ÷ (1 + control premium). <b>DLOM</b> (lack of marketability) from restricted-stock or pre-IPO studies, or a put-option model. Apply them <b>multiplicatively</b>: total = 1 − (1 − DLOC)(1 − DLOM). Do not apply DLOC if the base value already reflects a minority (e.g. public-company multiples).</p>`}],
 sets:[
  {t:'Asir Retail multiples',v:`<p>An analyst studies Asir Retail (fictional): payout ratio 40%, ROE 15%, required return 11%. Growth is assumed equal to the sustainable growth rate.</p><p>Market data (SAR m): market capitalisation 3,000; debt 800; cash 300; EBITDA 500. The stock trades at a P/E of 20.</p>`,
   qs:[{q:'The justified leading P/E is:',o:['20.0','21.8','13.3'],a:0,w:'g = 0.6 × 15% = 9%. Leading P/E = 0.4 ÷ (0.11 − 0.09) = 20. Trailing would be 21.8.'},
    {q:'The justified P/B is:',o:['3.0','1.36','2.0'],a:0,w:'(15% − 9%) ÷ (11% − 9%) = 3.0.'},
    {q:'EV/EBITDA is:',o:['7.0×','6.0×','7.6×'],a:0,w:'EV = 3,000 + 800 − 300 = 3,500; ÷ 500 = 7.0×.'},
    {q:'The PEG ratio is closest to:',o:['2.22','0.45','1.80'],a:0,w:'20 ÷ 9 = 2.22.'}]},
  {t:'Taif Software, a private company',v:`<p>Taif Software (fictional) is privately owned. Book value per share is SAR 20; expected ROE is 15%; the cost of equity is 10%; long-run growth is 5%.</p><p>A minority stake is being valued. Recent control transactions in the sector carried a 25% control premium. A marketability study suggests a 20% DLOM.</p>`,
   qs:[{q:'The single-stage residual income value per share is:',o:['SAR 40.00','SAR 20.00','SAR 30.00'],a:0,w:'20 + (0.15 − 0.10) × 20 ÷ (0.10 − 0.05) = 40.'},
    {q:'Residual income in year 1 is:',o:['SAR 1.00','SAR 3.00','SAR 2.00'],a:0,w:'(15% − 10%) × 20 = 1.00. Net income is 3.00.'},
    {q:'The implied discount for lack of control is:',o:['20%','25%','80%'],a:0,w:'1 − 1 ÷ 1.25 = 20%.'},
    {q:'The combined DLOC and DLOM discount is:',o:['36%','40%','4%'],a:0,w:'1 − (0.8 × 0.8) = 36%. Discounts multiply; they do not add.'}]}],
