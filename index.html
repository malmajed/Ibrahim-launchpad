 compute:v=>{const k=v.prod*365*v.share/100*3.75/1000;const oilR=k*v.oil,rev=oilR+v.non,bal=rev-v.spend,be=(v.spend-v.non)/k;
  const sig=[v.oil>=80?'Higher oil income supports spending on giga-projects and contractors\' order books.':v.oil<60?'Low oil prices usually mean deficits are financed by borrowing or spending is re-phased; contractors feel it first.':'Moderate oil prices: deficits are manageable, the pace of project awards is the swing factor.',v.rate>=5?'With the riyal pegged to the dollar, the policy rate tracks US rates; high rates weigh on mortgages, SME credit and property.':'Lower rates (following the US) ease mortgage and corporate borrowing costs.','Non-oil revenue (VAT, fees, profits of state entities) is the diversification buffer: every SAR 50bn raised lowers the break-even oil price.'];
  return{out:{be},html:`<div class="grid g4 g2m"><div class="stat"><small>Oil revenue</small><b>SAR ${fmt(oilR)}bn</b></div><div class="stat"><small>Total revenue</small><b>SAR ${fmt(rev)}bn</b></div><div class="stat"><small>Budget balance</small><b style="color:${bal>=0?'var(--ok)':'var(--bad)'}">SAR ${fmt(bal)}bn</b></div><div class="stat"><small>Break-even oil price</small><b>$${fmt(be,1)}</b></div></div><ul>${sig.map(s=>`<li>${s}</li>`).join('')}</ul><p class="note">A teaching model with round, illustrative assumptions — not official figures. For actual numbers, use the Ministry of Finance budget statements and IMF reports in the reading list.</p>`}},
 challenge:{text:'Without reading the break-even tile, move the <b>oil price</b> until the budget balances, then enter that price.',ask:{ans:(v,o)=>o.be,tol:1.5,unit:'USD/bbl',why:()=>'The fiscal break-even is the most quoted macro number in the Gulf. Notice it moves with spending and non-oil revenue as much as with oil itself — that is the logic of diversification.'}}});

/* m10 — pricing simulator: one price vs good-better tiers */
LABS.tiers=(el,m,done)=>{const S=[['Budget',5000,40,10],['Mainstream',3000,70,30],['Premium',1000,120,80]],cB=25,cP=35;
 const sim=(pb,pp,two)=>{let pr=0;const rows=S.map(([n,sz,w,extra])=>{const sb=w-pb,sp=two?w+extra-pp:-1;let ch='none',u=0;if(sp>=0&&sp>sb)ch='Premium tier',u=pp-cP;else if(sb>=0)ch='Basic',u=pb-cB;pr+=u*sz;return[n,sz,w,two?w+extra:'—',ch,u*sz]});return{pr,rows}};
 let best=0;for(let p=20;p<=130;p++)best=Math.max(best,sim(p,0,false).pr);
 calcLab(el,m,done,{inputs:[['pb','Basic price (SAR)',55],['pp','Premium-tier price (SAR, 0 = not offered)',0]],
 compute:v=>{const r=sim(v.pb,v.pp,v.pp>0);return{out:{pr:r.pr},html:`<div class="tablewrap"><table class="t"><tr><th>Segment</th><th>Customers</th><th>Will pay for Basic</th><th>Will pay for Premium</th><th>Chooses</th><th>Profit (SAR)</th></tr>${r.rows.map(x=>`<tr><td>${x[0]}</td><td>${fmt(x[1])}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]}</td><td>${fmt(x[5])}</td></tr>`).join('')}</table></div><div class="grid g2"><div class="stat"><small>Your profit</small><b>SAR ${fmt(r.pr)}</b></div><div class="stat"><small>Best possible with one price</small><b>SAR ${fmt(best)}</b></div></div><p class="note">Unit cost: Basic SAR ${cB}, Premium SAR ${cP}. Each segment picks the option that leaves it the most surplus (value − price).</p>`}},
 challenge:{text:`First find the best single price. Then add a premium tier and <b>beat SAR ${fmt(best)}</b> of profit.`,test:(v,o)=>v.pp>0&&o.pr>best,why:'Tiers let you charge high-value customers more without pricing out the rest. The constraint is self-selection: price Premium so its buyers still prefer it to Basic, and keep Basic cheap enough for the budget segment.'}})};

/* m11 — positioning map */
LABS.position=(el,m,done)=>{const C=CUST('pos');if(C.x==null)Object.assign(C,{x:50,y:50,s:''});const comp=[['Chain A',20,25],['Chain B',35,40],['Chain C',75,80],['Chain D',85,60],['Chain E',45,30]];
 const draw=()=>{const near=Math.min(...comp.map(c=>Math.hypot(c[1]-C.x,c[2]-C.y)));
  el.innerHTML=`<p class="note">Fictional Riyadh coffee chains on two attributes customers care about. Place your new brand where there is real space — and where customers exist.</p>${plotXY({x0:0,x1:100,y0:0,y1:100,h:260,fx:t=>t===0?'cheap':t===100?'pricey':'',fy:t=>t===0?'grab & go':t===100?'experience':'',dots:[...comp.map(c=>[c[1],c[2],'var(--mut)',6,c[0]]),[C.x,C.y,'var(--gold2)',9,'You']],xl:'price →'})}
  <div class="grid g2"><div><label class="f">Price position (0 cheap → 100 premium)</label><input type="range" min="0" max="100" value="${C.x}" id="px" style="width:100%"></div><div><label class="f">Experience (0 grab-and-go → 100 destination)</label><input type="range" min="0" max="100" value="${C.y}" id="py" style="width:100%"></div></div>
  <p class="note">Distance to nearest competitor: <b>${fmt(near)}</b> ${near>=25?'— clear space':'— crowded'}</p>
  <label class="f">Positioning statement: For [target] who [need], [brand] is the [category] that [benefit], unlike [competitor].</label><textarea id="ps">${esc(C.s)}</textarea><div class="ctl"><button class="sbtn" id="sv">Save</button></div><div id="pm"></div>`;
  $('#px',el).oninput=e=>{C.x=+e.target.value;draw()};$('#py',el).oninput=e=>{C.y=+e.target.value;draw()};
  $('#sv',el).onclick=()=>{C.s=$('#ps',el).value;save();const ok=near>=25&&C.s.length>=60&&/for /i.test(C.s)&&/unlike/i.test(C.s);$('#pm',el).innerHTML=`<div class="readout ${ok?'ok':''}">${ok?'<b>Saved.</b> White space is only valuable if there is demand in it: what evidence would show customers want this position?':'Find a spot at least 25 away from the nearest chain, and write the statement using the template (include "For" and "unlike").'}</div>`;if(ok)done()}};draw()};

/* m12 — Five Forces builder */
const PF_PRE={cement:{n:'Saudi cement',v:[4,2,4,2,3],note:'Many regional producers with excess capacity; buyers are contractors who switch on price; energy is a key input.'},ride:{n:'Ride-hailing in Riyadh',v:[5,3,4,3,3],note:'Well-funded rivals, drivers multi-home across apps, riders switch with one tap, regulation shapes entry.'},coffee:{n:'Specialty coffee, Riyadh',v:[4,4,3,2,3],note:'Low entry cost, many new cafés, loyal but fickle customers, substitutes from home brewing and delivery.'}};
const PF=['Rivalry among competitors','Threat of new entrants','Buyer power','Supplier power','Threat of substitutes'];
LABS.porter=(el,m,done)=>{const C=CUST('porter');if(!C.k)Object.assign(C,{k:'cement',v:PF_PRE.cement.v.slice(),t:''});
 const draw=()=>{const avg=C.v.reduce((a,b)=>a+b,0)/5;const att=6-avg;
  el.innerHTML=`<div class="chips">${Object.keys(PF_PRE).map(k=>`<button class="chip ${C.k===k?'on':''}" data-k="${k}">${PF_PRE[k].n}</button>`).join('')}</div><p class="note" style="margin-top:8px">${PF_PRE[C.k].note} Rate each force 1 (weak) to 5 (strong). Strong forces squeeze industry profit.</p>${PF.map((f,i)=>`<div style="margin:8px 0"><div class="row" style="font-size:.9rem"><span>${f}</span><span class="spacer"></span><b>${C.v[i]}</b></div><input type="range" min="1" max="5" value="${C.v[i]}" data-i="${i}" style="width:100%"></div>`).join('')}
  <div class="readout"><b>Industry attractiveness: ${fmt(att,1)} / 5</b> — ${att>=3.5?'structurally attractive':att>=2.5?'average: profits depend on positioning':'tough: expect low average returns'}. Strongest force: <b>${PF[C.v.indexOf(Math.max(...C.v))]}</b>.</div>
  <label class="f">So what? One strategic implication for a company in this industry</label><textarea id="pt">${esc(C.t)}</textarea><div class="ctl"><button class="sbtn" id="sv">Save</button></div>`;
  $$('[data-k]',el).forEach(b=>b.onclick=()=>{C.k=b.dataset.k;C.v=PF_PRE[C.k].v.slice();draw()});$$('input[data-i]',el).forEach(x=>x.oninput=()=>{C.v[+x.dataset.i]=+x.value;draw()});
  $('#sv',el).onclick=()=>{C.t=$('#pt',el).value;save();if(C.t.trim().length>=40){done();toast('Saved')}else toast('Write a fuller implication: what should a company do about the strongest force?')}};draw()};

/* m13 — BCG matrix + Ansoff drill */
LABS.bcg=(el,m,done)=>{const C=CUST('bcg');if(!C.u)C.u=[['Cement',900,2,1.8],['Ready-mix',350,6,0.6],['Precast',120,14,1.4],['Building chemicals',60,18,0.3]];let ok1=false,ok2=false;
 const q=(g,s)=>g>=10?(s>=1?'Star':'Question mark'):(s>=1?'Cash cow':'Dog');
 const drawB=()=>{const lx=s=>Math.log10(Math.max(.1,Math.min(10,s)));
  $('#bb',el).innerHTML=`${plotXY({x0:1,x1:-1,y0:-5,y1:25,h:260,fx:t=>fmt(Math.pow(10,t),1)+'×',fy:t=>t+'%',dots:C.u.map(u=>[lx(u[3]),u[2],'var(--gold2)',5+Math.sqrt(u[1])/3,u[0]]),vlines:[[0,'var(--mut)']],xl:'relative market share (log, high on left)'})}<div class="tablewrap"><table class="t" style="min-width:560px"><tr><th>Unit</th><th>Revenue</th><th>Market growth %</th><th>Relative share</th><th>Quadrant</th></tr>${C.u.map((u,i)=>`<tr><td><input class="tin" data-i="${i}" data-j="0" value="${esc(u[0])}" style="padding:4px 6px;min-width:130px"></td>${[1,2,3].map(j=>`<td><input class="tin" type="number" step="any" data-i="${i}" data-j="${j}" value="${u[j]}" style="padding:4px 6px;max-width:90px"></td>`).join('')}<td><b>${q(u[2],u[3])}</b></td></tr>`).join('')}</table></div><p class="note">Growth line at 10%; relative share = your share ÷ largest rival's. Bubble size = revenue.</p>`;
  $$('#bb input',el).forEach(x=>x.onchange=()=>{const i=+x.dataset.i,j=+x.dataset.j;C.u[i][j]=j?parseFloat(x.value)||0:x.value;save();drawB();ok1=true;chk()})};
 const AO=[['Sell more cement to existing contractors through framework deals','Market penetration'],['Export ready-mix know-how to Iraq','Market development'],['Launch low-carbon cement for giga-projects','Product development'],['Acquire a solar-panel installer','Diversification'],['Win share from rivals in Riyadh with faster delivery','Market penetration']];
 const CELLS=['Market penetration','Product development','Market development','Diversification'];
 el.innerHTML=`<h4>BCG growth-share matrix</h4><p class="note">A fictional building-materials group. Edit any number and watch the unit move.</p><div id="bb"></div><h4 style="margin-top:16px">Ansoff matrix drill</h4><p class="note">Classify each growth option (existing/new products × existing/new markets).</p>${AO.map((a,i)=>`<div style="margin:8px 0"><div style="font-size:.93rem">${a[0]}</div><select class="tin" data-a="${i}" style="margin-top:4px"><option value="">— choose —</option>${CELLS.map(c=>`<option>${c}</option>`).join('')}</select></div>`).join('')}<div class="ctl"><button class="sbtn" id="ac">Check</button></div><div id="am"></div>`;
 const chk=()=>{if(ok1&&ok2)done()};
 $('#ac',el).onclick=()=>{let n=0;$$('[data-a]',el).forEach(s=>{const g=s.value===AO[+s.dataset.a][1];if(g)n++;s.style.borderColor=s.value?g?'var(--ok)':'var(--bad)':''});$('#am',el).innerHTML=`<div class="readout ${n>=4?'ok':''}"><b>${n}/5.</b> Risk rises as you move away from the core: penetration is safest, diversification riskiest. ${n<4?'Red borders are wrong.':''} ${!ok1?'Now change at least one number in the BCG table.':''}</div>`;if(n>=4){ok2=true;chk()}};drawB()};

/* m14 — process analysis and Little's Law */
LABS.process=(el,m,done)=>calcLab(el,m,done,{inputs:[['s1','Step 1: Receive (units/hr)',60],['s2','Step 2: Prepare (units/hr)',45],['s3','Step 3: Assemble (units/hr)',40],['s4','Step 4: Test (units/hr)',55],['s5','Step 5: Pack (units/hr)',70],['d','Demand (units/hr)',50],['wip','Units in process (WIP)',120]],
 compute:v=>{const caps=[v.s1,v.s2,v.s3,v.s4,v.s5],cap=Math.min(...caps),bn=caps.indexOf(cap),th=Math.min(cap,v.d),ft=v.wip/th*60;
  return{out:{ft},html:`${bars(caps.map((c,i)=>({l:'Step '+(i+1),v:th/c*100,c:i===bn?'var(--bad)':'var(--gold2)'})),{h:190,f:x=>fmt(x)+'%'})}<p class="note" style="text-align:center">Utilisation of each step at actual throughput</p><div class="grid g3"><div class="stat"><small>Bottleneck</small><b>Step ${bn+1}</b><small>${fmt(cap)} units/hr</small></div><div class="stat"><small>Throughput</small><b>${fmt(th)} /hr</b><small>${v.d>cap?'demand exceeds capacity':'demand-limited'}</small></div><div class="stat"><small>Lost demand</small><b>${fmt(Math.max(0,v.d-cap))} /hr</b></div></div><div class="formula">Little's Law: WIP = Throughput × Flow time</div>`}},
 challenge:{text:'Using Little\'s Law and the current inputs: what is the <b>average flow time</b> of a unit through the process, in minutes?',ask:{ans:(v,o)=>o.ft,tol:1,unit:'minutes',dp:1,why:()=>'Flow time = WIP ÷ throughput. To cut lead time you either increase throughput (fix the bottleneck) or reduce WIP — which is the core of lean.'}}});

/* m15 — organisational behaviour: situational judgement */
LABS.sjt=(el,m,done)=>{const Q=[
 ['Your portfolio manager asks for an earnings model by Thursday. On Tuesday you realise the company\'s segment data is missing a region and you cannot finish properly.',[['Work through the night and estimate the missing region quietly',1],['Tell your manager today, with the gap, two options (proxy estimate or one-day delay) and your recommendation',3],['Wait until Thursday and explain then',0],['Email the company\'s investor relations team for the data and tell no one',1]],'Raise problems early, with options. Managers forgive gaps; they don\'t forgive surprises.'],
 ['In a team problem-solving session, a senior colleague dismisses your analysis in front of the investment committee.',[['Argue the point there and then until they concede',0],['Stay calm, note the data behind your view in one sentence, and offer to walk through it after the meeting',3],['Say nothing and drop the analysis',1],['Complain to the head of research afterwards',1]],'Hold your ground on facts, not ego, and move the disagreement to a private setting.'],
 ['A colleague in the risk team is slow to share data you need and seems defensive.',[['Escalate to their department head',0],['Meet them one-on-one, understand what they are worried about, and show how the work helps their area',3],['Work around them using other sources only',1],['Send a firmer reminder email',1]],'Resistance is usually fear of what the data will show. Address the concern, make them a co-owner.'],
 ['Your manager gives feedback that your research notes are "too long". You disagree a little.',[['Thank them, ask for one example of a note that works well, and apply it to the next one',3],['Explain why your notes need the detail',1],['Accept silently and change nothing',0],['Ask a peer if the manager is right',1]],'Seek specifics, act on them visibly. You can discuss nuance once you have shown you listened.'],
 ['Two teammates are in conflict and it is slowing the workstream you lead.',[['Ignore it; they are adults',0],['Talk to each separately, then agree clear roles and hand-offs together',3],['Ask the manager to fix it',1],['Take over both pieces of work yourself',1]],'Most team conflict is about unclear roles. Clarify who owns what before it becomes personal.'],
 ['You are asked to join a second project while the first is at a critical stage.',[['Say yes to both and hope it works',0],['Say no outright',1],['Explain your current commitments, ask the two managers to agree priorities, then commit',3],['Say yes, then quietly deprioritise the new one',0]],'Making trade-offs visible protects your reputation for reliability, which is a junior analyst\'s main currency.']];
 let i=0,sc=0;const draw=()=>{if(i>=Q.length){const p=sc/(Q.length*3);el.innerHTML=`<div class="readout ${p>=.65?'ok':''}"><b>${Math.round(p*100)}%.</b> The pattern behind the best answers: raise issues early, keep disagreements on facts and in private, make others co-owners, and make trade-offs visible.</div><button class="sbtn alt" id="ag">Again</button>`;$('#ag',el).onclick=()=>{i=0;sc=0;draw()};if(p>=.65)done();return}
  const q=Q[i],pm=perm(q[1].length);el.innerHTML=`<div class="eyebrow">Situation ${i+1} of ${Q.length}</div><p><b>${q[0]}</b></p>${pm.map(k=>`<button class="qopt" data-k="${k}">${q[1][k][0]}</button>`).join('')}<div id="w"></div>`;
  $$('.qopt',el).forEach(b=>b.onclick=()=>{const k=+b.dataset.k,s=q[1][k][1];sc+=s;$$('.qopt',el).forEach(x=>{x.disabled=true;const v=q[1][+x.dataset.k][1];if(v===3)x.classList.add('right');else if(x===b)x.classList.add('wrong')});$('#w',el).innerHTML=`<div class="readout">${s===3?'<b>Best response.</b> ':`<b>${s} of 3 points.</b> `}${q[2]}</div><div class="ctl"><span class="spacer"></span><button class="sbtn" id="nx">Next →</button></div>`;$('#nx',el).onclick=()=>{i++;draw()};reveal($('#nx',el))})};draw()};

/* m16 — regression and A/B testing */
const ncdf=z=>{const t=1/(1+.2316419*Math.abs(z)),d=.3989423*Math.exp(-z*z/2),p=d*t*(.3193815+t*(-.3565638+t*(1.781478+t*(-1.821256+t*1.330274))));return z>0?1-p:p};
LABS.stats=(el,m,done)=>{const C=CUST('stats');if(!C.d)C.d='2,24\n3,28\n4,33\n5,34\n6,41\n7,44\n8,45\n9,52\n10,53\n11,60';
 el.innerHTML=`<h4>Regression: advertising spend vs sales</h4><p class="note">One pair per line: x, y (SAR m spend, SAR m sales). Edit freely.</p><div class="grid g2"><textarea id="rd" style="min-height:180px;font-family:var(--mono)">${esc(C.d)}</textarea><div id="ro"></div></div>
 <h4 style="margin-top:16px">A/B test: checkout page</h4><div class="grid g4 g2m">${numIn('va','Visitors A',5000)}${numIn('ca','Conversions A',400)}${numIn('vb','Visitors B',5000)}${numIn('cb','Conversions B',460)}</div><div id="ao"></div>
 <div class="card gold" style="box-shadow:none;margin-top:12px"><div class="eyebrow">Challenge</div><p style="margin:.3rem 0">With the current A/B numbers, what is the <b>two-sided p-value</b>? Is B's lift significant at 95%?</p><div class="row"><input class="tin" id="pv" type="number" step="any" style="max-width:160px" placeholder="e.g. 0.05"><button class="sbtn" id="pc">Check</button></div><div id="pm"></div></div>`;
 let p=1;const reg=()=>{C.d=$('#rd',el).value;const pts=C.d.split('\n').map(l=>l.split(/[,;\s]+/).map(Number)).filter(a=>a.length>=2&&isFinite(a[0])&&isFinite(a[1]));const n=pts.length;if(n<3){$('#ro',el).innerHTML='<p class="note">Need at least 3 points.</p>';return}
   const mx=pts.reduce((a,b)=>a+b[0],0)/n,my=pts.reduce((a,b)=>a+b[1],0)/n;let sxy=0,sxx=0,syy=0;pts.forEach(([x,y])=>{sxy+=(x-mx)*(y-my);sxx+=(x-mx)**2;syy+=(y-my)**2});const b=sxy/sxx,a=my-b*mx,r2=sxy*sxy/(sxx*syy);const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);const x0=Math.min(...xs),x1=Math.max(...xs);
   $('#ro',el).innerHTML=plotXY({x0,x1,y0:Math.min(...ys,a+b*x0)*.9,y1:Math.max(...ys,a+b*x1)*1.05,h:200,dots:pts.map(p=>[p[0],p[1]]),series:[{pts:[[x0,a+b*x0],[x1,a+b*x1]],c:'var(--gold2)'}]})+kv([['Slope (sales per SAR 1 of ads)',fmt(b,2)],['Intercept',fmt(a,2)],['R²',fmt(r2,3)]])+'<p class="note">R² says how much of the variation the line explains — not that ads cause sales. Ask what else moved at the same time.</p>';save()};
 const ab=()=>{const va=V('va',el),ca=V('ca',el),vb=V('vb',el),cb=V('cb',el);const pa=ca/va,pb=cb/vb,pp=(ca+cb)/(va+vb),se=Math.sqrt(pp*(1-pp)*(1/va+1/vb)),z=(pb-pa)/se;p=2*(1-ncdf(Math.abs(z)));
   $('#ao',el).innerHTML=kv([['Conversion A',pct(pa,2)],['Conversion B',pct(pb,2)],['Relative lift',pct((pb-pa)/pa,1)],['z-score',fmt(z,2)]])};
 $('#rd',el).oninput=reg;$$('#va,#ca,#vb,#cb',el).forEach(x=>x.oninput=ab);reg();ab();
 $('#pc',el).onclick=()=>{const g=parseFloat($('#pv',el).value);const ok=Math.abs(g-p)<=Math.max(.003,p*.1);$('#pm',el).innerHTML=`<div class="readout ${ok?'ok':'bad'}"><b>${ok?'Correct':'p ≈ '+fmt(p,3)}</b> — ${p<.05?'significant at 95%: unlikely to be chance alone.':'not significant at 95%: the lift could be noise. Run longer or test a bigger change.'} Two-proportion z-test: z = (p_B − p_A) / √(p(1−p)(1/n_A + 1/n_B)).</div>`;if(ok)done()}};

/* ================= CFA study tracker: coverage of the official 2027 outline, per-module progress, hours, mocks, readiness ================= */
const SLV=['cfa1','cfa2','cfa3'],SLN={cfa1:'Level I',cfa2:'Level II',cfa3:'Level III'},HOURS=300;
function cst(){if(!state.cfa)state.cfa={};const c=state.cfa;c.lv=c.lv||'cfa1';c.pw=c.pw||state.cfaPath||'pm';c.m=c.m||{};c.hrs=c.hrs||[];c.mk=c.mk||[];c.date=c.date||{};return c}
const wmid=w=>(w[0]+w[1])/2;
function modList(lv,pw){const O=CFAO[lv],out=[];O.topics.forEach(t=>t.m.forEach((m,i)=>out.push({id:`${lv}:${t.k}:${i}`,tk:t.k,tn:t.n,w:t.w,t:m[0],n:m[1]})));
  if(lv==='cfa3'){const P=O.paths[pw];P.m.forEach((m,i)=>out.push({id:`cfa3:${pw}:${i}`,tk:'path',tn:'Pathway: '+P.n,w:O.pathW,t:m[0],n:m[1]}))}return out}
function topicsOf(lv,pw){const O=CFAO[lv],T=O.topics.map(t=>({k:t.k,n:t.n,w:t.w}));if(lv==='cfa3')T.push({k:'path',n:'Pathway: '+O.paths[pw].n,w:O.pathW});return T}

function modScore(e){if(!e)return 0;const acc=e.q?e.c/e.q:0,vol=Math.min(1,(e.q||0)/20),s=.35*(e.r?1:0)+.45*acc*vol+.2*((e.cf||0)/5);return e.t&&Date.now()-e.t>45*DAY?s*.85:s}
function studyStats(lv,pw){const c=cst(),L=modList(lv,pw),T=topicsOf(lv,pw);const by={};T.forEach(t=>by[t.k]={...t,mods:[],read:0,q:0,c:0,sc:0});
  L.forEach(m=>{const e=c.m[m.id]||{},b=by[m.tk];b.mods.push(m);if(e.r)b.read++;b.q+=e.q||0;b.c+=e.c||0;b.sc+=modScore(e)});
  T.forEach(t=>{const b=by[t.k];b.mastery=b.mods.length?b.sc/b.mods.length:0});
  const tw=T.reduce((s,t)=>s+wmid(t.w),0),ready=T.reduce((s,t)=>s+wmid(t.w)*by[t.k].mastery,0)/tw;
  const read=L.filter(m=>(c.m[m.id]||{}).r).length,loT=L.reduce((s,m)=>s+m.n,0),loR=L.filter(m=>(c.m[m.id]||{}).r).reduce((s,m)=>s+m.n,0);
  const q=L.reduce((s,m)=>s+((c.m[m.id]||{}).q||0),0),cc=L.reduce((s,m)=>s+((c.m[m.id]||{}).c||0),0);
  const hrs=c.hrs.filter(h=>h[2]===lv).reduce((s,h)=>s+h[1],0);const mk=c.mk.filter(x=>x[1]===lv).sort((a,b)=>a[0]-b[0]);
  const mkAvg=mk.length?mk.slice(-2).reduce((s,x)=>s+x[2],0)/Math.min(2,mk.length)/100:null;
  const combined=mkAvg==null?ready:.6*ready+.4*mkAvg;
  return{L,T,by,ready,combined,mkAvg,mk,read,total:L.length,loT,loR,q,c:cc,hrs}}
function weeksLeft(lv){const d=cst().date[lv];if(!d)return null;const ms=new Date(d+'T09:00:00')-Date.now();return ms/(7*DAY)}
function vStudy(lvArg){const c=cst();if(lvArg&&CFAO[lvArg]&&c.lv!==lvArg){c.lv=lvArg;save()}const lv=c.lv,pw=c.pw,S=studyStats(lv,pw),col=tcol(lv);
  const wl=weeksLeft(lv),need=wl&&wl>0?Math.max(0,(HOURS-S.hrs)/wl):null;
  const band=x=>x>=.7?'var(--ok)':x>=.5?'var(--gold2)':'var(--bad)';
  const focus=S.L.map(m=>{const e=c.m[m.id]||{},b=S.by[m.tk];return{m,e,pri:wmid(m.w)/b.mods.length*(1-modScore(e))}}).sort((a,b)=>b.pri-a.pri).slice(0,6);
  const due=S.L.map(m=>({m,e:c.m[m.id]||{}})).filter(x=>x.e.r&&x.e.t&&Date.now()-x.e.t>30*DAY).sort((a,b)=>a.e.t-b.e.t).slice(0,6);
  const appM=k=>Object.values(M).filter(m=>m.track===lv&&(m.topic===k)).map(m=>`<a href="#/m/${m.id}">${m.id}</a>`).join(' ');
  const wk=[...Array(8)].map((_,i)=>{const end=Date.now()-(7-i)*7*DAY+7*DAY,start=end-7*DAY;return c.hrs.filter(h=>h[2]===lv&&h[0]>=start&&h[0]<end).reduce((s,h)=>s+h[1],0)}),wmx=Math.max(10,...wk);
  view().innerHTML=`<div style="--tc:${col.c}"><a href="#/tracks" class="note">← Tracks</a><div class="mhead"><span class="tile">${ico('target',28)}</span><div><div class="eyebrow">CFA study tracker · 2027 curriculum</div><h1 style="margin:2px 0">${SLN[lv]}</h1><p class="note" style="margin:0">${CFAO[lv].fmt}. Coverage is measured against every learning module in CFA Institute's published 2027 outline.</p></div></div>
  <div class="chips" style="margin:8px 0">${SLV.map(k=>`<button class="chip ${k===lv?'on':''}" data-lv="${k}">${SLN[k]}</button>`).join('')}${lv==='cfa3'?`<select class="tin" id="spw" style="max-width:220px;margin-left:6px">${Object.entries(CFAO.cfa3.paths).map(([k,p])=>`<option value="${k}" ${k===pw?'selected':''}>${p.n} pathway</option>`).join('')}</select>`:''}</div>
  <div class="grid g4 g2m" style="margin:10px 0">
   <div class="stat"><small>Readiness</small><b style="color:${band(S.combined)}">${Math.round(S.combined*100)}%</b><small>${S.mkAvg==null?'from module progress':'60% modules + 40% recent mocks'}</small></div>
   <div class="stat"><small>Coverage</small><b>${S.read}/${S.total}</b><small>modules read · ${Math.round(S.loR/S.loT*100)}% of outcomes</small></div>
   <div class="stat"><small>Practice accuracy</small><b>${S.q?Math.round(S.c/S.q*100)+'%':'—'}</b><small>${fmt(S.q)} questions logged</small></div>
   <div class="stat"><small>Study hours</small><b>${fmt(S.hrs,1)}/${HOURS}</b><small>${need!=null?fmt(need,1)+' h/week to exam':'set your exam date'}</small></div></div>
  <div class="grid g2">
  <div class="card"><h3>Log a study session</h3><div class="grid g2">
    <div><label class="f">Date</label><input class="tin" type="date" id="sd" value="${new Date().toISOString().slice(0,10)}"></div>
    <div><label class="f">Hours</label><input class="tin" type="number" step="0.25" min="0" id="sh" value="1.5"></div></div>
   <label class="f">Learning module (optional)</label><select class="tin" id="sm"><option value="">— general study —</option>${S.T.map(t=>`<optgroup label="${esc(t.n)}">${S.L.filter(m=>m.tk===t.k).map(m=>`<option value="${m.id}">${esc(m.t)}</option>`).join('')}</optgroup>`).join('')}</select>
   <div class="grid g3"><div><label class="f">Questions done</label><input class="tin" type="number" min="0" id="sq" value="0"></div><div><label class="f">Correct</label><input class="tin" type="number" min="0" id="sc" value="0"></div><div><label class="f">Read in curriculum?</label><select class="tin" id="sr"><option value="">no change</option><option value="1">Yes, finished</option></select></div></div>
   <div class="ctl"><button class="sbtn" id="slog">Save session</button><span class="note" id="smsg"></span></div>
   <p class="note">Log practice from the CFA Institute Learning Ecosystem or your prep provider, by module, so accuracy and coverage reflect real exam preparation.</p></div>
  <div class="card"><h3>Exam date and mocks</h3><label class="f">Planned ${SLN[lv]} exam date</label><input class="tin" type="date" id="sxd" value="${c.date[lv]||''}">
   <p class="note">${wl!=null?(wl>0?`${Math.ceil(wl*7)} days left.`:'Exam date has passed.'):'Set the date to see the weekly pace you need.'}</p>
   <label class="f">Log a full mock exam (score %)</label><div class="row"><input class="tin" type="number" min="0" max="100" id="mks" placeholder="e.g. 68" style="max-width:110px"><select class="tin" id="mksrc" style="max-width:220px"><option>CFA Institute mock</option><option>CFA Institute practice pack</option><option>Prep provider mock</option><option>Launchpad simulator</option></select><button class="sbtn" id="mkb">Add</button></div>
   ${S.mk.length?`<div class="tablewrap" style="margin-top:8px"><table class="t"><tr><th>Date</th><th>Source</th><th>Score</th></tr>${S.mk.slice(-6).reverse().map(x=>`<tr><td>${new Date(x[0]).toLocaleDateString('en-GB')}</td><td>${esc(x[3])}</td><td><b style="color:${band(x[2]/100)}">${x[2]}%</b></td></tr>`).join('')}</table></div>`:'<p class="note">No mocks logged yet. Full timed mocks are the best single readiness signal; most candidates aim for 70%+ on quality mocks in the final weeks.</p>'}</div></div>
  <div class="grid g2">
  <div class="card"><h3>Focus next</h3><p class="note">Highest exam weight per module, least mastered.</p>${focus.map(x=>`<div class="row" style="padding:6px 0;border-bottom:1px dashed var(--line);flex-wrap:nowrap"><span style="font-size:.92rem;flex:1;min-width:0">${esc(x.m.t)}<br><small class="muted">${esc(x.m.tn)} · ${x.m.n} outcomes</small></span><span class="spacer"></span><small>${Math.round(modScore(x.e)*100)}%</small></div>`).join('')}</div>
  <div class="card"><h3>Due for review</h3><p class="note">Read modules not revisited for 30+ days. Mastery decays after 45 days.</p>${due.length?due.map(x=>`<div class="row" style="padding:6px 0;border-bottom:1px dashed var(--line);flex-wrap:nowrap"><span style="font-size:.92rem;flex:1;min-width:0">${esc(x.m.t)}<br><small class="muted">last ${new Date(x.e.t).toLocaleDateString('en-GB')}</small></span><span class="spacer"></span><button class="sbtn sm alt" data-rv="${x.m.id}">Reviewed</button></div>`).join(''):'<p class="note">Nothing due.</p>'}</div></div>
  <div class="card"><h3>Weekly hours (last 8 weeks)</h3><div style="display:flex;gap:6px;align-items:flex-end;height:110px">${wk.map((h,i)=>`<div style="flex:1;text-align:center"><div style="height:${h/wmx*90}px;background:var(--tc);border-radius:4px 4px 0 0;min-height:2px" title="${fmt(h,1)} h"></div><small class="muted">${fmt(h,0)}</small></div>`).join('')}</div><p class="note">${HOURS} hours per level is CFA Institute's average guidance: about 15 hours a week over 20 weeks.</p></div>
  <div class="card"><h3>Coverage by topic</h3><p class="note">Tap a topic to update each learning module. Mastery = 35% read + 45% practice accuracy (full credit from 20 questions) + 20% confidence.</p>
  ${S.T.map(t=>{const b=S.by[t.k];return`<details class="exhibit" style="margin:8px 0"><summary><div class="row" style="display:inline-flex;width:calc(100% - 20px)"><b style="font-size:.95rem">${esc(t.n)}</b><span class="spacer"></span><small class="muted">${t.w[0]}–${t.w[1]}%</small></div><div class="row note" style="margin-top:4px"><span>read ${b.read}/${b.mods.length}</span><span>·</span><span>accuracy ${b.q?Math.round(b.c/b.q*100)+'% ('+b.q+')':'—'}</span><span class="spacer"></span><b style="color:${band(b.mastery)}">${Math.round(b.mastery*100)}%</b></div><div class="prog" style="margin:4px 0 0"><i style="width:${b.mastery*100}%;background:${band(b.mastery)}"></i></div></summary>
   ${appM(t.k)?`<p class="note">Launchpad reinforcement: ${appM(t.k)}</p>`:''}
   <div class="tablewrap"><table class="t"><tr><th>Learning module</th><th>Read</th><th>Practice</th><th>Confidence</th></tr>${b.mods.map(m=>{const e=c.m[m.id]||{};return`<tr><td style="min-width:180px">${esc(m.t)}<br><small class="muted">${m.n} outcomes${e.t?' · '+new Date(e.t).toLocaleDateString('en-GB'):''}</small></td><td><input type="checkbox" data-rd="${m.id}" ${e.r?'checked':''} style="width:20px;height:20px"></td><td>${e.q?`${e.c}/${e.q}`:'—'}</td><td><select class="tin" data-cf="${m.id}" style="padding:4px;min-width:58px">${['–',1,2,3,4,5].map((v,j)=>`<option value="${j}" ${(e.cf||0)===j?'selected':''}>${v}</option>`).join('')}</select></td></tr>`}).join('')}</table></div></details>`}).join('')}</div>
  <div class="card"><h3>How to use this honestly</h3><p class="note">Launchpad's Investment Foundations missions reinforce concepts; they are not a substitute for the official curriculum. Read each module in the CFA Institute Learning Ecosystem, do its practice questions, then log them here. Treat readiness as a guide: CFA Institute does not publish a minimum passing score. <a href="${CFAO_SRC[lv]}" target="_blank" rel="noopener">Official ${SLN[lv]} outline and weights</a>.</p></div></div>`;
  const touch=id=>{c.m[id]=c.m[id]||{};return c.m[id]};
  $$('[data-lv]').forEach(b=>b.onclick=()=>{c.lv=b.dataset.lv;save();vStudy()});
  const sp=$('#spw');if(sp)sp.onchange=()=>{c.pw=sp.value;state.cfaPath=sp.value;save();vStudy()};
  $$('[data-rd]').forEach(x=>x.onchange=()=>{const e=touch(x.dataset.rd);e.r=x.checked?1:0;e.t=Date.now();save();logEvent('study','',(x.checked?'Read: ':'Unread: ')+modName(x.dataset.rd));keepOpen()});
  $$('[data-cf]').forEach(x=>x.onchange=()=>{const e=touch(x.dataset.cf);e.cf=+x.value;e.t=Date.now();save();keepOpen()});
  $$('[data-rv]').forEach(x=>x.onclick=()=>{touch(x.dataset.rv).t=Date.now();save();logEvent('study','','Reviewed: '+modName(x.dataset.rv));vStudy()});
  $('#sxd').onchange=e=>{c.date[lv]=e.target.value;save();vStudy()};
  $('#mkb').onclick=()=>{const s=parseFloat($('#mks').value);if(!(s>=0&&s<=100)){toast('Enter a score from 0 to 100');return}c.mk.push([Date.now(),lv,Math.round(s),$('#mksrc').value]);save();logEvent('mock','',`${SLN[lv]} mock (${$('#mksrc').value}): ${Math.round(s)}%`);addXP(25);vStudy()};
  $('#slog').onclick=()=>{const h=parseFloat($('#sh').value)||0,q=parseInt($('#sq').value)||0,k=parseInt($('#sc').value)||0,mid_=$('#sm').value,rd=$('#sr').value;
    if(k>q){$('#smsg').textContent='Correct cannot exceed questions done.';return}if(!h&&!q&&!rd){$('#smsg').textContent='Nothing to save yet.';return}
    if(q&&!mid_){$('#smsg').textContent='Choose the module the questions belong to.';return}
    const ts=new Date($('#sd').value+'T12:00:00').getTime()||Date.now();if(h)c.hrs.push([ts,h,lv,mid_]);
    if(mid_){const e=touch(mid_);if(q){e.q=(e.q||0)+q;e.c=(e.c||0)+k}if(rd)e.r=1;e.t=Date.now()}
    if(c.hrs.length>1500)c.hrs=c.hrs.slice(-1500);save();logEvent('study','',`${SLN[lv]}: ${h} h${mid_?' · '+modName(mid_):''}${q?` · ${k}/${q} correct`:''}`);if(h)addXP(Math.round(10*h));toast('Session saved');vStudy()};
  function keepOpen(){const open=$$('details.exhibit').map((d,i)=>d.open?i:-1).filter(i=>i>=0),y=scrollY;vStudy();$$('details.exhibit').forEach((d,i)=>{if(open.includes(i))d.open=true});scrollTo(0,y)}}
function modName(id){const [lv,tk,i]=id.split(':');if(tk==='pm'||tk==='pmk'||tk==='pw'){if(lv==='cfa3'&&CFAO.cfa3.paths[tk])return CFAO.cfa3.paths[tk].m[+i][0]}const t=CFAO[lv].topics.find(t=>t.k===tk);return t?t.m[+i][0]:id}
/* compact summary for the Follow page and home */
function studySummaryHTML(st){const c=st.cfa;if(!c||!(Object.keys(c.m||{}).length||(c.hrs||[]).length||(c.mk||[]).length))return'';const save0=state;let html='';
  try{state=st;const lv=c.lv||'cfa1',S=studyStats(lv,c.pw||'pm'),wk=(c.hrs||[]).filter(h=>h[0]>Date.now()-7*DAY).reduce((s,h)=>s+h[1],0),wl=weeksLeft(lv);
   html=`<div class="card"><h3>CFA study (${SLN[lv]}, 2027 outline)</h3><div class="grid g4 g2m"><div class="stat"><small>Readiness</small><b>${Math.round(S.combined*100)}%</b></div><div class="stat"><small>Modules read</small><b>${S.read}/${S.total}</b></div><div class="stat"><small>Accuracy</small><b>${S.q?Math.round(S.c/S.q*100)+'%':'—'}</b><small>${fmt(S.q)} questions</small></div><div class="stat"><small>Hours</small><b>${fmt(S.hrs,1)}</b><small>${fmt(wk,1)} this week${wl!=null&&wl>0?' · '+Math.ceil(wl*7)+' days to exam':''}</small></div></div>
   ${S.mk.length?`<p class="note">Latest mock: <b>${S.mk[S.mk.length-1][2]}%</b> (${esc(S.mk[S.mk.length-1][3])}, ${new Date(S.mk[S.mk.length-1][0]).toLocaleDateString('en-GB')})</p>`:''}
   <div class="tablewrap"><table class="t"><tr><th>Topic</th><th>Weight</th><th>Read</th><th>Mastery</th></tr>${S.T.map(t=>{const b=S.by[t.k];return`<tr><td>${esc(t.n)}</td><td>${t.w[0]}–${t.w[1]}%</td><td>${b.read}/${b.mods.length}</td><td><b>${Math.round(b.mastery*100)}%</b></td></tr>`}).join('')}</table></div></div>`}catch(e){html=''}finally{state=save0}return html}

boot();
</script>
